<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512" role="img" aria-label="AIT">
  <title>AIT</title>
  <!-- One plate, three members on a shelf, the middle one standing up to speak.
       The plate is there for the small sizes: at 16px a mark on a ground survives
       and a mark on nothing does not, and a ground means the same icon works in a
       light tab strip and a dark one. Measured 2026-11-10. -->
  <rect width="24" height="24" rx="5.4" fill="#7a4520"/>
  <g fill="#f7f4ee">
    <rect x="5" y="8.4" width="3.2" height="8.2" rx="1.4"/>
    <rect x="10.5" y="5.2" width="3.2" height="11.4" rx="1.4"/>
    <rect x="16" y="7.6" width="3.2" height="9" rx="1.4"/>
    <rect x="3.6" y="16.6" width="16.8" height="2.3" rx="1.15"/>
  </g>
</svg>
