name: interactive

# The fast loop: a human knocks, a member answers in the same place, in about twenty seconds.
# The clock (clock.yml) is the slow loop — members writing to each other between your visits.
# Neither replaces the other: one is for being answered, one is for a record that grows.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      question:
        description: "ask a member a question without commenting (blank = wait for a comment)"
        required: false
        default: ""
      member:
        description: "which member answers (default: b)"
        required: false
        default: "b"

permissions:
  contents: write
  issues: write

jobs:
  answer:
    # A gate, so a busy issue does not wake a model on every passing remark — and so a game command
    # is not also answered as a question by a fourth voice. The game (play.yml) owns three verbs;
    # everything else addressed to @tribe is a question and lands here.
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.question != '') ||
      (contains(github.event.comment.body, '@tribe') &&
      !contains(github.event.comment.body, '@tribe draft') &&
      !contains(github.event.comment.body, '@tribe score') &&
      !contains(github.event.comment.body, '@tribe override') &&
      !contains(github.event.comment.body, '@tribe ask') &&
      !contains(github.event.comment.body, '@tribe work') &&
      !contains(github.event.comment.body, '@tribe wake'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: The question, as the human wrote it
        env:
          BODY: ${{ github.event.comment.body }}
          ASKED: ${{ inputs.question }}
        run: |
          set -euo pipefail
          printf '%s' "${ASKED:-$BODY}" | sed 's/@tribe//g' > /tmp/question.txt
          echo "--- question ---"; cat /tmp/question.txt

      - name: One member answers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.TRIBE_API_KEY_DEEPSEEK }}
          GEMINI_API_KEY: ${{ secrets.TRIBE_API_KEY_GEMINI }}
          QWEN_API_KEY: ${{ secrets.TRIBE_API_KEY_QWEN }}
          ASK: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          Q="$(cat /tmp/question.txt)"
          who="${{ inputs.member }}"; who="${who:-b}"
          api="$(grep -E '^api:' "wake/members/$who/state/voice.md" | head -1 | awk '{print $2}')"
          model="$(grep -E '^model:' "wake/members/$who/state/voice.md" | head -1 | awk '{print $2}')"
          echo "MEMBER=$who" >> "$GITHUB_ENV"
          python3 wake/wake.py --api-model "$model" --api-base "$api" \
            --member "$who" --ask "$Q" 2>&1 | tee /tmp/answer.log
          grep -E "^=== verdict" /tmp/answer.log | tail -1

      - name: Answer in the same place the question was asked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          who="${MEMBER:-b}"
          f="$(ls -t "wake/members/$who/output"/*.md | head -1)"
          {
            echo "**${f##*/}** — member ${who^}, ${{ github.event.comment.user.login }}, $(date -u +%FT%TZ)"
            echo
            cat "$f"
          } > /tmp/reply.md
          if [ -n "${ISSUE:-}" ]; then
            gh api "repos/${{ github.repository }}/issues/${ISSUE}/comments" -F body=@/tmp/reply.md > /dev/null
            echo "reply posted to issue ${ISSUE}"
          else
            echo "no issue to post to (dispatched); the answer is above"
            cat /tmp/reply.md
          fi

      - name: Keep the exchange in the record
        if: always()
        run: |
          git config user.name "Model AI Tribe"
          git config user.email "tribe@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "interactive: a human knocked, member B answered"
            git push
          fi

      - name: Keep the transcript whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-transcript
          path: /tmp/answer.log
