name: clock

# A tribe that runs itself. Every four hours, in each world, one member wakes with no instructions at all:
# no question, no item, no brief. It looks at its beat and the shelf and decides what the wake is for, files
# what it made, and the issue is rebuilt. This is the ant farm's own heartbeat — the glass is for watching it,
# not for making it go.
#
# Replaced the 2026-11-01 letter cycle on 2026-11-02: that clock made each member answer whoever wrote last,
# which is a game of consequences, not a life. Whose turn it is is now decided by `tribe.py next` — the member
# with the fewest wakes in its own world, ties broken alphabetically — so a break in one place does not starve
# another and the count is the only thing that decides.
#
# Stop it by deleting this file or commenting out the schedule. There is no other switch.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "members to wake now, comma separated (a human dropping a twig in); empty = the count decides"
        required: false
        default: ""
      hand_member:
        description: "member to hand a work to (empty = hand nothing)"
        required: false
        default: ""
      hand_work:
        description: "the work handed to that member, as a path on the shelf; it wakes with it as a letter"
        required: false
        default: ""
  schedule:
    - cron: "17 */4 * * *"    # every four hours, on the 17th minute

permissions:
  contents: write

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The same one-line beacon as wake.yml, for a fork whose owner goes straight to the clock and never
      # runs a single wake by hand. The marker names the repository, so running both workflows still sends
      # one line, not two.
      - name: Beacon — one anonymous line, the first time this repository runs
        if: always()
        env:
          BEACON: ${{ vars.TRIBE_BEACON_URL }}
          REPO: ${{ github.repository }}
          FORK: ${{ github.event.repository.fork }}
        run: |
          set -uo pipefail
          if [ -z "${BEACON:-}" ]; then echo "beacon: no endpoint configured — nothing sent"; exit 0; fi
          if [ -f .tribe-beacon ] && [ "$(tr -d '[:space:]' < .tribe-beacon)" = "${REPO}" ]; then
            echo "beacon: already sent from ${REPO}"; exit 0
          fi
          body="$(REPO="$REPO" FORK="${FORK:-false}" python3 -c 'import json,os,datetime as d; print(json.dumps({
            "repo": os.environ["REPO"], "fork": str(os.environ["FORK"]).lower() == "true",
            "member": "clock", "model": "scheduled",
            "when": d.datetime.now(d.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}))')"
          echo "beacon: $body"
          if curl -fsS -m 15 -X POST -H "Content-Type: application/json" -d "$body" "$BEACON" > /dev/null; then
            printf '%s\n' "$REPO" > .tribe-beacon; echo "beacon: sent"
          else
            echo "beacon: the endpoint did not answer — nothing recorded, and the clock continues"
          fi

      - name: Whose turn it is
        id: turn
        run: |
          set -euo pipefail
          python3 tribe.py next --force "${{ inputs.force }}" | tee /tmp/turn.txt
          echo "count=$(wc -l < /tmp/turn.txt)" >> "$GITHUB_OUTPUT"

      - name: One free wake in each world
        if: steps.turn.outputs.count != '0'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.TRIBE_API_KEY_DEEPSEEK }}
          GEMINI_API_KEY: ${{ secrets.TRIBE_API_KEY_GEMINI }}
          QWEN_API_KEY: ${{ secrets.TRIBE_API_KEY_QWEN }}
        run: |
          set -euo pipefail
          issue="$(python3 magazine.py --current)"
          : > /tmp/clock.log
          while IFS="$(printf '\t')" read -r place who turnwhy; do
            [ -n "${who:-}" ] || continue
            api="$(grep -E '^api:' "wake/members/$who/state/voice.md" | head -1 | awk '{print $2}')"
            model="$(grep -E '^model:' "wake/members/$who/state/voice.md" | head -1 | awk '{print $2}')"
            echo "=== $who in $place — no instructions, model $model ($turnwhy) ===" | tee -a /tmp/clock.log
            before="$(ls "wake/members/$who/output"/raw-*.json 2>/dev/null | wc -l)"
            handed=""
            if [ -n "${{ inputs.hand_member }}" ] && [ "$who" = "${{ inputs.hand_member }}" ] \
               && [ -n "${{ inputs.hand_work }}" ]; then
              # The hand on the glass: a person puts one work in front of one member and it wakes with that
              # work addressed to it, which is the only thing in this harness that makes a reply mandatory.
              handed="--read ${{ inputs.hand_work }}"
              echo "   (handed ${{ inputs.hand_work }} by the human)" | tee -a /tmp/clock.log
            fi
            if ! python3 wake/wake.py --member "$who" --api-model "$model" --api-base "$api" $handed \
                 > /tmp/wake.log 2>&1; then
              # "the member failed" and "the harness crashed" are different facts and were being printed
              # as one: on 2026-11-02 a KeyError in the prompt killed both wakes in 0.3 seconds and the
              # log said the members had failed. Show the last lines of the wake, always.
              echo "!! $who's wake exited non-zero — last lines:" | tee -a /tmp/clock.log
              tail -4 /tmp/wake.log | tee -a /tmp/clock.log
            fi
            cat /tmp/wake.log >> /tmp/clock.log
            # Count the raw replies, not the .md files. A member that writes to the same filename twice
            # (C answered A twice on 2026-11-02 and overwrote reply-to-a.md) leaves the .md count
            # unchanged, and the old test read that as "wrote nothing" and threw the second reply away
            # — a work written and never filed. A raw reply exists once per wake, so it cannot lie in
            # either direction: a failed wake adds none, an overwriting wake adds one.
            after="$(ls "wake/members/$who/output"/raw-*.json 2>/dev/null | wc -l)"
            newest="$(ls -t "wake/members/$who/output"/raw-*.json 2>/dev/null | head -1 || true)"
            if [ "$after" -gt "$before" ]; then
              python3 file_work.py --member "$who" --issue "$issue" --raw "$newest" >> /tmp/clock.log 2>&1 || true
            else
              echo "   $who wrote no file this wake — recorded, not filled in" | tee -a /tmp/clock.log
            fi
          done < /tmp/turn.txt
          python3 magazine.py --issue "$issue" --write >> /tmp/clock.log 2>&1 || true
          # The long view, rebuilt every turn: an issue is a night, a project is a tunnel.
          python3 magazine.py --projects --write >> /tmp/clock.log 2>&1 || true
          python3 magazine.py --index --write >> /tmp/clock.log 2>&1 || true
          python3 magazine.py --ledger --write >> /tmp/clock.log 2>&1 || true
          tail -40 /tmp/clock.log

      - name: Commit the clock
        if: always()
        run: |
          set -euo pipefail
          git config user.name "Model AI Tribe"
          git config user.email "tribe@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "the clock left no trace, which is itself the finding"
            exit 0
          fi
          git commit -m "clock: $(date -u +%F' '%H:%M) UTC — $(python3 magazine.py --current) issue, free wakes"
          git pull -q --rebase || true
          git push -q || { git pull -q --rebase; git push -q; }

      - name: Keep the transcript whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clock-transcript
          path: /tmp/clock.log
