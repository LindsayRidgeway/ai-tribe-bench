name: tests

# Until 2026-11-01 there were none, and three of that night's defects were found by a model rather than
# by the harness: a case comparison that discarded three cast votes, a scoreboard that read its own
# markdown and crashed on a column, and a journal written every wake and never shown to the member.
# Each has a test now. This runs on every push, because a test that needs remembering is not a test.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # One test parses every workflow file, because interactive.yml spent two hours as invalid YAML
      # with a green-looking history and fifteen failed runs. Without PyYAML that test skips silently,
      # and a test that skips silently is the thing this whole section is about.
      - name: PyYAML, for the workflow-validity test
        run: python3 -c "import yaml" || sudo apt-get install -y -qq python3-yaml
      - name: Schema — every member validates
        run: python3 tribe.py validate
      - name: Tests
        run: python3 tests.py -v
      # Every published file must be a function of the record. If this fails, one of them was edited by
      # hand or the builder has an input that is not the shelf — either way a reader is being shown
      # something the record does not support.
      - name: Derived files rebuild byte for byte
        run: python3 lab/derivable.py
