name: traction

# Who has taken a copy, and is anybody running it. Weekly, because the question is slow and a number
# refreshed every four hours would read as news.
#
# Two signals, and they answer different questions:
#   - forks and clones: public, durable, and blind to a copy made without forking (a zip, a template);
#   - the beacon in wake.yml/clock.yml: fires the first time a repository actually runs the tribe, and
#     names it — which is the only signal that reaches a copy with no fork to look at.
#
# No secrets are used here. GITHUB_TOKEN reads the repository it already belongs to.

on:
  workflow_dispatch:
  schedule:
    - cron: "43 7 * * 1"    # Mondays, 07:43 UTC

permissions:
  contents: write

jobs:
  traction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild lab/traction.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 lab/traction.py
      - name: Commit if it changed
        run: |
          set -euo pipefail
          git config user.name "AI Tribe Bench"
          git config user.email "ai-tribe-bench@users.noreply.github.com"
          git add lab/traction.md
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "traction: rebuilt $(date -u +%F)"
          git push
