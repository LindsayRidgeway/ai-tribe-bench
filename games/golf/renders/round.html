     a ball resting on the hole. */
  const below = Math.max(0, -p[3]) / 0.33;
  if (below > 0.92) return;
  ctx.save();
  if (below > 0) ctx.globalAlpha = 1 - below * 0.9;
  ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fillStyle = "#ffffff"; ctx.fill();
  ctx.beginPath(); ctx.arc(q.x - r * 0.25, q.y - r * 0.25, r * 0.45, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.fill();
  ctx.restore();
}

/* ---- the film: one shot at a time, then the next ------------------------------------------------
   The whole thing is one function of time — `at(t)` says which frame of which shot is on screen at second
   `t` — so a still can be pinned from the address bar (`the-face.html#t=6.2`), which is how a record gets a
   picture out of a film. Nothing here is stateful but the clock. */
const shots = (scene.shots || []).map(s => {
  let path = truncate(s.path, s.stop_at, s.start);
  /* A putt the game says went in ends *in the cup*, and `putt.roll` stops at the plane through the hole because
     that is the last thing physics has to say about it. Four inches of fall are added here, with the path's own
     last point as the centre, because the alternative is a ball that arrives at the hole and stops on top of it —
     which is what the film did before this pass and looked like a ball that had missed by nothing at all. */
  if (s.holed && path && path.length) {
    const last = path[path.length - 1];
    for (let k = 1; k <= 7; k++) {
      const u = k / 7;
      path.push([last[0] + 0.055 * k, last[1], last[2], -0.33 * u * u]);
    }
  }
  return { ...s, path, dur: path && path.length ? path[path.length - 1][0] : 1.0 };
});
const PRE = 3.2;                           // standing still before a ball moves, in seconds
const START = [], BEAT = [];               // when each shot begins on the film's clock, and how long it holds first
let total = 0;
for (let k = 0; k < shots.length; k++) {
  const s = shots[k];
  /* The opening establishing frame belongs to the first shot; a film that crosses holes — the round film does —
     carries a `view` on the first shot of each hole, so every hole gets its own three seconds of standing still
     before a ball moves. That is the cheapest thing a film can do for a viewer who has lost track of the hole:
     stop, show him the hole, then play it. */
  const beat = (s.view || (k === 0 && scene.view)) ? PRE : 0;
  START.push(total); BEAT.push(beat);
  total += beat + s.dur + 1.6;
}
function at(t) {
  if (!shots.length) return { wide: false, i: 0, shown: 0, wt: 0 };
  let i = 0;
  for (let k = shots.length - 1; k >= 0; k--) if (t >= START[k]) { i = k; break; }
  const local = t - START[i];
  if (local < BEAT[i]) return { wide: true, i, wt: local, shown: 0 };
  return { wide: false, i, wt: local - BEAT[i], shown: Math.min(Math.max(0, local - BEAT[i]), shots[i].dur) };
}
const dots = document.getElementById("dots");
const el = document.getElementById("now");
function caption(f) {
  if (f.wide) {
    const v = viewOf(shots[f.i]);
    el.innerHTML = `<b>the hole</b> · ${(v && v.label) || "from behind the ball"}`;
    dots.textContent = shots.map(() => "•").join(" ");
    return;
  }
  const s = shots[f.i];
  el.innerHTML = `<b>${f.i + 1}/${shots.length}</b> · ${s.label}` +
                 (s.result ? ` — <span style="color:#9fb8ad">${s.result}</span>` : "");
  dots.textContent = shots.map((_, k) => k === f.i ? "●" : "•").join(" ");
}
let current = null;                        // the frame on screen, so a resize can put it back
function draw(f) {
  current = f;
  const s = shots[f.i], v = viewOf(s), feet = feetOf(s);
  LENS = scene.fov || 42;
  let cam;
  if (f.wide) {
    /* The establishing frame breathes: it walks six per cent of the way to its target over the hold, so a frame
       that stands still for three seconds is not a still. That is a dolly, and it is the only camera move in the
       film that no ball is responsible for. */
    const k = 0.06 * ease(f.wt / Math.max(0.001, BEAT[f.i]));
    cam = basis([mix(v.pos[0], v.target[0], k), mix(v.pos[1], v.target[1], k), mix(v.pos[2], v.target[2], k)],
                v.target);
  } else {
    cam = shotCamera(s, f.shown);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  const sky = ctx.createLinearGradient(0, 0, 0, cv.clientHeight / DPR);
  sky.addColorStop(0, "#16261f"); sky.addColorStop(1, "#0d1512");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, cv.clientWidth / DPR, cv.clientHeight / DPR);
  ground(cam, feet);
  /* The faded trail is the round so far *on this hole*. A round film changes hole between shots, and a trail
     from the fourth hole drawn across the seventh is a line through a place it was never hit. */
  const here = s.hole;
  for (let k = 0; k < f.i; k++) if (shots[k].hole === here)
    drawPath(cam, shots[k].path, 1e9, "rgba(255,212,121,0.22)", 1.2);
  if (!f.wide) drawPath(cam, s.path, f.shown, "#ffd479", 2.0);
  const b = ballAt(s.path, f.shown);
  if (b) { shadow(cam, b); drawBall(cam, b); }
  scaleBar(cam, b ? [b[1], b[2], b[3]] : [feet.centre[0], feet.centre[1], 0]);
}
/* A still, if the address asks for one: `#t=6.2` draws exactly that second. Drawn synchronously, not on the
   next animation frame, because a headless browser asked for a screenshot does not always wait for one. */
const pinned = (m => m ? parseFloat(m[1]) : null)(/^#t=([0-9.]+)$/.exec(location.hash || ""));
function frame() {
  const t = ((performance.now() - t0) / 1000) % total;
  const f = at(t);
  draw(f);
  caption(f);
  requestAnimationFrame(frame);
}
function resize() {
  /* Setting a canvas's width clears it, so a window that is resized goes black and stays black: the pinned
     still never runs again and the animation loop is not running at all. Found by taking screenshots with a
     long virtual-time budget — the frame drew, the layout settled, the canvas cleared itself, and the picture
     was gone. The page had this fault before this pass and nobody had resized it. */
  cv.width = Math.floor(cv.clientWidth * DPR); cv.height = Math.floor(cv.clientHeight * DPR);
  if (current) draw(current);
}
let t0 = 0;
addEventListener("resize", resize);
resize();
if (pinned != null) {
  const f = at(Math.min(pinned, total - 0.05));
  const still = () => { resize(); draw(f); caption(f); };
  still();                                   // now, in case the browser never runs another frame
  requestAnimationFrame(still);              // and again once the layout is settled, in case it does
  document.getElementById("bar").insertAdjacentHTML("beforeend",
    `<div style="color:#5f726a;font-size:11.5px">still at ${pinned.toFixed(1)} s of ${total.toFixed(1)}</div>`);
} else {
  t0 = performance.now();
  requestAnimationFrame(frame);
}
</script>
