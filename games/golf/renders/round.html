    const pos = [cx + uy * D, cy - ux * D, Math.max(11, Math.min(260, 0.16 * D))];
    const drift = 0.06 * ease(prog);
    const aim = [mix(cx, land[1], drift), mix(cy, land[2], drift), Math.max(1.2, Math.min(top * 0.5, 40.0))];
    LENS = scene.fov || 44;
    return basis(pos, aim);
  }
  /* A short shot is framed from behind the ball looking at the face, low and close, with a modest lens. The
     face then reads as what it is — a horizontal band across the frame eighteen inches above the sand — and the
     question the lip asks, "was the ball above that band when it crossed", is answered by the eye without any
     arithmetic. From the side the same shot would show the ball travelling toward the wall edge-on, and the
     band would be a line with no width, which is a worse picture of the same fact. */
  if (s.face != null) {
    /* A ball with a face to climb and less than a full swing between it and the green: the cross-section.
       The camera stands behind the ball, low, looking at the band of sand — from here the question the lip
       asks is answered by the eye, because "was the ball above that line when it crossed" is a comparison of
       two things at the same distance. */
    LENS = 30;
    const back = 26, high = 8, beside = 9;   // a little to one side, so the arc curves on the screen
    return basis([s.start[0] - ux * back - uy * beside, s.start[1] - uy * back + ux * beside, high],
                 [s.start[0] + ux * 7, s.start[1] + uy * 7, 1.0]);
  }
  /* A ball with no face to climb — played out sideways, or a putt that ran off the edge: there is no height to
     read, so the camera goes up, where the bunker is a band on the ground and the ball is a dot leaving it. */
  LENS = 44;
  return basis([s.start[0] - ux * 30, s.start[1] - uy * 30, 26],
               [s.start[0] + ux * 8, s.start[1] + uy * 8, 0.0]);
}

/* ---- the ground ---------------------------------------------------------------------------------- */
function ellipsePoly(cx, cy, a, b, n = 96) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = i / n * Math.PI * 2;
    out.push([cx + Math.cos(t) * a, cy + Math.sin(t) * b, 0]);
  }
  return out;
}
function fillPoly(cam, pts, fill, stroke) {
  const focal = FOCAL();
  const cs = clipNear(pts.map(p => toCam(cam, p)));
  if (cs.length < 3) return;
  const ps = cs.map(([u, v, d]) => ({ x: cv.clientWidth / DPR / 2 + u * focal / d,
                                      y: cv.clientHeight / DPR / 2 - v * focal / d }));
  ctx.beginPath();
  ps.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function line3(cam, a, b, colour, width, dash) {
  const pa = project(cam, a), pb = project(cam, b);
  if (!pa || !pb) return;
  ctx.save();
  ctx.strokeStyle = colour; ctx.lineWidth = width || 1;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  ctx.restore();
}
function ground(cam, f) {          // the hole, passed in: a film that changes hole changes the ground under it
  /* The ground has to reach past the horizon. At ±900 ft it did not: a camera set back far enough to hold a
     tee shot and a green in one frame stood 800 ft off the line, the far edge of the plane came into view, and
     the picture was a green wedge floating in the sky with a diagonal edge. A plane that is not big enough to
     have a horizon is a plate. */
  const y0 = f.centre[1] - 9000, y1 = f.centre[1] + 9000;
  fillPoly(cam, [[-9000, y0, 0], [9000, y0, 0], [9000, y1, 0], [-9000, y1, 0]], "#2f5b3d");   // the fairway
  fillPoly(cam, [[-60, y0, 0], [60, y0, 0], [60, y1, 0], [-60, y1, 0]], "#376845");            // the short grass
  if (f.sand) {                                                                              // the sand
    const s = f.sand > 0 ? 1 : -1;
    fillPoly(cam, [[s * f.green_a, f.centre[1] - f.green_b, 0], [s * (f.green_a + f.bunker_w), f.centre[1] - f.green_b, 0],
                   [s * (f.green_a + f.bunker_w), f.centre[1] + f.green_b, 0], [s * f.green_a, f.centre[1] + f.green_b, 0]],
             "#c8b483", "#8d7c54");
  }
  fillPoly(cam, ellipsePoly(f.centre[0], f.centre[1], f.green_a, f.green_b), "#4a8f5c", "#8ff0b4");
  if (f.sand && f.lip_h > 0) {                                                               // the face, as a wall
    const s = f.sand > 0 ? 1 : -1, x = s * f.green_a;
    const top = f.centre[1] + f.green_b, bot = f.centre[1] - f.green_b;
    fillPoly(cam, [[x, bot, 0], [x, bot, f.lip_h], [x, top, f.lip_h], [x, top, 0]], "#a4915f");
    for (let k = 0; k <= 40; k++) {                                            // hatching: it is a face, not glass
      const yy = bot + (top - bot) * k / 40;
      line3(cam, [x, yy, 0], [x, yy, f.lip_h], "rgba(88,74,42,0.22)", 0.6);
    }
    line3(cam, [x, bot, f.lip_h], [x, top, f.lip_h], "#ffeecc", 2.0);          // the lip itself, eighteen inches up
  }
  const flag = f.flag;                                                                        // the flag
  line3(cam, [flag[0], flag[1], 0], [flag[0], flag[1], 7.5], "#e8e8e8", 1.6);
  const p0 = project(cam, [flag[0], flag[1], 7.5]), p1 = project(cam, [flag[0], flag[1] + 2.4, 6.6]);
  if (p0 && p1) { ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(p0.x, p0.y + 12);
                  ctx.closePath(); ctx.fillStyle = "#ff5f5f"; ctx.fill(); }
  const cup = project(cam, [flag[0], flag[1], 0]);                                            // the hole
  if (cup) { ctx.beginPath(); ctx.ellipse(cup.x, cup.y, 3, 1.4, 0, 0, Math.PI * 2);
             ctx.fillStyle = "#0b1210"; ctx.fill(); }
}

/* The bar has to be true at one depth and there is only one depth the reader is judging, which is the ball's:
   so the bar is measured against the ball, and its length is chosen so that it is a bar and not the width of
   the screen. A twenty-foot bar is wrong on a close-up of a bunker — no good asking the eye to divide by twenty
   when the whole frame is eight. */
function scaleBar(cam, p) {
  const v = cam.sub(p, cam.pos);
  const depth = Math.max(2, cam.dot(v, cam.f));
  const perFt = FOCAL() / depth;
  let ft = 1;
  for (const k of [50, 20, 10, 5, 2, 1]) if (k * perFt <= 210) { ft = k; break; }
  const px = ft * perFt;
  const x = 22, y = cv.clientHeight / DPR - 26;
  ctx.strokeStyle = "rgba(223,230,226,0.55)"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + px, y);
  ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4); ctx.moveTo(x + px, y - 4); ctx.lineTo(x + px, y + 4); ctx.stroke();
  ctx.fillStyle = "rgba(223,230,226,0.75)"; ctx.font = "12px ui-monospace,Menlo,monospace";
  ctx.fillText(ft + " ft", x + 4, y - 8);
}

/* ---- the ball, and the trail it leaves ------------------------------------------------------------ */
function ballAt(path, t) {
  if (!path || !path.length) return null;
  if (t <= path[0][0]) return path[0];
  for (let i = 1; i < path.length; i++) {
    if (path[i][0] >= t) {
      const a = path[i - 1], b = path[i], f = (t - a[0]) / Math.max(1e-6, b[0] - a[0]);
      return [t, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, a[3] + (b[3] - a[3]) * f];
    }
  }
  return path[path.length - 1];
}
function truncate(path, stopAt, start) {         // a shot that hits the face stops there, short of its landing
  if (!path) return path;
  if (stopAt == null) return path;
  const out = [];
  for (const p of path) {
    const d = Math.hypot(p[1] - start[0], p[2] - start[1]);
    if (d >= stopAt) { out.push(p); break; }
    out.push(p);
  }
  return out.length ? out : path.slice(0, 1);
}
function drawPath(cam, pts, upto, colour, width) {
  let prev = null;
  for (const p of pts) {
    if (p[0] > upto) break;
    const q = project(cam, [p[1], p[2], p[3]]);
    if (q && prev) { ctx.strokeStyle = colour; ctx.lineWidth = width; ctx.beginPath();
                     ctx.moveTo(prev.x, prev.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
    prev = q;
  }
}
function shadow(cam, p) {
  const q = project(cam, [p[1], p[2], 0]);
  if (!q) return;
  const r = Math.max(2.4, Math.min(22, 1.35 * BALL_FT * FOCAL() / Math.max(1, q.d)));
  ctx.beginPath(); ctx.ellipse(q.x, q.y, r, r * 0.40, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.32)"; ctx.fill();
}
function drawBall(cam, p) {
  const q = project(cam, [p[1], p[2], p[3]]);
  if (!q) return;
  /* The radius is the ball's real angular size, with a floor. The floor is a *symbol*, not a measurement: at the
     distance a golf shot is photographed from, a 1.6-inch ball is half a pixel, and a half-pixel ball is not
     visible at all. Two and a bit pixels is the smallest honest marker, and the scale bar is the thing that says
     how big the world is — not the dot. */
  const r = Math.max(2.2, Math.min(26, BALL_FT * FOCAL() / Math.max(1, q.d)));
  ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fillStyle = "#ffffff"; ctx.fill();
  ctx.beginPath(); ctx.arc(q.x - r * 0.25, q.y - r * 0.25, r * 0.45, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.fill();
}

/* ---- the film: one shot at a time, then the next ------------------------------------------------
   The whole thing is one function of time — `at(t)` says which frame of which shot is on screen at second
   `t` — so a still can be pinned from the address bar (`the-face.html#t=6.2`), which is how a record gets a
   picture out of a film. Nothing here is stateful but the clock. */
const shots = (scene.shots || []).map(s => ({
  ...s, path: truncate(s.path, s.stop_at, s.start),
  dur: s.path && s.path.length ? s.path[s.path.length - 1][0] : 1.0,
}));
const PRE = 3.2;                           // standing still before a ball moves, in seconds
const START = [], BEAT = [];               // when each shot begins on the film's clock, and how long it holds first
let total = 0;
for (let k = 0; k < shots.length; k++) {
  const s = shots[k];
  /* The opening establishing frame belongs to the first shot; a film that crosses holes — the round film does —
     carries a `view` on the first shot of each hole, so every hole gets its own three seconds of standing still
     before a ball moves. That is the cheapest thing a film can do for a viewer who has lost track of the hole:
     stop, show him the hole, then play it. */
  const beat = (s.view || (k === 0 && scene.view)) ? PRE : 0;
  START.push(total); BEAT.push(beat);
  total += beat + s.dur + 1.6;
}
function at(t) {
  if (!shots.length) return { wide: false, i: 0, shown: 0, wt: 0 };
  let i = 0;
  for (let k = shots.length - 1; k >= 0; k--) if (t >= START[k]) { i = k; break; }
  const local = t - START[i];
  if (local < BEAT[i]) return { wide: true, i, wt: local, shown: 0 };
  return { wide: false, i, wt: local - BEAT[i], shown: Math.min(Math.max(0, local - BEAT[i]), shots[i].dur) };
}
const dots = document.getElementById("dots");
const el = document.getElementById("now");
function caption(f) {
  if (f.wide) {
    const v = viewOf(shots[f.i]);
    el.innerHTML = `<b>the hole</b> · ${(v && v.label) || "from behind the ball"}`;
    dots.textContent = shots.map(() => "•").join(" ");
    return;
  }
  const s = shots[f.i];
  el.innerHTML = `<b>${f.i + 1}/${shots.length}</b> · ${s.label}` +
                 (s.result ? ` — <span style="color:#9fb8ad">${s.result}</span>` : "");
  dots.textContent = shots.map((_, k) => k === f.i ? "●" : "•").join(" ");
}
let current = null;                        // the frame on screen, so a resize can put it back
function draw(f) {
  current = f;
  const s = shots[f.i], v = viewOf(s), feet = feetOf(s);
  LENS = scene.fov || 42;
  let cam;
  if (f.wide) {
    /* The establishing frame breathes: it walks six per cent of the way to its target over the hold, so a frame
       that stands still for three seconds is not a still. That is a dolly, and it is the only camera move in the
       film that no ball is responsible for. */
    const k = 0.06 * ease(f.wt / Math.max(0.001, BEAT[f.i]));
    cam = basis([mix(v.pos[0], v.target[0], k), mix(v.pos[1], v.target[1], k), mix(v.pos[2], v.target[2], k)],
                v.target);
  } else {
    cam = shotCamera(s, f.shown);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  const sky = ctx.createLinearGradient(0, 0, 0, cv.clientHeight / DPR);
  sky.addColorStop(0, "#16261f"); sky.addColorStop(1, "#0d1512");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, cv.clientWidth / DPR, cv.clientHeight / DPR);
  ground(cam, feet);
  /* The faded trail is the round so far *on this hole*. A round film changes hole between shots, and a trail
     from the fourth hole drawn across the seventh is a line through a place it was never hit. */
  const here = s.hole;
  for (let k = 0; k < f.i; k++) if (shots[k].hole === here)
    drawPath(cam, shots[k].path, 1e9, "rgba(255,212,121,0.22)", 1.2);
  if (!f.wide) drawPath(cam, s.path, f.shown, "#ffd479", 2.0);
  const b = ballAt(s.path, f.shown);
  if (b) { shadow(cam, b); drawBall(cam, b); }
  scaleBar(cam, b ? [b[1], b[2], b[3]] : [feet.centre[0], feet.centre[1], 0]);
}
/* A still, if the address asks for one: `#t=6.2` draws exactly that second. Drawn synchronously, not on the
   next animation frame, because a headless browser asked for a screenshot does not always wait for one. */
const pinned = (m => m ? parseFloat(m[1]) : null)(/^#t=([0-9.]+)$/.exec(location.hash || ""));
function frame() {
  const t = ((performance.now() - t0) / 1000) % total;
  const f = at(t);
  draw(f);
  caption(f);
  requestAnimationFrame(frame);
}
function resize() {
  /* Setting a canvas's width clears it, so a window that is resized goes black and stays black: the pinned
     still never runs again and the animation loop is not running at all. Found by taking screenshots with a
     long virtual-time budget — the frame drew, the layout settled, the canvas cleared itself, and the picture
     was gone. The page had this fault before this pass and nobody had resized it. */
  cv.width = Math.floor(cv.clientWidth * DPR); cv.height = Math.floor(cv.clientHeight * DPR);
  if (current) draw(current);
}
let t0 = 0;
addEventListener("resize", resize);
resize();
if (pinned != null) {
  const f = at(Math.min(pinned, total - 0.05));
  const still = () => { resize(); draw(f); caption(f); };
  still();                                   // now, in case the browser never runs another frame
  requestAnimationFrame(still);              // and again once the layout is settled, in case it does
  document.getElementById("bar").insertAdjacentHTML("beforeend",
    `<div style="color:#5f726a;font-size:11.5px">still at ${pinned.toFixed(1)} s of ${total.toFixed(1)}</div>`);
} else {
  t0 = performance.now();
  requestAnimationFrame(frame);
}
</script>
