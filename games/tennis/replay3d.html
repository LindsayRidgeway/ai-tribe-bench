<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const D = JSON.parse(document.getElementById("script").textContent);
const C = D.court, LEN = C.length, WID = C.width, NX = C.net_x;
const TRACE = 0.02;

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e11);
scene.fog = new THREE.Fog(0x0b0e11, 90, 260);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xa8c0d6, 0x3a2418, 1.5));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
sun.position.set(-40, 70, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const s = 70;
sun.shadow.camera.left = -s; sun.shadow.camera.right = s;
sun.shadow.camera.top = s; sun.shadow.camera.bottom = -s;
sun.shadow.camera.far = 260;
scene.add(sun);

/* ---------- the court, drawn as a texture ----------
   Lines on a clay court are a texture problem, not a geometry problem. Drawing them into a canvas and
   mapping it onto one plane keeps the line where the rule says it is, at any camera angle, without a
   single quad of z-fighting. */
const SURFACE = { clay: [0xb4, 0x55, 0x3a], hard: [0x46, 0x66, 0x7c], grass: [0x53, 0x6f, 0x42] };
const CLAY = SURFACE[D.surface] || SURFACE.clay;

function courtTexture() {
  const px = 26;                                   // pixels per foot
  const pad = 22;
  const cv = document.createElement("canvas");
  cv.width = (LEN + pad * 2) * px; cv.height = (WID + pad * 2) * px;
  const g = cv.getContext("2d");
  const dark = `rgb(${CLAY.map(v => Math.round(v * 0.62)).join(",")})`;
  g.fillStyle = dark; g.fillRect(0, 0, cv.width, cv.height);
  g.translate(pad * px, pad * px);
  g.fillStyle = `rgb(${CLAY.join(",")})`;
  g.fillRect(0, 0, LEN * px, WID * px);
  g.strokeStyle = "rgba(248,246,238,.95)"; g.lineWidth = 0.30 * px; g.lineCap = "butt";
  const line = (x0, y0, x1, y1) => { g.beginPath(); g.moveTo(x0 * px, y0 * px); g.lineTo(x1 * px, y1 * px); g.stroke(); };
  line(0, 0, LEN, 0); line(0, WID, LEN, WID);
  line(0, 0, 0, WID); line(LEN, 0, LEN, WID);
  line(NX - C.service_line, 0, NX - C.service_line, WID);
  line(NX + C.service_line, 0, NX + C.service_line, WID);
  line(NX - C.service_line, WID / 2, NX + C.service_line, WID / 2);
  line(0, WID / 2, 0.9, WID / 2); line(LEN - 0.9, WID / 2, LEN, WID / 2);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

const courtW = LEN + 44, courtD = WID + 44;
const court = new THREE.Mesh(
  new THREE.PlaneGeometry(courtW, courtD),
  new THREE.MeshStandardMaterial({ map: courtTexture(), roughness: 0.95, metalness: 0 })
);
court.rotation.x = -Math.PI / 2;
court.position.set(LEN / 2, 0, WID / 2);
court.receiveShadow = true;
scene.add(court);

// a dark apron so the court does not float in a void
const apron = new THREE.Mesh(new THREE.CircleGeometry(150, 48),
  new THREE.MeshStandardMaterial({ color: 0x14181c, roughness: 1 }));
apron.rotation.x = -Math.PI / 2; apron.position.y = -0.02; apron.receiveShadow = true;
scene.add(apron);

/* ---------- the net ---------- */
function netTexture() {
  const cv = document.createElement("canvas");
  cv.width = 512; cv.height = 64;
  const g = cv.getContext("2d");
  g.clearRect(0, 0, 512, 64);
  g.strokeStyle = "rgba(240,240,232,.55)"; g.lineWidth = 1.2;
  for (let x = 0; x <= 512; x += 8) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 64); g.stroke(); }
  for (let y = 0; y <= 64; y += 8) { g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke(); }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = THREE.RepeatWrapping; t.repeat.set(6, 1);
  return t;
}
const netGeo = new THREE.PlaneGeometry(WID, C.net_centre);
const netMat = new THREE.MeshStandardMaterial({ map: netTexture(), transparent: true, alphaTest: 0.05,
  side: THREE.DoubleSide, roughness: 0.9 });
const net = new THREE.Mesh(netGeo, netMat);
net.position.set(NX, C.net_centre / 2, WID / 2);
net.rotation.y = Math.PI / 2;
scene.add(net);
const cord = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.10, WID),
  new THREE.MeshStandardMaterial({ color: 0xf5f2e8, roughness: 0.7 }));
cord.position.set(NX, C.net_centre, WID / 2); scene.add(cord);
for (const z of [0, WID]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, C.net_posts, 10),
    new THREE.MeshStandardMaterial({ color: 0xdcd8cc, roughness: 0.6 }));
  post.position.set(NX, C.net_posts / 2, z); post.castShadow = true; scene.add(post);
}

/* ---------- the ball ---------- */
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 14),
  new THREE.MeshStandardMaterial({ color: 0xe8e07a, roughness: 0.7, emissive: 0x3a3410 }));
ball.castShadow = true;
scene.add(ball);
const trailMat = new THREE.LineBasicMaterial({ color: 0xffe38c, transparent: true, opacity: 0.55 });
const trail = new THREE.Line(new THREE.BufferGeometry(), trailMat);
scene.add(trail);

/* ---------- the players ---------- */
const loader = new GLTFLoader();
const NEED = D.players.map(p => p.body).filter(Boolean);
const rigs = {};
const fail = msg => { const e = document.getElementById("err"); e.style.display = "grid";
  e.innerHTML = msg; document.getElementById("tl").style.display = "none"; };

async function loadBodies() {
  for (const name of NEED) {
    const gltf = await loader.loadAsync(`bodies/${name}.glb`);
    const root = gltf.scene;
    root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    // the .glb is already Y-up (the exporter converts), and it is in METRES while the court is in FEET.
    root.scale.setScalar(3.28084);
    scene.add(root);
    const bones = {};
    // glTF strips the dots out of node names, so Blender's "thigh.L" arrives as "thighL". Every lookup in this
    // file used the dotted name, found nothing, and did nothing: the legs were never posed and the arm solver
    // returned at its first line. That is why the racquet sat at the hip in every still — the page had been
    // reporting a solved pose it had never applied. Keyed by the name the file actually contains, with the
    // dotted name kept as an alias so neither spelling can break it again.
    root.traverse(o => {
      if (!o.isBone) return;
      // three.js's loader sanitises node names, so Blender's "thigh.L" arrives in the browser as "thighL". Both
      // spellings are keyed: the bare one because that is what the file contains, and the dotted one because
      // every posing rule in this file was written against the bone's name in Blender. The previous version keyed
      // o.name and o.name.replace(/\./g, "") — after sanitising those are the same string, so the dotted lookups
      // returned undefined and every rule that used them did nothing at all, silently. The legs have never moved.
      bones[o.name] = o;
      const bare = o.name.replace(/\./g, "");
      bones[bare] = o;
      const m = bare.match(/^(.*?)([LR])$/);
      if (m) bones[`${m[1]}.${m[2]}`] = o;
    });
    // the figure's own height, in feet, read off the model rather than assumed: the stride below is a
    // fraction of it, and a 6ft 2in member does not take the same steps as a 5ft 8in one
    const box = new THREE.Box3().setFromObject(root);
    // The racquet is NOT parented to the hand. A racquet is aimed at the ball, not welded to a fist: the page
    // places it every frame — butt in the palm, head on the ball, face square to the direction the ball leaves
    // in. Being its own object in the scene also spares it the 3.28084 that converts the metre-built body into
    // the feet the court is measured in; built in feet and left in the scene it is 27in long, as it should be.
    const rac = buildRacquet();
    scene.add(rac);
    rigs[name] = { root, bones, height: box.max.y - box.min.y, racquet: rac };
    if (q.has("debug")) console.log("debug bones", name, Object.keys(bones).join(","), "height", rigs[name].height.toFixed(2));
  }
}

/* ---------- posing: solve, do not key ----------
   CCD on the hitting arm. Each iteration rotates a bone so the hand points more nearly at the target; a few
   iterations and the racquet is at the ball. Clavicle and spine are left alone, so a ball the player cannot
   really reach produces a visible stretch rather than a corrected one. */
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpQ = new THREE.Quaternion();
const tmpQ2 = new THREE.Quaternion(), tmpP = new THREE.Vector3();

function rotateWorld(bone, qWorld) {
  // world' = q * world  =>  local' = parentInv * q * parent * local. The first version multiplied them
  // premultiply(inv).premultiply(q).premultiply(parent), which evaluates to parent*q*parentInv*local — the same
  // rotation about a conjugated axis, i.e. about the wrong axis. The arm solver then "converged" by pulling the
  // hand toward a point nobody had asked for, which is a large part of why every stroke looked like a statue
  // reaching for something. Verified numerically before changing it: the old order is off by 1.19 on a unit test.
  bone.parent.getWorldQuaternion(tmpQ2);
  const inv = tmpQ2.clone().invert();
  bone.quaternion.premultiply(tmpQ2).premultiply(qWorld).premultiply(inv);
  bone.updateMatrixWorld(true);
}

function solveArm(rig, target) {
  const { bones } = rig;
  const hand = bones["handR"];
  if (!hand) return;
  for (let iter = 0; iter < 6; iter++) {
    for (const name of ["forearmR", "upperarmR"]) {
      const b = bones[name];
      if (!b) continue;
      b.getWorldPosition(tmpA);
      hand.getWorldPosition(tmpB);
      const v1 = tmpB.sub(tmpA).normalize();
      const v2 = target.clone().sub(tmpA).normalize();
      tmpQ.setFromUnitVectors(v1, v2);
      const k = name === "upperarmR" ? 0.6 : 1.0;   // damp the shoulder so the elbow does the reaching
      tmpQ.slerp(new THREE.Quaternion(), 1 - k);
      rotateWorld(b, tmpQ);
    }
  }
}

/* Point a bone at something, without knowing how Blender rolled it.
   Every bone here runs along its own local +Y (checked against the .glb: every child offset is (0,1,0)), but the
   local X and Z axes are rolled differently bone by bone, so the same Euler angle means a different motion on the
   thigh and on the arm. Aiming sidesteps the question: the bone is rotated in world space until its own axis
   lies along the direction asked for, which is also how you would pose a lay figure. */
const _aim = new THREE.Vector3(), _aimQ = new THREE.Quaternion();
function aimBone(bone, dir) {
  if (!bone) return;
  bone.updateWorldMatrix(true, false);
  _aim.set(0, 1, 0).transformDirection(bone.matrixWorld);
  _aimQ.setFromUnitVectors(_aim, dir.clone().normalize());
  rotateWorld(bone, _aimQ);
}

/* ---------- walking, without a walk cycle ----------
   A gait is two numbers and a phase: the thigh swings, the knee folds on the way through, and the phase advances
   with the ground covered, not with the clock. That way the feet keep pace with the body however fast it is going
   — which is the whole difference between a figure that runs and a figure that is pushed along on castors.
   Nothing here is animation data; it is a rule about where the legs are given how far the player has travelled. */
function legs(rig, phase, moving, face) {
  const { bones } = rig;
  // A pose is a DELTA on the rest pose, not a replacement for it. bone.rotation.set(...) throws away the bone's
  // rest orientation, which in a glTF skeleton is carried by the node's own quaternion — do that to a thigh and
  // the leg swings up over the shoulder. The rest quaternion is captured once and composed with each swing.
  const dq = new THREE.Quaternion(), de = new THREE.Euler();
  const set = (n, x, y, z) => {
    const b = bones[n]; if (!b) return;
    const rest = b.userData.rest || (b.userData.rest = b.quaternion.clone());
    b.quaternion.copy(rest).multiply(dq.setFromEuler(de.set(x, y, z)));
  };
  const live = moving ? 1 : 0.12;                       // standing still is a very small version of walking
  // The swing is set so the foot travels as far as the body does in one step (0.42 of its height), which is what
  // stops the feet skimming along the ground. A bigger swing looks more athletic and slides; the phase is already
  // driven by distance, so the stride is honest at any speed and the legs simply cycle faster when the player runs.
  const A = 0.45 * live, K = 0.85 * live;
  const swing = p => Math.max(0.05, Math.sin(p + 0.75));
  set("thigh.L", -A * Math.sin(phase), 0, -0.09);
  set("thigh.R", -A * Math.sin(phase + Math.PI), 0, 0.09);
  set("shin.L", K * swing(phase), 0, 0);
  set("shin.R", K * swing(phase + Math.PI), 0, 0);
  set("foot.L", -0.25 * (moving ? 1 : 0), 0, 0);
  set("foot.R", -0.25 * (moving ? 1 : 0), 0, 0);
  set("spine", -0.05 - 0.09 * live, 0, 0.06);
  set("hips", 0.04 * live, 0, 0);
  arms(rig, face, phase);
}

/* A player waiting for a ball does not stand with both arms hanging: the free arm is across the body, the racquet
   arm has the frame up in front of the shoulder. Both are aimed rather than rotated, so the pose survives any
   future change of bone roll. */
function arms(rig, face, phase) {
  const right = new THREE.Vector3().crossVectors(face, _up).normalize();
  const dir = (f, r, u) => new THREE.Vector3().addScaledVector(face, f)
    .addScaledVector(right, r).addScaledVector(_up, u).normalize();
  // racquet arm: elbow low and near the ribs, forearm forward and a little up, so the frame sits at head
  // height in front of the shoulder rather than straight above it
  aimBone(rig.bones["upperarm.R"], dir(0.20, 0.30, -0.93));
  aimBone(rig.bones["forearm.R"], dir(0.72, 0.12, 0.28));
  // free arm: down and across, hand toward the racquet's throat, elbow bent
  aimBone(rig.bones["upperarm.L"], dir(0.15, 0.35, -0.92));
  aimBone(rig.bones["forearm.L"], dir(0.55, 0.30, -0.25));
}

function ready(rig, north) {
  // where the racquet waits between shots: in front of the right shoulder, on the hitting side
  const { bones } = rig;
  const p = new THREE.Vector3();
  (bones["chest"] || bones["upperarmR"]).getWorldPosition(p);
  p.y += 1.35;
  p.x += north ? 0.55 : -0.55;
  return p;
}

/* ---------- the racquet, which the page holds ----------
   A tennis racquet is 27in long: a grip of 7, a throat of 8, a head of 12, the head 9.5in wide. The one in the
   .glb was a torus on a stick, 20% too long, and being welded to the hand it could only ever point where the
   hand pointed. So the body is exported without it and the racquet is built here, as a child of the hand bone:
   real proportions, a strung bed, and an aim — the face turns to the direction the engine says the ball left in.
   Equipment belongs to the shot, not to the body. */
function stringTexture() {
  const px = 8, n = 14;
  const cv = document.createElement("canvas");
  cv.width = cv.height = n * px;
  const g = cv.getContext("2d");
  g.fillStyle = "rgba(0,0,0,0)"; g.fillRect(0, 0, cv.width, cv.height);
  g.strokeStyle = "rgba(238,238,232,.85)"; g.lineWidth = 1.1;
  for (let i = 0; i <= n; i++) {
    g.beginPath(); g.moveTo(i * px, 0); g.lineTo(i * px, cv.height); g.stroke();
    g.beginPath(); g.moveTo(0, i * px); g.lineTo(cv.width, i * px); g.stroke();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3.4);
  return t;
}

function buildRacquet() {
  const g = new THREE.Group();
  const gripMat = new THREE.MeshStandardMaterial({ color: 0x1d2126, roughness: 0.85 });
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xd9d3c4, roughness: 0.32, metalness: 0.30 });
  const strMat = new THREE.MeshStandardMaterial({ map: stringTexture(), transparent: true, alphaTest: 0.05,
                                                  side: THREE.DoubleSide, roughness: 0.9 });

  const strut = (a, b, r, mat) => {
    const d = new THREE.Vector3().subVectors(b, a);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mat);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
    m.castShadow = true;
    g.add(m);
    return m;
  };
  const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);

  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.070, 0.064, 0.58, 12), gripMat);
  grip.position.y = 0.29; grip.castShadow = true; g.add(grip);
  g.add(new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.012, 6, 16).rotateX(Math.PI / 2)
                        .translate(0, 0.575, 0), gripMat));           // the collar at the top of the grip

  strut(V(0, 0.58), V(0.255, 1.31), 0.026, frameMat);
  strut(V(0, 0.58), V(-0.255, 1.31), 0.026, frameMat);

  const head = new THREE.Mesh(new THREE.TorusGeometry(0.435, 0.030, 8, 28), frameMat);
  head.position.y = 1.74; head.scale.x = 0.83; head.castShadow = true; g.add(head);

  const bed = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.85), strMat);
  bed.position.y = 1.74; g.add(bed);

  g.userData.normal = new THREE.Vector3(0, 0, 1);        // the face looks along the racquet's local +Z
  g.userData.shaft = new THREE.Vector3(0, 1, 0);
  return g;
}

/* Put the racquet where a racquet goes: butt in the palm, head toward the ball, string bed square to the shot.
   Two vectors make it, and both are already in the record: the hand, and the direction the engine says the ball
   left in. The shaft is lined up with the first, then the racquet is rolled about its own shaft until the face
   looks along the second. A racquet that only points where the hand points is a paddle. */
const _hp = new THREE.Vector3(), _shaft = new THREE.Vector3(), _n0 = new THREE.Vector3(),
      _n1 = new THREE.Vector3(), _ax = new THREE.Vector3(), _q1 = new THREE.Quaternion(),
      _up = new THREE.Vector3(0, 1, 0), _face = new THREE.Vector3(), _sh0 = new THREE.Vector3();
function placeRacquet(rig, aim, face) {
  const rac = rig.racquet, hand = rig.bones["handR"] || rig.bones["hand.R"];
  if (!rac || !hand) return;
  hand.getWorldPosition(_hp);
  rac.position.copy(_hp);
  _shaft.subVectors(aim, _hp);
  if (_shaft.lengthSq() < 1e-6) _shaft.set(0, 1, 0);
  _shaft.normalize();
  rac.quaternion.setFromUnitVectors(_up, _shaft);
  // roll about the shaft until the bed's normal (the racquet's local +Z) lies along `face`
  _n0.set(0, 0, 1).applyQuaternion(rac.quaternion).addScaledVector(_shaft, -_n0.dot(_shaft));
  if (_n0.lengthSq() < 1e-6) return;
  _n0.normalize();
  _n1.copy(face).addScaledVector(_shaft, -face.dot(_shaft));
  if (_n1.lengthSq() < 1e-6) return;
  _n1.normalize();
  _ax.crossVectors(_n0, _n1);
  _q1.setFromAxisAngle(_shaft, Math.atan2(_ax.dot(_shaft), _n0.dot(_n1)));
  rac.quaternion.premultiply(_q1);
}

/* ---------- the film ---------- */
const SEG = [];
const PLAN = {};                       // name -> [{t0,t1,from,to}] in seconds of film
{
  let t = 0.8;
  for (const sh of D.shots) {
    const dur = Math.max(0.35, sh.path.length * TRACE);
    const hold = sh.in ? 0.75 : 1.6;
    SEG.push({ sh, start: t, dur, hold, cams: cams(sh, dur) });
    if (sh.run) {
      (PLAN[sh.run.player] = PLAN[sh.run.player] || []).push(
        { t0: t + sh.run.t0, t1: t + Math.min(sh.run.t1, dur), from: sh.run.from, to: sh.run.to });
    }
    t += dur + hold;
  }
}

/* Where a player is at time T. The record says where each run began and ended and how long it took; there is
   no footfall in the record and there is not meant to be — this interpolates, it does not invent a route. */
function whereAt(name, T) {
  const moves = PLAN[name] || [];
  const start = (D.start.find(s => s.name === name) || { at: [0, WID / 2] }).at;
  let pos = start, moving = false, travelled = 0;
  for (const m of moves) {
    const d = Math.hypot(m.to[0] - m.from[0], m.to[1] - m.from[1]);
    if (T >= m.t1) { pos = m.to; travelled += d; }
    else if (T > m.t0) {
      const k = (T - m.t0) / Math.max(0.05, m.t1 - m.t0);
      pos = [m.from[0] + (m.to[0] - m.from[0]) * k, m.from[1] + (m.to[1] - m.from[1]) * k];
      travelled += d * k;
      moving = true; break;
    } else break;
  }
  // the gait's phase is the ground covered, integrated over the planned runs, so scrubbing backwards and
  // jumping to a shot both put the legs where they belong. A phase counted frame by frame would only be right
  // in continuous play, which is the one case a still cannot show.
  return { pos, moving, travelled };
}
function cams(sh, dur) {
  // One camera holds the whole point; when the point is over, cut once to the player who was running.
  return [{ at: 0, cam: tower() }, { at: dur, cam: between(sh) }];
}
function nearest(land) {
  let best = null;
  for (const x of [0, LEN, NX - C.service_line, NX + C.service_line]) {
    const d = Math.abs(land[0] - x); if (!best || d < best.d) best = { d, x, kind: "line" };
  }
  for (const z of [0, WID]) {
    const d = Math.abs(land[1] - z); if (!best || d < best.d) best = { d, z, kind: "sideline" };
  }
  return best;
}
/* The televised camera: one position at one end of the court for the whole match, long lens, the court in frame
   for every shot. It does not hunt the ball and it does not cut per shot — a spectator's eye is not a drone. The
   only cut is between points, to a player standing about, which is also what television does. */
function tower() {
  // Height and distance chosen so both baselines are inside the frame: the near one 10.7 degrees below the axis,
  // the far one 4.5 above, in a 26 degree lens. The player standing on the near baseline is then a quarter of the
  // frame tall instead of a smudge at the edge.
  return { eye: new THREE.Vector3(-56, 29, WID / 2), at: new THREE.Vector3(NX + 14, 0.5, WID / 2), fov: 26 };
}
function between(sh) {
  // Between points, television goes to the player the point was about, from the side and a step ahead of them,
  // whole figure in frame, low. The first version stood behind them at boot height and filled the screen with a
  // back: a cut is for reading a person, and you read a face and a stance, not a shirt.
  const who = sh.run ? { at: sh.run.to, north: sh.run.north } : { at: [sh.contact[0], sh.contact[1]], north: sh.north };
  const face = who.north ? 1 : -1;                       // the way that player looks
  const side = who.at[1] < WID / 2 ? 1 : -1;             // out toward the nearer sideline
  return { eye: new THREE.Vector3(who.at[0] + 4.5 * face, 5.0, who.at[1] + 13.5 * side),
           at: new THREE.Vector3(who.at[0] + 0.4 * face, 3.4, who.at[1]), fov: 34 };
}
function wide(north) {
  // Behind the hitter's baseline, high, looking at the net: the broadcast view, which is the only one that shows
  // both players and the ball. The first version put the camera 84ft behind the baseline, where the far player
  // is forty pixels tall and the near one is standing on the bottom edge.
  const dir = north ? 1 : -1;
  // The camera stands behind the hitter's BASELINE, not behind the hitter: a player who has run forward to a short
  // ball would otherwise carry the camera into the middle of the court, and the net would appear in the middle of
  // the picture with the far player beyond it.
  const base = north ? 0 : LEN;
  return { eye: new THREE.Vector3(base - 14 * dir, 8.0, WID / 2 + 9),
           at: new THREE.Vector3(NX + 8 * dir, 4.5, WID / 2 - 1), fov: 50 };
}
function beside(north, px) {
  // A camera a few feet from one player, for looking at feet rather than at tennis. Reached with ?cam=near.
  const dir = north ? 1 : -1;
  const p = (px === undefined || px === null) ? (north ? 2 : LEN - 2) : px;
  return { eye: new THREE.Vector3(p - 12 * dir, 5.5, WID / 2 + 12),
           at: new THREE.Vector3(p, 3, WID / 2), fov: 34 };
}
let T = 0, playing = true, T0 = performance.now(), firstFrame = true, lastCam = null;
const q = new URLSearchParams(location.search);

function shotAt(t) {
  for (const s of SEG) if (t >= s.start && t < s.start + s.dur + s.hold) return s;
  return SEG[SEG.length - 1];
}

/* ---------- per-frame ---------- */
const el = id => document.getElementById(id);
const ballPos = new THREE.Vector3();
const firstFrameFor = {};

function tick(now) {
  const dt = Math.min(0.05, (now - T0) / 1000); T0 = now;
  if (playing) T += dt;
  const last = SEG[SEG.length - 1];
  if (T > last.start + last.dur + last.hold) T = 0;
  const seg = shotAt(T);
  const tl = T - seg.start;
  const sh = seg.sh;
  const onCut = seg.cams.length > 1 && tl >= seg.cams[1].at;

  // camera
  let cam = seg.cams[0].cam;
  for (const c of seg.cams) if (tl >= c.at) cam = c.cam;
  if (q.has("cam")) {
    // follow whoever is running; that is the one whose feet are worth looking at
    const who = sh.run ? sh.run : { north: sh.north, from: [sh.contact[0], sh.contact[1]] };
    cam = beside(who.north, (who.from || [null])[0]);
  }
  // A cut is a cut. Television changes shot by changing shot; it does not fly the camera from the tower to a
  // player's shoulder over half a second, which reads as a drone and is the tell of a rendered game.
  if (firstFrame || (cam !== lastCam && !q.has("cam"))) {
    camera.position.copy(cam.eye); camera.fov = cam.fov; firstFrame = false; lastCam = cam;
  } else {
    camera.position.lerp(cam.eye, 0.22);
    camera.fov += (cam.fov - camera.fov) * 0.22;
  }
  camera.updateProjectionMatrix();
  camera.lookAt(cam.at);

  // ball
  const tt = Math.min(tl, seg.dur);
  const idx = Math.min(sh.path.length - 1, Math.max(0, Math.round(tt / TRACE)));
  const p = sh.path[idx];
  ballPos.set(p[0], Math.max(0.16, p[2]), p[1]);
  ball.position.copy(ballPos);
  // on the between-points closeup the ball is dead on the court a few feet from the lens, where it reads as a
  // beach ball. Television does not have a ball in that shot either.
  ball.visible = !onCut; trail.visible = !onCut;
  const tail = [];
  for (let i = Math.max(0, idx - 34); i <= idx; i++) {
    const q2 = sh.path[i]; tail.push(new THREE.Vector3(q2[0], Math.max(0.12, q2[2]), q2[1]));
  }
  trail.geometry.dispose();
  trail.geometry = new THREE.BufferGeometry().setFromPoints(tail);

  // players: position from the record's runs, legs from the ground covered
  for (const pl of D.players) {
    const rig = rigs[pl.body];
    if (!rig) continue;
    const { pos, moving, travelled } = whereAt(pl.name, T);
    rig.root.position.set(pos[0], 0, pos[1]);
    // the body is built facing +Z; a north player faces +X, a south player faces -X
    rig.root.rotation.y = pl.north ? Math.PI / 2 : -Math.PI / 2;

    // one cycle of the gait is two steps, and a step is about 0.42 of the figure's own height
    const phase = 2 * Math.PI * (travelled / (0.84 * Math.max(4.0, rig.height)));
    if (q.has("debug")) console.log("debug legs", pl.name, "moving", moving, "travelled", travelled.toFixed(2),
      "phase", phase.toFixed(2), "thigh", rig.bones["thighL"] ? rig.bones["thighL"].rotation.x.toFixed(3) : "MISSING");
    legs(rig, phase, moving, new THREE.Vector3(pl.north ? 1 : -1, 0, 0));

    const wait = ready(rig, pl.north);
    if (sh.player === pl.name) {
      // the arm is at the ball at the strike and back at the shoulder by half a second; the solver is given a
      // target that moves rather than being switched on and off, because switching it off snaps the arm
      const k = Math.max(0, Math.min(1, (tl - 0.26) / 0.30));
      const ball = new THREE.Vector3(sh.contact[0], sh.contact[2], sh.contact[1]);
      // A hand does not touch the ball; a racquet does. The arm is solved to a hand 1.6ft back down the line from
      // the shoulder to the ball, and the racquet's 1.74ft shaft carries the head the rest of the way — which is
      // what the stroke is. Solved to the ball itself, the arm put the hand on it and the frame 2ft past it.
      (rig.bones["upperarmR"] || rig.bones["chest"]).getWorldPosition(_sh0);
      const u = ball.clone().sub(_sh0).normalize();
      solveArm(rig, ball.clone().addScaledVector(u, -1.60).lerp(wait, k));
      const aim = ball.clone().addScaledVector(u, -0.20).lerp(wait, k);
      _face.set(sh.v0[0], sh.v0[2], sh.v0[1]).normalize();
      placeRacquet(rig, aim, _face);
    } else {
      _face.set(pl.north ? 1 : -1, 0.12, 0).normalize();   // waiting for the ball, bed open to the net
      const hand = rig.bones["handR"] || rig.bones["hand.R"];
      const aim = new THREE.Vector3();
      if (hand) { hand.getWorldPosition(aim); }
      aim.addScaledVector(_face, 0.70).addScaledVector(_up, 1.55);
      placeRacquet(rig, aim, _face);
    }
  }

  // words
  el("surface").textContent = `${D.surface} · wind ${D.wind.direction} ${D.wind.mph}mph`;
  el("rally").textContent = `rally ${sh.rally} of ${D.rallies.length} · shot ${sh.i}`;
  el("who").textContent = sh.player;

  const sw = el("sweet"); sw.textContent = sh.sweet ? "clean" : "framed";
  sw.className = "badge " + (sh.sweet ? "clean" : "frame");
  el("shotline").textContent = `face ${sh.face > 0 ? "+" : ""}${sh.face}°  power ${Math.round(sh.power)}  ` +
    `aim ${sh.aim}ft  leaving at ${Math.round(sh.power * 1.05)}mph`;
  const rn = sh.run;
  el("why").textContent = sh.why + (rn
    ? `   ·   ${rn.player} runs ${rn.dist}ft at ${rn.speed}ft/s${rn.met ? "" : " and does not get there"}`
    : "");
  if (sh.corridor[0] !== null) {
    const [lo, hi] = sh.corridor, zero = -12, span = 30;
    const x = v => Math.max(0, Math.min(100, (v - zero) / span * 100));
    el("self").style.left = x(lo) + "%";
    el("self").style.width = Math.max(1.2, x(hi) - x(lo)) + "%";
    el("tick").style.left = x(Math.max(-12, Math.min(18, sh.face))) + "%";
    el("winline").textContent = `${(hi - lo).toFixed(1)}° wide (${lo.toFixed(1)}° to ${hi.toFixed(1)}°) — this shot at ${sh.face.toFixed(1)}°`;
  }
  el("players").innerHTML = D.players.map(p =>
    `<div><span class="swatch" style="background:${p.north ? "#8fc6ff" : "#ffb98f"}"></span>${p.name} ` +
    `<span class="mono" style="color:var(--dim)">${p.rating.toFixed(1)} · ${p.balls} balls</span></div>`).join("");
  el("cut").className = onCut ? "on" : "";
  if (onCut) el("cut").textContent = `between points · ${sh.run ? sh.run.player : sh.player}`;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener("keydown", e => {
  if (e.code === "Space") { playing = !playing; e.preventDefault(); }
  if (e.code === "ArrowRight") T += 0.25;
  if (e.code === "ArrowLeft") T = Math.max(0, T - 0.25);
});
if (q.has("t")) { T = parseFloat(q.get("t")); playing = false; }
if (q.has("shot")) {
  const seg = SEG.find(x => x.sh.n === parseInt(q.get("shot"), 10));
  if (seg) { T = seg.start + seg.dur * parseFloat(q.get("at") || "0.8"); playing = false; }
}

loadBodies().then(() => requestAnimationFrame(tick)).catch(e => {
  fail(`<div><div class="k">the bodies did not load</div><p>${e.message}</p>` +
       `<p>Open this page from a local server, not from the filesystem:<br>` +
       `<code>cd ~/ai_tribe && python3 -m http.server 8000</code><br>` +
       `then <code>http://localhost:8000/games/tennis/demo3d.html</code></p></div>`);
});
</script>
</body>
