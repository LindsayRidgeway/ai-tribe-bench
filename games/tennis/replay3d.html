      // 0.75 and not 1.55: the backhand sheet's RECOVERY panel holds the racquet in front of the chest, and 1.55
      // put the head over the player's head like a salute, which is what was on screen between points
      const readyAim = readyHand.clone().addScaledVector(_face, 0.70).addScaledVector(_up, 0.75);
      // The three places the racquet is on its way to the ball, from the backhand sheet of 2026-11-11
      // (`bodies/reference/poses/back-45.jpg`), measured off the drawing in fractions of the figure's own height:
      //   the run (PREPARATION)  hand 0.71H, head 0.66H and 0.27H behind the hands on the hitting side
      //   the take-back          hand 0.85H, head 1.10H — above the head, which is the loop that was missing
      //   contact                hand 0.59H, head 0.57H, hands 0.27H in front of the hips
      //   the finish              hand 0.83H, head 1.00H, across on the other shoulder
      // The founder named the backhand the weakest part of the film, and a stroke that goes from a hip-high
      // racquet straight to the ball has no loop in it, which is most of what "weakest" meant.
      const H = Math.max(4.0, rig.height);
      const handPrep = chest.clone(), headPrep = new THREE.Vector3();
      const handTake = chest.clone(), headTake = new THREE.Vector3();
      // The shaft is the racquet, 1.70ft from the butt to the head, so the head is the hand plus that length
      // along a direction. The direction is the founder's, 2026-11-11: "you've implemented racquet-back at around
      // 180 degrees. Just come back about 100 degrees" — level with the shoulder line and a little behind it, so
      // the head is BESIDE the player and not behind their back. 100 degrees from the way they are facing is
      // (0.97 across, 0.17 behind).
      const prepDir = new THREE.Vector3(), takeDir = new THREE.Vector3();
      if (back) {
        // across the chest: both hands on the left, head out to that side
        handPrep.addScaledVector(right, -0.50).addScaledVector(fwd, 0.30);
        prepDir.addScaledVector(right, -0.97).addScaledVector(fwd, -0.17).addScaledVector(_up, 0.15).normalize();
        handTake.copy(chest).addScaledVector(right, -0.40);
        takeDir.addScaledVector(right, -0.45).addScaledVector(fwd, -0.12).addScaledVector(_up, 0.88).normalize();
      } else {
        // open: the hitting hand back and away on the right, head out to that side
        handPrep.addScaledVector(right, 0.85).addScaledVector(fwd, -0.20);
        prepDir.addScaledVector(right, 0.97).addScaledVector(fwd, -0.17).addScaledVector(_up, 0.15).normalize();
        handTake.copy(chest).addScaledVector(right, 0.55);
        takeDir.addScaledVector(right, 0.45).addScaledVector(fwd, -0.10).addScaledVector(_up, 0.88).normalize();
      }
      handPrep.y = Math.min(handPrep.y, 0.71 * H);
      handTake.y = Math.max(chest.y + 0.30, 0.85 * H);
      headPrep.copy(handPrep).addScaledVector(prepDir, 1.70);
      headTake.copy(handTake).addScaledVector(takeDir, 1.70);
      // Where the hand IS, not where a chest-relative point says it should be. The ready pose is made twice in this
      // file — once as angles, by arms(), and once by the arm solver aiming at `readyHand` — and the two do not
      // agree: 1.3ft apart, measured, at the first frame of a shot, when the pose switches from one construction to
      // the other and the racquet head leaves at 33ft/s. Starting the blend from the hand's own position makes the
      // two constructions meet.
      // `wait` and not the hand's current position: the angular ready pose and the solved one are 1.5ft apart, and
      // the hand's current position is the angular one because arms() has just run. `wait` is the point the hitter
      // relaxes to and the point the standing player is now solved to, so all three agree.
      // The pump is the gait's own phase, faded in by `grow` so a standing player and the first frame of a run are
      // exactly where they were, and it is on the body's lateral axis so it crosses the centre line rather than
      // pushing the hand forward. `phase` advances with distance covered (`cycle` ft per stride pair), so the frame
      // goes out and back exactly once each stride pair — which is what the arm of a person running does.
      // AND THE CARRY IS THE FOUNDER'S, not the ready pose: "If the players are remembering 'racquet back,' they run
      // with their arm open for a forehand shot, but with their arm crossing in front of their body when they run
      // towards a backhand shot." That is `handPrep` — the PREPARATION panel of the reference sheet — reached by
      // `windup`, which is zero until the ball is half a second away, so for the whole run the frame sat in the
      // ready pose with a lateral offset of ~0 either side (measured: median rh -0.23ft for a forehand, -0.07 for a
      // backhand, i.e. no side at all). `CARRY_READY` puts the frame that far toward the take-back for the whole
      // run, and the pump on top of it makes the arm move with the gait rather than hang.
      // `1 - windup`: the pump belongs to the carry, and a take-back is not a carry. Without this the swing went on
      // pushing the hand 1.7ft sideways through the quarter second in which the arm is deliberately taking the frame
      // back, which is a wobble in the one part of the stroke a beginner is actually being taught.
      const pump = CARRY ? Math.sin(phase) * CARRY_PUMP * pumpGrow * (1 - windup) : 0;
      const carryK = CARRY ? Math.max(windup, CARRY_READY * grow) : windup;
      if (q.has("pumpdebug")) console.log("debug pump", pl.name, T.toFixed(2), "pump", pump.toFixed(3),
        "grow", grow.toFixed(2), "phase", phase.toFixed(2), "moving", moving ? 1 : 0, "walking", walking ? 1 : 0);
      const prep = wait.clone().lerp(handPrep, carryK).addScaledVector(right, pump);   // a beginner never gets here
      if (isReceiver) {
        // When, not whether: the take-back happens in the last half-second of the ball's flight, and the swing
        // from there to the ball in the last of it, ending exactly on the frame the next shot starts on. A rushed
        // player does both in less time, which is what being rushed means.
        const swing = Math.max(0.20, 0.34 - 0.16 * rush);
        const t0 = Math.max(0, seg.dur - swing);
        const upK = Math.max(0, Math.min(1, (tl - t0) / (swing * 0.55)));
        const thruK = Math.max(0, Math.min(1, (tl - (t0 + swing * 0.55)) / (swing * 0.45)));
        const nxtBall = (recv && recv.rally === sh.rally) ? recv : null;
        let hand = prep.clone().lerp(handTake, upK);
        // The head of the frame travels with the hand, or the racquet's shaft would swing like a metronome.
        let head = readyAim.clone().lerp(headPrep, carryK).addScaledVector(right, pump).lerp(headTake, upK);
        // WHERE THE NEXT BALL WILL BE MET, and it has to outlive the block that computes it: the step toward the
        // contact is drawn from here. Declared outside because the same point is needed twice — once for the swing
        // and once for the stride — and the first version of this wrote it as `const at` inside the block, so the
        // call below silently took the OUTER `at`, which is `northIn(seg, name)` and therefore a BOOLEAN. A boolean
        // has no `.y`, so the gap came out NaN, `NaN > 0` is false, and the step was set to zero on every frame of
        // every approach since the step was written. Measured on `records/item31-after`: the receiver's applied
        // offset was 0.00,0.00,0.00 on the last six frames before a contact, and the whole 3.20ft arrived in one
        // frame on the striker's first frame instead — 3.23ft in 0.02s, which is item 2b's defect rebuilt.
        let meet = null, stepAt = null;
        if (nxtBall) {
          const outc = new THREE.Vector3(nxtBall.v0[0], nxtBall.v0[2], nxtBall.v0[1]).normalize();
          const cBall = new THREE.Vector3(nxtBall.contact[0], nxtBall.contact[2], nxtBall.contact[1]);
          // The ball is struck where the feet will BE, not where they are: a receiver still four feet from the
          // contact would otherwise swing at a point four feet beyond the racquet. Shift the target by the run
          // that is still to come, so the blend ends on the contact exactly when the body arrives there.
          const shift = new THREE.Vector3(0, 0, 0);
          if (sh.run && sh.run.player === pl.name) shift.set(sh.run.to[0] - pos[0], 0, sh.run.to[1] - pos[1]);
          meet = cBall.clone().sub(shift);
          stepAt = cBall;                       // the step aims at the contact, not at the swing's shifted target
          hand.lerp(meet.clone().addScaledVector(outc, -(PALM + 1.74)), thruK);
          head.lerp(meet, thruK);
        }
        const lead = back ? "L" : "R";
        // `seg.dur - tl` is when the ball this player must return LANDS. The meet is struck earlier than that, so the
        // step is phased on the record's own contact time for that shot and not on the end of the flight.
        if (meet) {
          const meetT = CONTACT[nxtBall.rally + ":" + nxtBall.n];
          reachTo(rig, lead, stepAt, (meetT === undefined ? seg.start + seg.dur : meetT) - T, tl,
                  seg.sh.rally + ":" + seg.sh.n, pl.name + "/recv");
        }
        solveArm(rig, hand, lead);
        const shaftNow = head.clone().sub(hand).normalize();
        if (back) solveArm(rig, hand.clone().addScaledVector(shaftNow, 0.36), "R");   // the butt hand
        placeRacquet(rig, head, _face);
        if (q.has("debug")) {
          const h = (rig.bones["hand" + lead] || rig.root).getWorldPosition(new THREE.Vector3());
          const rel = h.clone().sub(chest), hd = head.clone().sub(chest);
          console.log("debug prep", pl.name, back ? "backhand" : "forehand", "windup", windup.toFixed(2),
            "up", upK.toFixed(2), "thru", thruK.toFixed(2),
            "| hand at chest+", `side ${rel.dot(right).toFixed(2)}`, `fwd ${rel.dot(fwd).toFixed(2)}`,
            `up ${rel.y.toFixed(2)}`, "| head at chest+", `side ${hd.dot(right).toFixed(2)}`,
            `fwd ${hd.dot(fwd).toFixed(2)}`, `up ${hd.y.toFixed(2)}`,
            "| head height", head.y.toFixed(2), "of", H.toFixed(2),
            "| shaft", (Math.atan2(head.clone().sub(hand).dot(right), head.clone().sub(hand).dot(fwd)) * 180 / Math.PI)
              .toFixed(0) + "deg",
            `miss ${h.distanceTo(hand).toFixed(2)}`);
        }
      } else {
        // Solved to the hand's own ready point, exactly as the hitter's arm is solved to it when the stroke relaxes.
        // The pose used to be made two ways — angles here, IK there — and the two answers were 1.3ft apart, so the
        // racquet left at 33ft/s whenever the picture switched from one to the other.
        //
        // AND THIS IS WHERE ITEM 12 ACTUALLY LIVES. Everything above is a player with a stroke to make; this branch
        // is a player with NO ball to strike — the one who has just lost the point, running back to the middle. It
        // was a fixed ready pose for the whole run, which is the founder's "the arms never come back to the right
        // side during a run" exactly. Measured on `records/item31-after` before this branch carried anything: the
        // frame's lateral offset was the SAME to two decimals for the whole of a recovery, while the legs under it
        // ran a full stride pair. The same carry as the striker's — out on the hitting side, swinging with the gait
        // — moves the hand where the arm of a person running moves, and `grow` fades it in and out with the stride.
        const sway = CARRY ? Math.sin(phase) * CARRY_PUMP * pumpGrow : 0;
        if (q.has("pumpdebug")) console.log("debug noprep", pl.name, T.toFixed(2), "moving", moving ? 1 : 0,
          "walking", walking ? 1 : 0, "grow", grow.toFixed(2), "pumpGrow", pumpGrow.toFixed(2),
          "phase", phase.toFixed(2), "sway", sway.toFixed(2), "el", (T - (mStart || -99)).toFixed(2));
        const carryPoint = wait.clone()
          .addScaledVector(right, (CARRY ? CARRY_READY * grow * (back ? -0.55 : 0.85) : 0) + sway)
          .addScaledVector(_up, CARRY ? -1.05 * CARRY_READY * grow : 0);
        solveArm(rig, carryPoint, "R");
        placeRacquet(rig, readyAim.clone().add(carryPoint.clone().sub(wait)), _face);
      }
    }
    if (walkK > 0.001) {
      if (q.has("pumpdebug")) console.log("debug walkcarry", pl.name, T.toFixed(2), "walkK", walkK.toFixed(3),
        "walking", walking ? 1 : 0, "rel", (tlRaw - seg.dur).toFixed(3), "hold", seg.hold.toFixed(2));
      // The racquet goes down by the thigh. Whoever struck the ball that ended the point has had the stroke branch
      // run on them this frame, and a follow-through is not a walk — measured, that arm was still up with the hand
      // at 5.8ft and the frame at 4.0ft — so the arms go back down before the frame is carried.
      // AND IT IS REACHED AND LEFT BY FADE: `walkK` is the walk's own clock, so the pose this frame came in with
      // is kept on one side and blended back out of on the other. At walkK 1 this block is byte for byte what it
      // was; at walkK 0 it leaves the frame exactly where the branch above put it. The thing that used to jump
      // 6.31ft is now the thing that moves for three tenths of a second.
      const fwd = new THREE.Vector3(Math.sin(rig.yaw), 0, Math.cos(rig.yaw));
      const CARRY_ARMS = ["upperarm.R", "forearm.R", "upperarm.L", "forearm.L"];
      const midway = walkK < 0.999;
      const was = midway ? CARRY_ARMS.map(n => (rig.bones[n] ? rig.bones[n].quaternion.clone() : null)) : null;
      const rac0 = (midway && rig.racquet)
        ? { p: rig.racquet.position.clone(), q: rig.racquet.quaternion.clone() } : null;
      stroll(rig, new THREE.Vector3(at ? 1 : -1, 0, 0), phase);
      const hand = rig.bones["handR"];
      const hp = hand ? hand.getWorldPosition(new THREE.Vector3()) : rig.root.position.clone();
      placeRacquet(rig, hp.clone().addScaledVector(_up, -1.35).addScaledVector(fwd, 0.85), fwd);
      if (was) {
        CARRY_ARMS.forEach((n, i) => {
          const b = rig.bones[n];
          if (!was[i] || !b) return;
          const target = b.quaternion.clone();
          b.quaternion.copy(was[i]).slerp(target, walkK);
        });
        if (rac0) {
          // The head travels with the hand at both ends of the fade, so the shaft neither stretches nor comes
          // adrift by more than the two hands' own paths differ — which is the arm slerp above, not a number.
          const tp = rig.racquet.position.clone(), tq = rig.racquet.quaternion.clone();
          rig.racquet.position.copy(rac0.p).lerp(tp, walkK);
          rig.racquet.quaternion.copy(rac0.q).slerp(tq, walkK);
        }
      }
      // The nod: two dips of the chin across three quarters of a second either side of the pass.
      let pitch = 0;
      if (walking && dpass !== null && dpass > -0.75 && dpass < 1.0) {
        const u = (dpass + 0.75) / 1.75;
        pitch = 0.34 * Math.sin(Math.PI * u) * Math.abs(Math.sin(2 * Math.PI * u));
      }
      headPose(rig, pitch, fwd);
    } else {
      headPose(rig, 0, new THREE.Vector3(Math.sin(rig.yaw), 0, Math.cos(rig.yaw)));
    }

  }

  // words
  el("surface").textContent = `${D.surface} · wind ${D.wind.direction} ${D.wind.mph}mph`
    + (SEASONNOTE ? ` · ${SEASONNOTE}` : "");
  el("rally").textContent = `rally ${sh.rally} of ${D.rallies.length} · shot ${sh.i}`;
  el("who").textContent = sh.player;

  const sw = el("sweet"); sw.textContent = sh.sweet ? "clean" : "framed";
  sw.className = "badge " + (sh.sweet ? "clean" : "frame");
  // the target, named rather than numbered: a reader can see that the ball was sent to a corner, and which
  const corner = sh.target ? `${sh.target[1] < WID / 2 ? "west" : "east"} corner, ` +
    `${Math.round(sh.target[0] < LEN / 2 ? sh.target[0] : LEN - sh.target[0])}ft inside` : `${sh.aim}ft across`;
  el("shotline").textContent = `face ${sh.face > 0 ? "+" : ""}${sh.face}°  power ${Math.round(sh.power)}  ` +
    `aimed ${corner}  leaving at ${Math.round(sh.power * 1.05)}mph`;
  const rn = sh.run;
  el("why").textContent = sh.why + (rn
    ? `   ·   ${rn.player} runs ${rn.dist}ft at ${rn.speed}ft/s${rn.met ? "" : " and does not get there"}`
    : "");
  if (sh.corridor[0] !== null) {
    const [lo, hi] = sh.corridor, zero = -12, span = 30;
    const x = v => Math.max(0, Math.min(100, (v - zero) / span * 100));
    el("self").style.left = x(lo) + "%";
    el("self").style.width = Math.max(1.2, x(hi) - x(lo)) + "%";
    el("tick").style.left = x(Math.max(-12, Math.min(18, sh.face))) + "%";
    el("winline").textContent = `${(hi - lo).toFixed(1)}° wide (${lo.toFixed(1)}° to ${hi.toFixed(1)}°) — this shot at ${sh.face.toFixed(1)}°`;
  }
  el("players").innerHTML = D.players.map(p =>
    `<div><span class="swatch" style="background:${p.north ? "#8fc6ff" : "#ffb98f"}"></span>${p.name} ` +
    `<span class="mono" style="color:var(--dim)">${p.rating.toFixed(1)} · ${p.balls} balls</span></div>`).join("");
  // The board stays up for the whole break, not for the length of the clock hold. He asked for it to overlay the
  // court across the break rather than flash (2026-11-11), and he is right: the break is the moment the picture
  // has nothing else to say, and a sign that appears for 0.4s of a 1.2s break is a stutter, not a caption.
  // ...but not across the whole break any more: the walk between points is now the picture, and he asked to see
  // it. The board is up for the first second and a half of the break, which is as long as it takes to read, and
  // then the court gets its players back.
  const deepInBreak = !!(seg.settle && tlRaw > seg.dur + 1.8);
  const showSign = !!(seg.point && (onCut || signAlways) && !deepInBreak);
  el("sign").className = showSign ? "on" : "";
  if (showSign) {
    el("signwho").textContent = `Point to ${seg.point.winner}`;
    el("signwhy").textContent = seg.point.reason;
    el("signctx").textContent = `rally ${sh.rally} of ${D.rallies.length} · ${D.surface} · ` +
      `last ball: ${sh.player}`;
  }
  el("cut").className = (onCut && !deepInBreak) ? "on" : "";
  // The card names the player the camera has cut to, and is hidden the moment the ball is in play: it is a still
  // of a person, so it may only appear when the record is not claiming to show a ball.
  const who = onCut ? (WINPOS[sh.rally] ? WINPOS[sh.rally].name : sh.player) : null;
  if (who) {
    const pl = D.players.find(x => x.name === who);
    if (pl) {
      const img = el("faceimg");
      const src = `bodies/faces/${pl.body}.jpg`;
      // A character with a sentence gets a generated face, and the <img> is not asked for at all — asking for a file
      // that does not exist is how the card used to spend a request learning it had nothing. A player with no
      // sentence keeps the old order: a drawing if one exists, a monogram if not.
      const gen = FACES[pl.name];
      // The card's own className is rebuilt every frame from `on`, so the fact that this face is GENERATED is kept
      // in `faceIsGen` and put back on the class list below rather than added here — the same trap the monogram fell
      // into on 2026-11-19, in the same six lines.
      faceIsGen = !!(gen && typeof portraitSVG === "function");
      if (faceIsGen) {
        const box = el("facegen");
        const key = `${pl.name}|${gen}`;
        if (box.getAttribute("data-for") !== key) {
          box.innerHTML = portraitSVG(gen, {size: 248, background: true});
          box.setAttribute("data-for", key);
        }
        img.className = "none";
      } else {
        if (img.getAttribute("src") !== src) {
          img.setAttribute("src", src);
        // The card is a still of a person, so it may only claim a person the record can show. A body with no
        // drawing gets a monogram and the same name; the alternative on 2026-11-19 was a broken-image glyph.
        // The flag lives on the IMAGE and not on the card, because the card's className is rebuilt every frame
        // from `on` — which is how the first version of this lost its own monogram while drawing the right name.
          const mono = el("facemono");
          mono.textContent = pl.name.slice(0, 1).toUpperCase();
          img.onerror = () => { img.className = "none"; mono.style.display = "block"; };
          img.onload = () => { img.className = ""; mono.style.display = "none"; };
        }
      }
      el("facename").innerHTML = `${pl.name} <span>${pl.rating.toFixed(1)}</span>`;
    }
  }
  el("facecard").className = ((who && !deepInBreak) ? "on" : "") + (faceIsGen ? " gen" : "");
  if (onCut) el("cut").textContent =
    `between points · ${WINPOS[sh.rally] ? WINPOS[sh.rally].name : sh.player}`;

  // `?toe` prints the point that leaves the ground, once a frame, with the `plantHeel` that is supposed to lift it.
  // The bottom of a foot is a place, not a bone: the foot bone's origin is the ankle.
  if (q.has("toe")) for (const pl of D.players) {
    const r = rigs[pl.body]; if (!r) continue;
    console.log("debug toe", pl.name, "L", toeOf(r, "footL").toFixed(3), "R", toeOf(r, "footR").toFixed(3),
      "heel", (r.plantHeel || 0).toFixed(2), "back", r.plantBack || "-", "T", T.toFixed(3),
      "s0", (seg ? seg.start : 0).toFixed(2), "toss", (seg ? (seg.tossDur || 0) : 0).toFixed(2),
      "ankL", (r.bones["footL"] ? r.bones["footL"].getWorldPosition(new THREE.Vector3()).y : NaN).toFixed(3),
      "ankR", (r.bones["footR"] ? r.bones["footR"].getWorldPosition(new THREE.Vector3()).y : NaN).toFixed(3));
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ?debug also exposes the one thing a still cannot show: where every striker's FEET are at the instant they
   strike, which is what decides whether the ball can be on the frame's strings at all. One line per shot, read
   out of the same whereAt() the film uses rather than re-derived here. The arm and the racquet are 3.6ft
   together, so a contact further than that from the shoulder is a stroke nobody could have played. */
/* And where the bodies actually are, because "is anybody moving" is a question a still cannot answer and a
   number can. Root position, the two thighs' world positions, and the yaw: sample it at two film times and the
   difference is the answer. */
if (q.has("debug")) window.__pose = () => D.players.map(pl => {
  const r = rigs[pl.body];
  if (!r) return null;
  const at = n => (r.bones[n] || r.root).getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(4));
  // the racquet is not parented to anything, so its head is read the way the page places it: butt at the palm,
  // 1.74ft up the shaft — the same number the stroke math uses
  const rh = r.racquet ? r.racquet.position.clone()
    .addScaledVector(new THREE.Vector3(0, 1, 0).applyQuaternion(r.racquet.quaternion), 1.74) : null;
  // ankL/ankR are here for the plant: "the back foot comes up on the toe" is a claim about the ANKLE's height, and
  // until the ankle is readable a foot change can only be looked at, which is how four foot revisions got shipped.
  return { name: pl.name, root: [r.root.position.x, r.root.position.y, r.root.position.z].map(v => +v.toFixed(4)),
           thighL: at("thighL"), shinL: at("shinL"), ankL: at("footL"), ankR: at("footR"),
           handR: at("handR"), racquet: rh ? rh.toArray().map(v => +v.toFixed(3)) : null,
           yaw: +(r.yaw || 0).toFixed(4) };
});

/* A still cannot show motion, and the wall clock cannot be trusted in a headless browser: `?point=` and `?shot=`
   both PAUSE the film, so a sweep of them proves nothing at all about whether anybody moves. `__seek` steps the
   film to an exact time with the clock stopped, so a probe can sample every 50ms of FILM time rather than of wall
   time — and `__seg` says where the breaks are, which is the only way to find a change of ends without watching
   five minutes of tennis. `__head` is there because a nod happens at one joint. */
if (q.has("debug")) window.__seek = (t) => { playing = false; pauseUntil = 0; firstFrame = true; T = Math.max(0, t); return T; };
if (q.has("debug")) window.__seg = () => SEG.map(s => ({ n: s.sh.n, rally: s.sh.rally, player: s.sh.player,
  start: +s.start.toFixed(2), dur: +s.dur.toFixed(2), hold: +s.hold.toFixed(2),
  breakAt: +(s.start + s.dur).toFixed(2),
  cross: s.cross ? { dur: s.cross.dur, post: s.cross.post, pass: s.cross.pass.t } : null,
  point: s.point ? s.point.winner : null }));
if (q.has("debug")) window.__head = () => D.players.map(pl => { const r = rigs[pl.body]; if (!r) return null;
  const b = r.bones["head"]; if (!b) return null;
  return { name: pl.name, pitch: +b.rotation.x.toFixed(4), roll: +b.rotation.z.toFixed(4),
           at: b.getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(3)) }; });

/* Which way a nod goes is a fact about the file, not about Blender's conventions: the bone's local axes are
   whatever the exporter wrote. So the axes are measured instead of assumed — rotate one axis at a time and see
   where the top of the head goes. A nod moves it forward and down; a shake moves it sideways. */
if (q.has("debug")) window.__headTest = (axis, ang) => D.players.map(pl => {
  const r = rigs[pl.body]; if (!r) return null;
  const hd = r.bones["head"]; if (!hd) return null;
  const rest = hd.userData.rest || (hd.userData.rest = hd.quaternion.clone());
  const ax = new THREE.Vector3(axis === 0 ? 1 : 0, axis === 1 ? 1 : 0, axis === 2 ? 1 : 0);
  hd.quaternion.copy(rest).multiply(new THREE.Quaternion().setFromAxisAngle(ax, ang));
  // the bone's own origin does not move when the bone turns, so the thing to measure is which way the bone
  // POINTS: a nod tilts its long axis forward, a shake tilts it sideways.
  hd.updateWorldMatrix(true, false);
  const up = new THREE.Vector3(0, 1, 0).transformDirection(hd.matrixWorld).toArray().map(v => +v.toFixed(3));
  hd.quaternion.copy(rest);
  return { name: pl.name, axis, ang, boneDir: up };
});

/* Every move the picture knows about for one player, in the order whereAt walks them. The instrument for "why is
   this body here": a position that does not match the record is either a missing move or two moves overlapping. */
if (q.has("debug")) window.__moves = (name) => (PLAN[name] || []).map(m => ({
  t0: +m.t0.toFixed(2), t1: +m.t1.toFixed(2), from: m.from, to: m.to }));

if (q.has("debug")) window.__audit = () => SEG.map(s => ({
  n: s.sh.n, player: s.sh.player, kind: s.sh.kind, t: s.start,
  pos: whereAt(s.sh.player, s.start), contact: s.sh.contact, met: s.sh.run ? !!s.sh.run.met : null,
}));

/* `?sweep=t0:t1:dt` steps the film in fixed steps of RECORD time and prints one JSON line per step: the root
   height of each player and whether they are the hitter of the shot being played. It exists because the headless
   browser draws about one frame a second of wall clock, so a per-frame log samples the film at random — the split
   step's question ("is there a dip of 0.10–0.20ft within 0.2s of the opponent's contact?") needs the frames in
   order, not the ones the compositor happened to give. Frames, not wall clock: `tick` is called directly. */
if (q.has("sweep")) window.__sweep = () => {
  const [a, b, d] = (q.get("sweep") || "0:1:0.05").split(":").map(Number);
  const was = playing; playing = false;
  console.log("debug segs", JSON.stringify(SEG.map(s => [s.sh.n, +s.start.toFixed(2), +s.dur.toFixed(3),
    +(s.tossDur || 0).toFixed(3), s.sh.player,
    s.sh.run ? [+s.sh.run.dist.toFixed(2), s.sh.run.from[0], s.sh.run.from[1],
                s.sh.run.to[0], s.sh.run.to[1]] : null,
    // when this segment's hold ends, so that "which segment is being played" can be recomputed from the record
    // rather than read off the frames — the toss question of 2026-11-26 is a question about two overlapping windows
    +((s.start + s.dur + s.hold).toFixed(2)),
    // WHERE THE BALL IS MET, which is the other half of "is the frame on the ball": the row carries the feet, the
    // feet are in the plan, and until now nothing in a log said where the contact was. Item 16's remainder is the
    // distance between these two, read per contact instead of for one printed frame at a time.
    s.sh.contact ? [+s.sh.contact[0].toFixed(2), +s.sh.contact[1].toFixed(2), +s.sh.contact[2].toFixed(2)] : null])));
  console.log("debug film", JSON.stringify([+SEG[0].start.toFixed(2), +(SEG[SEG.length - 1].start + SEG[SEG.length - 1].dur
    + SEG[SEG.length - 1].hold).toFixed(2)]));
  // And the plan itself, because "why is this body here" is answered by the move whose window T is inside, and
  // the one thing a row cannot say is WHICH move put it there. Printed once, before the rows.
  console.log("debug plan", JSON.stringify(Object.keys(PLAN).map(n => [n, (PLAN[n] || []).map(m =>
    [+m.t0.toFixed(2), +m.t1.toFixed(2), m.from, m.to])])));
  const rows = [];
  for (let t = a; t <= b + 1e-9; t += d) {
    T = Math.max(0, t);
    tick(T0 + 16);
    rows.push([+T.toFixed(3), shotAt(T).sh.n, +(T - shotAt(T).start - (shotAt(T).tossDur || 0)).toFixed(3),
      ...D.players.map(pl => {
        const r = rigs[pl.body];
        if (!r) return [null, null, null, null];
        const L = toePoint(r, "footL"), Rf = toePoint(r, "footR");
        // In the BODY's frame, not the court's. A cross-over is a fact about the legs relative to each other, and
        // a player who is turning towards the ball rotates the world positions of both feet — which reads as a
        // crossing to anything that measures in court coordinates. Measured 2026-11-19: the first version of this
        // said "7 of 7 shots cross their feet" on a build where nothing crossed at all.
        const yaw = r.root.rotation.y, cy = Math.cos(yaw), sy = Math.sin(yaw);
        const rel = v => v ? [
          +((v.x - r.root.position.x) * cy - (v.z - r.root.position.z) * sy).toFixed(2),
          +(v.y - r.root.position.y).toFixed(2),
          +((v.x - r.root.position.x) * sy + (v.z - r.root.position.z) * cy).toFixed(2)] : null;
        // How far the racquet's head is from the ball, at this instant. The film's central promise is that the
        // racquet is ON the ball at a contact; grounding moves the shoulder, so the promise has to be re-measured
        // after it rather than assumed.
        const rh = r.racquet ? r.racquet.position.clone()
          .addScaledVector(new THREE.Vector3(0, 1, 0).applyQuaternion(r.racquet.quaternion), 1.74) : null;
        const rq = rh ? +rh.distanceTo(ballPos).toFixed(3) : null;
        // The toe's height ABOVE THE COURT, which is the only number the grounding question is about — and not the
        // same number as the y in `rel`, which is measured from the root and so is invariant to the clamp. Reading
        // the body-frame figure on both sides of the switch reported "grounding changes nothing" on a build where
        // the median toe went from 0.254ft to 0.020ft.
        // The RACQUET HEAD in the body's own frame, on the same convention as `rel`: x is the body's lateral
        // axis, so the sign says which side of the body's own centre line the frame is on. Item 12 is a question
        // about that sign changing during a run, and no row before this could answer it.
        const rh2 = r.racquet ? r.racquet.position.clone()
          .addScaledVector(new THREE.Vector3(0, 1, 0).applyQuaternion(r.racquet.quaternion), 1.74) : null;
        return [+r.root.position.y.toFixed(3), shotAt(T).sh.player === pl.name ? 1 : 0, +yaw.toFixed(3),
                rel(L), rel(Rf), rq,
                [L ? +L.y.toFixed(3) : null, Rf ? +Rf.y.toFixed(3) : null],
                // Where the root is on the court, in feet, so that a run and a brake are numbers rather than a
                // description. Items 5 and 6 are questions about how fast the body is still moving when it
                // strikes and which way it is facing when it is done, and both are differences of this pair
                // between two rows. Appended, not inserted: every index before it keeps its meaning.
                [+r.root.position.x.toFixed(2), +r.root.position.z.toFixed(2)],
                // Item 12's field: the frame's lateral offset in the body's own frame, positive toward the
                // body's own right. Appended for the same reason.
                rh2 ? rel(rh2) : null];
      })]);
  }
  for (const row of rows) console.log("debug sweep", JSON.stringify(row));
  // THE CONTACT, SAMPLED AT ITS OWN CLOCK. Every number this project has quoted about "is the frame on the ball"
  // came from a sweep row, and a row is on a 0.02s grid: one that lands even six thousandths after a contact reads
  // half a trace hop, which at 113ft/s is a foot or more of gap the strike does not have. Measured 2026-11-27:
  // shot 44 of `records/item31-after` reads 2.58ft on the grid and 0.24ft here. These rows are ticked at exactly
  // `start + tossDur`, which is the contact by construction, and they name the player instead of a column number —
  // so a contact can no longer be attributed to whoever the reader's column map guessed.
  const keep = T;
  for (const s of SEG) {
    T = s.start + (s.tossDur || 0);
    tick(T0 + 16);
    const pl = D.players.find(x => x.name === s.sh.player) || {};
    const r = rigs[pl.body];
    const rh = r && r.racquet ? r.racquet.position.clone()
      .addScaledVector(new THREE.Vector3(0, 1, 0).applyQuaternion(r.racquet.quaternion), 1.74) : null;
    console.log("debug contact", JSON.stringify([+T.toFixed(3), s.sh.player, s.sh.n, s.sh.rally,
      rh ? +rh.distanceTo(ballPos).toFixed(3) : null,
      r ? +r.root.position.y.toFixed(3) : null,
      r ? [+r.root.position.x.toFixed(2), +r.root.position.z.toFixed(2)] : null,
      // The record's own contact point, carried here rather than joined onto `debug segs` by clock: the segment
      // prints its start to two decimals and this prints the contact to three, and a join across that rounds 0.004s
      // away — a join that fails on exactly the serves it was written for.
      s.sh.contact ? +s.sh.contact[0].toFixed(2) : null,
      s.sh.contact ? +s.sh.contact[1].toFixed(2) : null,
      s.sh.contact ? +s.sh.contact[2].toFixed(2) : null,
      s.sh.hand || null,
      // AND WHOSE FRAME IT ACTUALLY TICKED. `shotAt` picks the segment that STARTED latest, so a tick placed on a
      // boundary is one float ulp away from ticking the shot before it — in which case every number in this row is
      // the previous strike's, wearing this shot's name. A still at `?t=217.486` did exactly that: the printed
      // striker was Colette, whose 43rd shot had ended. 1 means the row is what it claims.
      shotAt(T) === s ? 1 : 0]));
  }
  T = keep;
  playing = was;
  return rows.length;
};

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener("keydown", e => {
  if (e.code === "Space") { playing = !playing; e.preventDefault(); }
  if (e.code === "ArrowRight") T += 0.25;
  if (e.code === "ArrowLeft") T = Math.max(0, T - 0.25);
});
if (q.has("t")) { T = parseFloat(q.get("t")); playing = false; }
if (q.has("point")) {
  // a still of the boards: jump to the end of a rally and hold the sign up
  const seg = SEG.find(x => x.sh.rally === parseInt(q.get("point"), 10) && x.point);
  // +0.02 and not exactly the cut instant: at exactly `start + dur` the comparison tl >= cams[1].at is decided by
  // floating point, so the ?point= jump showed the tower about half the time and the closeup the rest of it.
  if (seg) { T = seg.start + seg.dur + 0.02; playing = false; signAlways = true; }
}
if (q.has("shot")) {
  const seg = SEG.find(x => x.sh.n === parseInt(q.get("shot"), 10));
  if (seg) { T = seg.start + seg.dur * parseFloat(q.get("at") || "0.8"); playing = false; }
}

loadBodies().then(() => {
  if (q.has("sweep")) { requestAnimationFrame(() => requestAnimationFrame(() => window.__sweep())); return; }
  requestAnimationFrame(tick);
}).catch(e => {
  fail(`<div><div class="k">the bodies did not load</div><p>${e.message}</p>` +
       `<p>Open this page from a local server, not from the filesystem:<br>` +
       `<code>cd ~/ai_tribe && python3 -m http.server 8000</code><br>` +
       `then <code>http://localhost:8000/games/tennis/demo3d.html</code></p></div>`);
});
</script>
</body>
</html>
