  hitting arm is posed by solving towards the *contact point the physics used* — a small CCD solve each
  frame, not a hand-keyed animation. So the swing is a consequence of the shot, and a shot the engine
  judged as a mishit is a swing that reached for something it could not reach.

<style>

  .hud{position:fixed;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9)}

  .badge.frame{border-color:rgba(230,140,120,.55);color:#f0b3a4}
  .row{display:flex;gap:10px;align-items:baseline}
  #bar{position:relative;height:26px;margin-top:6px}
  #bar .track{position:absolute;inset:9px 0;background:rgba(255,255,255,.10);border-radius:2px}
  #bar .self{position:absolute;top:9px;bottom:9px;background:rgba(160,215,255,.30);
    border-left:1px solid rgba(160,215,255,.75);border-right:1px solid rgba(160,215,255,.75)}
  #bar .tick{position:absolute;top:2px;bottom:2px;width:2px;background:var(--ink)}
  /* The break card: the founder's headshots, 2026-11-11. It stands in for the shot-technical panel while the

  #facecard{position:fixed;left:34px;top:52%;transform:translateY(-50%);width:248px;background:#f4f1ea;
    border-radius:10px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.55);opacity:0;

  #facecard.on{opacity:1}
  #facecard img{width:100%;display:block;filter:grayscale(1) contrast(1.06)}
  /* NOT EVERY MEMBER HAS A DRAWING. Two of the six do (the founder's, 2026-11-11) and the other four are bodies
     with no portrait, so `bodies/faces/<body>.jpg` is a 404 and the card showed a broken-image glyph with a name
     under it — worse than no card, because a glyph reads as a fault in the page rather than as a person who has
     not been drawn yet. So a missing face falls back to a monogram: the same paper card, the same name and
     rating, a letter where the drawing would be. Nothing is invented and nothing looks broken. */
  #facecard img.none{display:none}
  /* A generated face sits in the same paper card as a drawing, so it is treated the same way: one colour, full
     width. Colour here would make the two kinds of picture look like two products. */

<!-- portrait.js: a character's face, drawn from one sentence. Classic script, before the module, because the module

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* Where the record comes from. Dmitri's setup contract (`games/tennis/SETUP.md` §4) has three ways of getting a
   season's play onto this screen, and the one that costs nobody anything is this one: the page FETCHES the record,
   so a season folder holds a JSON file and every season links to the same viewer. The baked copy stays as the
   fallback, which is what the three demo films are and what a page opened from disk still shows.

   `?record=../seasons/2026-spring/rally.json` — relative to this page, so the season folder is the unit that gets
   moved or linked to, not the player. */
const QS = new URLSearchParams(location.search);
const REC = QS.get("record");
const D = REC ? await (await fetch(REC)).json()
              : JSON.parse(document.getElementById("script").textContent);

/* Where the appearance comes from — the other half of the same contract. `SETUP.md` §2 has the Play page write
   `players.json` and §3 has the runner copy the resolved file into the season as `setup.json`, so the season folder
   is the unit: a record at `seasons/<season>/rally.json` is assumed to have its provenance copy beside it, and the
   copy is what this page reads, not the live file — a season's picture has to be the season that was played.
   `?setup=<url>` overrides, and a missing file is not an error: the three demo films have none and nothing else
   changes, because every field here has a sensible absence. */
const SETUP = QS.get("setup") || (REC ? REC.replace(/[^/]*$/, "") + "setup.json" : null);
const LOOK = {};
if (SETUP) {
  try {
    const S = await (await fetch(SETUP)).json();
    for (const p of S.players || []) LOOK[p.name] = p.look || {};
    if (QS.has("debug")) console.log("debug setup", SETUP, JSON.stringify(LOOK));
  } catch (e) { console.warn("no setup beside the record:", SETUP); }
}
/* Who may be drawn, and from what sentence. `cast.json` is not part of a season's record — a record says what was
   played, and this says which of the players is a character with a face rather than a member of the commons. Four
   of the six are characters (CAST.md), and the two who are not keep the monogram: a participant is not given a face
   by me. A missing file is not an error — the card falls back to a drawing on disk and then to a monogram. */
const CASTS = QS.get("cast") || "cast.json";
let faceIsGen = false;
const FACES = {};
try {
  const K = await (await fetch(CASTS)).json();
  for (const [name, v] of Object.entries(K.players || {})) if (v && v.face) FACES[name] = v.face;
  if (QS.has("debug")) console.log("debug cast", CASTS, JSON.stringify(FACES));
} catch (e) { console.warn("no cast beside the page:", CASTS); }

/* HOW FAR BEHIND THE LIVE SEASON THIS FILM IS (item 23, 2026-11-26). `watch.json` is the last session somebody
   WATCHED, not the last one that was played — Dmitri's games run live and off-screen, and the clock may play five
   overnight while the page shows the film from before them. The film carries the session it was played as
   (`session: {n, of}`), and the book beside it (`practice.json`) says how far the season has got now, so the page
   can say "session 3 of 6 — four since this film" rather than let a viewer assume it is live. A film with no
   season block (a demo, a practice on a fork) says nothing extra, because it has no season to be behind. */
let SEASONNOTE = "";
if (D.session) {
  SEASONNOTE = `session ${D.session.n}${D.session.of ? ` of ${D.session.of}` : ""}`;
  try {
    const bookUrl = REC.replace(/watch\.json.*$/, "practice.json");
    if (bookUrl !== REC) {
      const B = await (await fetch(bookUrl)).json();
      const now = Math.max(0, ...Object.values(B.members || {}).map(m =>
        (m.sessions || []).filter(s => s.mode !== "person").length));
      const since = now - D.session.n;
      SEASONNOTE += since > 0 ? ` — ${since} since this film` : " — this is the latest";
    }
  } catch (e) { console.warn("no book beside the record:", REC); }
  if (QS.has("debug")) console.log("debug season", SEASONNOTE);
}

const C = D.court, LEN = C.length, WID = C.width, NX = C.net_x;
/* The doubles alley. It is painted and never judged: every ball in this film is judged against the 27ft singles
   court, and the two extra sidelines 4.5ft outside it are the ones a doubles match would use. The founder,
   2026-11-12: "An actual tennis court has an additional set of lines on each side. They are out of bounds in
   singles play but they always there, since they are in bounds in doubles play." So the clay is 36ft wide and
   the court is 27. */
const ALLEY = C.alley === undefined ? 4.5 : C.alley;
const TRACE = 0.02;

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e11);
scene.fog = new THREE.Fog(0x0b0e11, 90, 260);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xa8c0d6, 0x3a2418, 1.5));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
sun.position.set(-40, 70, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const s = 70;
sun.shadow.camera.left = -s; sun.shadow.camera.right = s;
sun.shadow.camera.top = s; sun.shadow.camera.bottom = -s;
sun.shadow.camera.far = 260;
scene.add(sun);

/* ---------- the court, drawn as a texture ----------
   Lines on a clay court are a texture problem, not a geometry problem. Drawing them into a canvas and
   mapping it onto one plane keeps the line where the rule says it is, at any camera angle, without a
   single quad of z-fighting. */
// The founder's reference photograph, 2026-11-12: a green court with a brick-red run-off, and the two are
// clearly two different materials rather than two shades of one. So a surface is now a pair of colours — what is
// inside the lines, and what is outside them — and the outside is the darker, duller one. Clay keeps its orange,
// because clay is orange; the green one is the picture.
const SURFACE = {
  clay:  { court: [0xb4, 0x55, 0x3a], out: [0x8a, 0x3f, 0x2a] },
  hard:  { court: [0x3e, 0x7a, 0x4e], out: [0x8e, 0x3a, 0x2c] },
  grass: { court: [0x53, 0x6f, 0x42], out: [0x3a, 0x4c, 0x30] },
};
const PAL = SURFACE[D.surface] || SURFACE.clay;
const CLAY = PAL.court;

function courtTexture() {
  const px = 26;                                   // pixels per foot
  const pad = 22;
  const cv = document.createElement("canvas");
  cv.width = (LEN + pad * 2) * px; cv.height = (WID + ALLEY * 2 + pad * 2) * px;
  const g = cv.getContext("2d");
  // Two shades of the one clay, and the lighter one is exactly the doubles rectangle: the boundary is the white
  // lines, not a shape of its own. The founder, 2026-11-12: "Real courts don't have such a two-color floor, and if
  // they did, the distinguishing color would all be inside the white lines." It was 0.62 of the clay, which read
  // as a different material — a platform the court was sitting on — and it ran 4.5ft past each baseline, where
  // there is no line to end it: "The spill wasn't on the sides, it was behind the baselines at both ends of the
  // court." Both are fixed here: 0.82 of the clay, and the light rectangle is the doubles court exactly, from
  // baseline to baseline and doubles sideline to doubles sideline, so every edge of it is a line.
  const dark = `rgb(${PAL.out.join(",")})`;
  g.fillStyle = dark; g.fillRect(0, 0, cv.width, cv.height);
  g.translate(pad * px, (pad + ALLEY) * px);
  // the playing surface is the doubles width; the singles court is a set of lines on it, not a different colour
  g.fillStyle = `rgb(${CLAY.join(",")})`;
  g.fillRect(0, -ALLEY * px, LEN * px, (WID + ALLEY * 2) * px);
  g.strokeStyle = "rgba(248,246,238,.95)"; g.lineWidth = 0.30 * px; g.lineCap = "butt";
  const line = (x0, y0, x1, y1) => { g.beginPath(); g.moveTo(x0 * px, y0 * px); g.lineTo(x1 * px, y1 * px); g.stroke(); };
  const top = -ALLEY, bot = WID + ALLEY;
  // Baselines and sidelines run the full doubles width; the SERVICE lines do not. They stop at the singles
  // sidelines, because the doubles alley has no service line in it — four segments that were being drawn across
  // the alleys and are now not. The founder, 2026-11-12: "White lines (you have four extra line segments)."
  line(0, top, LEN, top); line(0, bot, LEN, bot);                       // the doubles sidelines
  line(0, top, 0, bot); line(LEN, top, LEN, bot);                        // the baselines
  line(0, 0, LEN, 0); line(0, WID, LEN, WID);                           // the singles sidelines
  line(NX - C.service_line, 0, NX - C.service_line, WID);                // service lines: singles width only
  line(NX + C.service_line, 0, NX + C.service_line, WID);
  line(NX - C.service_line, WID / 2, NX + C.service_line, WID / 2);      // the centre service line
  line(0, WID / 2, 0.9, WID / 2); line(LEN - 0.9, WID / 2, LEN, WID / 2);  // the two centre marks
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

const courtW = LEN + 44, courtD = WID + ALLEY * 2 + 44;
const court = new THREE.Mesh(
  new THREE.PlaneGeometry(courtW, courtD),
  new THREE.MeshStandardMaterial({ map: courtTexture(), roughness: 0.95, metalness: 0 })
);
court.rotation.x = -Math.PI / 2;
court.position.set(LEN / 2, 0, WID / 2);
court.receiveShadow = true;
scene.add(court);

// a dark apron so the court does not float in a void
const apron = new THREE.Mesh(new THREE.CircleGeometry(150, 48),
  new THREE.MeshStandardMaterial({ color: 0x14181c, roughness: 1 }));
apron.rotation.x = -Math.PI / 2; apron.position.y = -0.02; apron.receiveShadow = true;
scene.add(apron);

/* ---------- the net ---------- */
function netTexture() {
  const cv = document.createElement("canvas");
  cv.width = 512; cv.height = 64;
  const g = cv.getContext("2d");
  g.clearRect(0, 0, 512, 64);
  // dark cord rather than pale: a net is the darkest thing on a court, and drawn in near-white at low alpha it
  // disappeared against the clay. The two inches of white canvas along the top are part of the net, and the
  // reference photograph shows them, so they are drawn rather than left out.
  g.strokeStyle = "rgba(28,26,24,.78)"; g.lineWidth = 1.6;
  for (let x = 0; x <= 512; x += 8) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 64); g.stroke(); }
  for (let y = 0; y <= 64; y += 8) { g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke(); }
  // The white canvas along the top is NOT drawn here. It was, as four pixels of the texture, and at the distance the
  // broadcast camera sits those four pixels mip away into the net's own grey haze: measured on the film, the top of
  // the net had no edge at all. A band that has to be crisp at 78ft is geometry, so it is a ribbon below, cut out of
  // the mesh rather than laid over it.
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = THREE.RepeatWrapping; t.repeat.set(6, 1);
  return t;
}
// ---------- the net, as a real one hangs ----------
// The posts stand 3ft OUTSIDE the doubles court, which is the rule and is what the reference photograph shows: the
// net is wider than the court it divides. They were on the doubles sidelines, and a net hung between the sidelines
// leaves the alleys open. The founder, 2026-11-12: "Net pole positions".
const POST_OUT = 3.0;                                     // feet outside the doubles sideline, per the ITF rule
const NET_HALF = (WID + ALLEY * 2) / 2 + POST_OUT;        // half the span between the posts
// The posts hold the net at 3.5ft and the net hangs from its own headband; what sags is the net, because the centre
// strap pulls the middle down to exactly 3.0ft. So the top of the mesh runs from 3.5ft at each post to 3.0ft in the
// middle, and the white canvas along that edge dips with it. The founder named the effect: "Slight angle in net
// where it's pulled down by strap".
const netTopAt = u => C.net_posts - (C.net_posts - C.net_centre) * (1 - (2 * u - 1) ** 2);
const BAND = 0.22;                                         // the headband: a little under three inches of white canvas
{
  const NXSEG = 48, rows = 10, pos = [], idx = [];
  for (let i = 0; i <= NXSEG; i++) {
    const u = i / NXSEG, x = -NET_HALF + 2 * NET_HALF * u, top = netTopAt(u) - BAND;
    // the span is along X here and the mesh is turned a quarter turn below, the same way the flat plane it
    // replaced was: built across Z it ends up along the court's LENGTH, which is a net down the middle of the
    // service boxes.
    for (let j = 0; j <= rows; j++) pos.push(x, top * (j / rows), 0);
  }
  for (let i = 0; i < NXSEG; i++) for (let j = 0; j < rows; j++) {
    const a = i * (rows + 1) + j, b = a + rows + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const uv = [];
  for (let i = 0; i <= NXSEG; i++) for (let j = 0; j <= rows; j++) uv.push(i / NXSEG * 6, j / rows);
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  // depthWrite false, and it is not housekeeping: at the camera's distance the mipmap averages a net full of holes
  // into a thin veil, every fragment of which wrote depth — so the veil hid the centre strap standing behind it, and
  // that is why the strap could not be seen at all after it was added.
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: netTexture(), transparent: true,
    alphaTest: 0.05, depthWrite: false, side: THREE.DoubleSide, roughness: 0.9 }));
  mesh.position.set(NX, 0, WID / 2);
  mesh.rotation.y = Math.PI / 2;
  scene.add(mesh);

  // the headband: two inches of white canvas along the top edge, and it takes the net's own sag because it is built
  // on netTopAt, the same curve the mesh's top row uses — the mesh stops BAND below the top and this is what fills
  // the gap, so the two never overlap and there is nothing laid on top of anything.
  const bpos = [], bidx = [];
  for (let i = 0; i <= NXSEG; i++) {
    const u = i / NXSEG, x = -NET_HALF + 2 * NET_HALF * u, top = netTopAt(u);
    bpos.push(x, top, 0, x, top - BAND, 0);
  }
  for (let i = 0; i < NXSEG; i++) {
    const a = i * 2, b = a + 2;
    bidx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const bgeo = new THREE.BufferGeometry();
  bgeo.setAttribute("position", new THREE.Float32BufferAttribute(bpos, 3));
  bgeo.setIndex(bidx);
  const band = new THREE.Mesh(bgeo, new THREE.MeshStandardMaterial({ color: 0xf4f1e6, roughness: 0.8,
    side: THREE.DoubleSide }));
  band.position.set(NX, 0, WID / 2);
  band.rotation.y = Math.PI / 2;
  scene.add(band);
}
/* The centre strap, and the headband it holds down. There is no cord above the net: the white canvas is sewn along
   the net's own top edge and dips with it, and the strap is what makes it dip. The first version drew a straight
   white bar at 3.5ft all the way across, which is a white line floating a foot above the middle of the net — the
   founder, 2026-11-12: "There is no white line above the net in real life." The white band is now the top 0.22ft of
   the mesh itself (drawn in its texture, so it follows netTopAt and cannot float), and all that hangs above the
   ground at the centre is the strap. */
{
  // the strap: from the ground to the headband, 2 inches wide, and it is the thing that puts the sag in the net.
  // It sits a hair in front of the net's plane so it is drawn rather than z-fighting with the mesh.
  const strap = new THREE.Mesh(new THREE.BoxGeometry(0.035, netTopAt(0.5) + 0.06, 0.17),
    new THREE.MeshStandardMaterial({ color: 0xf2efe4, roughness: 0.85 }));
  strap.position.set(NX + 0.05, (netTopAt(0.5) + 0.06) / 2, WID / 2);
  strap.castShadow = true;
  scene.add(strap);
}
for (const z of [-ALLEY - POST_OUT, WID + ALLEY + POST_OUT]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, C.net_posts, 12),
    new THREE.MeshStandardMaterial({ color: 0x2a2a2c, roughness: 0.55 }));
  post.position.set(NX, C.net_posts / 2, z); post.castShadow = true; scene.add(post);
}

/* ---------- the ball ---------- */
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 14),
  new THREE.MeshStandardMaterial({ color: 0xe8e07a, roughness: 0.7, emissive: 0x3a3410 }));
ball.castShadow = true;
scene.add(ball);
const trailMat = new THREE.LineBasicMaterial({ color: 0xffe38c, transparent: true, opacity: 0.55 });
const trail = new THREE.Line(new THREE.BufferGeometry(), trailMat);
scene.add(trail);

/* ---------- the players ---------- */
const loader = new GLTFLoader();
const NEED = D.players.map(p => p.body).filter(Boolean);
const rigs = {};
const fail = msg => { const e = document.getElementById("err"); e.style.display = "grid";
  e.innerHTML = msg; document.getElementById("tl").style.display = "none"; };

/* The .glb carries three materials and no more — `skin`, `hair`, `kit` — in both bodies, which is exactly the shape
   `look` asks for. So the setup page's three swatches are a one-to-one map onto the file rather than a guess about
   which material is "the shirt". Materials are cloned per member: the loader shares one material across the
   primitives of a .glb, and a colour should be a property of the player rather than of the file on disk. */
function paint(root, L) {
  const want = { skin: L.skin, hair: L.hair, kit: L.kit };
  root.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const one = m => {
      const hex = want[m.name];
      if (!hex) return m;
      const c = m.clone();
      c.color = new THREE.Color(hex);
      return c;
    };
    o.material = Array.isArray(o.material) ? o.material.map(one) : one(o.material);
  });
}

async function loadBodies() {
  for (const name of NEED) {
    const gltf = await loader.loadAsync(`bodies/${name}.glb`);
    const root = gltf.scene;
    root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

    /* `look` is the only thing in Dmitri's setup file that the renderer owns, so this is the only place it is spent.
       Four of its fields are cheap and are applied here; two are not, and §5 of SETUP.md now says so.

       height_m — the body is scaled so the TOP OF THE HEAD lands on the number asked for. Measured, not assumed:
       the .glb's own height is read off the model first, because body.py may be built at any height and a season
       that asks for 1.72 must get 1.72 whether the file was built at 1.60 or 1.90. `height` in the rig below is
       measured AFTER scaling, so the stride rule (0.42 of height per step) follows the member, not the file.

       build — a multiplier on GIRTH, on X and Z and not on Y, so a heavier member is wider and not taller. The body
       is built facing +Z, so those are the two axes across it.

       skin / hair / kit — the three materials gwen.glb and dmitri.glb actually carry. One-to-one with the three
       colours the setup page offers, which is why the page can offer exactly those. Nothing is interpreted.

       Not applied, deliberately: `lower` (skirt/shorts/none) is garment GEOMETRY — the clothing is part of the
       `kit` primitive, so changing it means rebuilding the .glb in Blender, not tinting it here. And `hand` is not
       an appearance field at all: the record decides which side every ball is struck from, and a renderer that
       reversed it would draw the right picture of a different player. Both are answered in SETUP.md §6. */
    const mem = D.players.find(p => p.body === name) || {};
    const L = LOOK[mem.name] || {};
    paint(root, L);
    const natural = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3()).y;  // metres, scale 1
    const want = (L.height_m || natural) * 3.28084;                                      // feet, top of head
    const s = want / natural;                                                            // feet per metre
    const b = L.build || 1;
    // the .glb is already Y-up (the exporter converts), and it is in METRES while the court is in FEET.
    root.scale.set(s * b, s, s * b);
    scene.add(root);
    const bones = {};
    // glTF strips the dots out of node names, so Blender's "thigh.L" arrives as "thighL". Every lookup in this
    // file used the dotted name, found nothing, and did nothing: the legs were never posed and the arm solver
    // returned at its first line. That is why the racquet sat at the hip in every still — the page had been
    // reporting a solved pose it had never applied. Keyed by the name the file actually contains, with the
    // dotted name kept as an alias so neither spelling can break it again.
    root.traverse(o => {
      if (!o.isBone) return;
      // three.js's loader sanitises node names, so Blender's "thigh.L" arrives in the browser as "thighL". Both
      // spellings are keyed: the bare one because that is what the file contains, and the dotted one because
      // every posing rule in this file was written against the bone's name in Blender. The previous version keyed
      // o.name and o.name.replace(/\./g, "") — after sanitising those are the same string, so the dotted lookups
      // returned undefined and every rule that used them did nothing at all, silently. The legs have never moved.
      bones[o.name] = o;
      const bare = o.name.replace(/\./g, "");
      bones[bare] = o;
      const m = bare.match(/^(.*?)([LR])$/);
      if (m) bones[`${m[1]}.${m[2]}`] = o;
    });
    // the figure's own height, in feet, read off the model rather than assumed: the stride below is a
    // fraction of it, and a 6ft 2in member does not take the same steps as a 5ft 8in one
    const box = new THREE.Box3().setFromObject(root);
    // The racquet is NOT parented to the hand. A racquet is aimed at the ball, not welded to a fist: the page
    // places it every frame — butt in the palm, head on the ball, face square to the direction the ball leaves
    // in. Being its own object in the scene also spares it the 3.28084 that converts the metre-built body into
    // the feet the court is measured in; built in feet and left in the scene it is 27in long, as it should be.
    const rac = buildRacquet();
    scene.add(rac);
    // `look.racquet` is a boolean about the picture, not about the tennis: a member who does not want to see one is
    // shown without one, and the record's own racquet positions still cost nothing, because they are a placement.
    if (L.racquet === false) rac.visible = false;
    rigs[name] = { root, bones, height: box.max.y - box.min.y, racquet: rac, look: L };
    if (q.has("debug")) console.log("debug bones", name, Object.keys(bones).join(","), "height", rigs[name].height.toFixed(2),
      "| upperarmR is", bones["upperarmR"] && (bones["upperarmR"].type || "?"), "| handR is", bones["handR"] && (bones["handR"].type || "?"),
      "| handL is", bones["handL"] && (bones["handL"].type || "?"));
  }
}

/* ---------- posing: solve, do not key ----------
   CCD on the hitting arm. Each iteration rotates a bone so the hand points more nearly at the target; a few
   iterations and the racquet is at the ball. Clavicle and spine are left alone, so a ball the player cannot
   really reach produces a visible stretch rather than a corrected one. */
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpQ = new THREE.Quaternion();
const tmpQ2 = new THREE.Quaternion(), tmpP = new THREE.Vector3();

function rotateWorld(bone, qWorld) {
  // world' = q * world  =>  local' = parentInv * q * parent * local. The first version multiplied them
  // premultiply(inv).premultiply(q).premultiply(parent), which evaluates to parent*q*parentInv*local — the same
  // rotation about a conjugated axis, i.e. about the wrong axis. The arm solver then "converged" by pulling the
  // hand toward a point nobody had asked for, which is a large part of why every stroke looked like a statue
  // reaching for something. Verified numerically before changing it: the old order is off by 1.19 on a unit test.
  // ...and both quaternions are re-normalised, which is not housekeeping. getWorldQuaternion() decomposes the
  // parent's world matrix, and a matrix carrying any scale at all decomposes to a quaternion that is not unit
  // (the extraction assumes an orthonormal basis). Composing three non-unit quaternions leaves the bone's own
  // quaternion with a length above 1, and a bone's matrix is composed as position * quaternion * scale, so the
  // bone silently ACQUIRES a scale of |q|² — and the child inherits it on the next frame, and the child of that.
  // Measured on the playing film (?debug, 2026-11-11): forearmR reached a world scale of 3.947/3.429/3.984
  // against the body's 3.281 after eleven minutes, q length 1.064, and the hand — rigid-skinned to its bone —
  // stretched with it. That is the founder's "the racquet grows into a larger and larger cigar": it is the
  // forearm, the hand and the racquet at the end of them, drawn 20% long and 20% wide, non-uniformly, growing
  // with every frame of every rally. A paused still never shows it, because the drift is per frame and a still
  // has had two frames; only a film that has been playing for minutes has it.
  bone.parent.getWorldQuaternion(tmpQ2).normalize();
  const inv = tmpQ2.clone().invert();
  bone.quaternion.premultiply(tmpQ2).premultiply(qWorld).premultiply(inv).normalize();
  bone.updateMatrixWorld(true);
}

function solveArm(rig, target, side) {
  /* Two-bone IK with the elbow's position solved, not searched for.

     This replaces a CCD loop that rotated the forearm and the upper arm towards the target a few times. CCD finds
     the *direction* from a joint to a target, which is fine when the target is nearly out of reach and useless
     when it is close to the shoulder: the elbow has to fold hard, the direction barely changes, and the solve
     stops. Measured with ?debug on every shot in the demo: the hitting hand finished 0.86ft from its own target,
     the elbow ended up by the ear, and on a ball on the left side the left arm did not move at all — 4.03ft from
     a target a forearm away. That is the "statue reaching for something" reading, and no number of extra passes
     fixed it, which is what a local minimum looks like.

     Law of cosines instead: the elbow sits on a circle around the shoulder-to-target axis at the angle where the
     forearm is exactly long enough to reach the ball, and the circle is broken by a pole — the elbow points down
     and away from the body, which is where elbows point.

     a and b are read off the bones rather than assumed, so a taller member has a longer reach and a ball they
     cannot get to produces a straight arm short of the ball instead of a torn one. */
  const { bones } = rig;
  const S = side === "L" ? "L" : "R";
  const up = bones["upperarm" + S], fore = bones["forearm" + S], hand = bones["hand" + S];
  if (!up || !fore || !hand) return;
  const sr = up.getWorldPosition(new THREE.Vector3());
  const er = fore.getWorldPosition(new THREE.Vector3());
  const wr = hand.getWorldPosition(new THREE.Vector3());
  const a = sr.distanceTo(er), b = er.distanceTo(wr);

  if (a < 1e-4 || b < 1e-4) return;
  const n = target.clone().sub(sr);
  let d = n.length();
  if (d < 1e-4) return;
  n.normalize();
  const reach = (a + b) * 0.995;
  if (d > reach) d = reach;                      // out of range: a straight arm, still pointing at the ball
  if (d < Math.abs(a - b) + 1e-3) d = Math.abs(a - b) + 1e-3;
  // the elbow's circle: pole is down and slightly behind the player, so the elbow drops under the strike
  const back = new THREE.Vector3(side === "L" ? -1 : 1, 0, 0);   // rough: away from the body's centre line
  const pole = new THREE.Vector3(0, -1, 0).addScaledVector(back, 0.35);
  const perp = pole.clone().addScaledVector(n, -pole.dot(n));
  if (perp.lengthSq() < 1e-6) perp.set(0, 0, 1);
  perp.normalize();
  const cosA = (a * a + d * d - b * b) / (2 * a * d);
  const alpha = Math.acos(Math.max(-1, Math.min(1, cosA)));
  const elbow = sr.clone().addScaledVector(n, a * Math.cos(alpha)).addScaledVector(perp, a * Math.sin(alpha));
  aimBone(up, elbow.clone().sub(sr));
  const e2 = fore.getWorldPosition(new THREE.Vector3());
  aimBone(fore, target.clone().sub(e2));
}

/* Point a bone at something, without knowing how Blender rolled it.
   Every bone here runs along its own local +Y (checked against the .glb: every child offset is (0,1,0)), but the
   local X and Z axes are rolled differently bone by bone, so the same Euler angle means a different motion on the
   thigh and on the arm. Aiming sidesteps the question: the bone is rotated in world space until its own axis
   lies along the direction asked for, which is also how you would pose a lay figure. */
const _aim = new THREE.Vector3(), _aimQ = new THREE.Quaternion();
function aimBone(bone, dir) {
  if (!bone) return;
  bone.updateWorldMatrix(true, false);
  _aim.set(0, 1, 0).transformDirection(bone.matrixWorld);
  _aimQ.setFromUnitVectors(_aim, dir.clone().normalize());
  rotateWorld(bone, _aimQ);
}

/* ---------- walking, without a walk cycle ----------
   A gait is two numbers and a phase: the thigh swings, the knee folds on the way through, and the phase advances
   with the ground covered, not with the clock. That way the feet keep pace with the body however fast it is going
   — which is the whole difference between a figure that runs and a figure that is pushed along on castors.
   Nothing here is animation data; it is a rule about where the legs are given how far the player has travelled. */
function legs(rig, phase, moving, face, turn, load, idle, walk, ramp) {
  // `turn` is the twist about the body's own vertical, in radians: away from the net on the wind-up, through on
  // the follow-through. It reaches the legs because a stroke is not an arm — the pelvis turns, the knees load,
  // and only then does the racquet move. Until 2026-11-11 none of that was here: the bodies stood square and the
  // arm reached sideways at the ball, which is the difference between a stroke and a grab.
  const { bones } = rig;
  turn = turn || 0; load = load || 0;
  // A pose is a DELTA on the rest pose, not a replacement for it. bone.rotation.set(...) throws away the bone's
  // rest orientation, which in a glTF skeleton is carried by the node's own quaternion — do that to a thigh and
  // the leg swings up over the shoulder. The rest quaternion is captured once and composed with each swing.
  const dq = new THREE.Quaternion(), de = new THREE.Euler();
  const set = (n, x, y, z) => {
    const b = bones[n]; if (!b) return;
    const rest = b.userData.rest || (b.userData.rest = b.quaternion.clone());
    b.quaternion.copy(rest).multiply(dq.setFromEuler(de.set(x, y, z)));
  };
  // NOBODY STANDS STILL. Until 2026-11-12 a player who had stopped was a frozen version of the walk cycle: the
  // stride amplitude fell to 12% and the phase stopped advancing, because the phase is built from ground covered
  // and their ground had stopped. So the figure landed in the middle of a stride and stayed there — the founder,
  // 2026-11-12: "Do you intend for the players to freeze for an instant just before hitting the ball? In reality
  // there would be no such pauses; real players are in motion the entire point. Even when they are waiting to
  // receive and are already in position, they shift their weight as the ball approaches."
  //
  // He is right, and the freeze is an accident of that one line. So `still` fades the stride OUT — a player who
  // has stopped does not stay mid-step — and fades in a stance that moves: the weight rocks from one leg to the
  // other at about one cycle a second, the knees stay soft, and the pelvis rolls over the loaded leg. `idle` is
  // film time, not distance, which is the whole point: it advances whether or not the record moves them.
  // A STRIDE IS NOT SWITCHED ON, IT GROWS (item 2b's remainder, and item 4b's prerequisite). `still` used to be
  // 0 or 1, so the first frame of every run put the thighs straight out of the standing sway and into a swing —
  // measured, a toe rising 0.697ft in one frame. `ramp` is how far into the first fifth of a second of the move
  // this frame is, and the stride is multiplied by it, so the legs arrive at the gait instead of being teleported
  // into it. The idle sway fades out by the same number, because it is the same `still`.
  ramp = Math.max(0, Math.min(1, (ramp === undefined) ? 1 : ramp));
  const still = 1 - ramp;
  const idleS = Math.sin(idle || 0);
  const live = 0.12 + 0.88 * ramp;                      // standing still is a very small version of walking
  // The swing is set so the foot travels as far as the body does in one step (0.42 of its height), which is what
  // stops the feet skimming along the ground. A bigger swing looks more athletic and slides; the phase is already
  // driven by distance, so the stride is honest at any speed and the legs simply cycle faster when the player runs.
  const A = 0.45 * live * (1 + 0.45 * load), K = 0.85 * live * (1 + 0.30 * load);
  const swing = p => Math.max(0.05, Math.sin(p + 0.75));
  const stride = 1 - still;
  set("thigh.L", -A * Math.sin(phase) * stride - still * (0.05 + 0.05 * idleS), 0, -0.09);
  set("thigh.R", -A * Math.sin(phase + Math.PI) * stride - still * (0.05 - 0.05 * idleS), 0, 0.09);
  // THE BACK FOOT COMES UP ON THE TOE. A stroke finishes with the back heel off the ground, and until now nothing
  // in this file could make that true: the shin was driven by `load`, which is the same on both legs, so the legs
  // bent together and the back foot stayed flat. `plantHeel` is the hitter's own clock (0 at contact, 1 by 0.33s)
  // and `plantBack` says which leg is behind — a forehand is struck with the left foot forward and the right foot
  // back, a two-handed backhand the other way round, which is `sh.hand` read as a stance rather than an arm.
  const heel = rig.plantHeel || 0, bk = rig.plantBack || "";
  set("shin.L", K * swing(phase) * stride + still * (0.20 - 0.12 * idleS) + 0.10 * load + (bk === "L" ? 0.30 * heel : 0), 0, 0);
  set("shin.R", K * swing(phase + Math.PI) * stride + still * (0.20 + 0.12 * idleS) + 0.10 * load + (bk === "R" ? 0.30 * heel : 0), 0, 0);
  // The heel itself is the FOOT bone: rotating the shin swings the ankle sideways, which is why bending the back
  // knee alone moved the ankle 0.05ft and looked like nothing. The sign of a foot rotation is not in any comment
  // here, so it is a constant with a probe behind it (`?heel=`, `?toe`) rather than a guess buried in a line.
  set("foot.L", -0.25 * (1 - still) + (bk === "L" ? HEEL * 0.45 * heel : 0), 0, 0);
  set("foot.R", -0.25 * (1 - still) + (bk === "R" ? HEEL * 0.45 * heel : 0), 0, 0);
  set("spine", -0.05 - 0.09 * live - 0.10 * load - still * 0.02, turn * 0.35 + still * 0.03 * idleS, 0.06);
  set("hips", 0.04 * live + still * 0.02, turn * 0.30, still * 0.06 * idleS);
  chestTwist(rig, turn * 0.45);
  if (walk) stroll(rig, face, phase); else arms(rig, face, phase);
}

/* Carrying a racquet across the court is not standing at the baseline. The ready pose — both arms up, the frame
   in front of the shoulder — is a pose of somebody about to be hit at; it looks wrong in a walk, and it is what
   the film had, because between points there was nothing to pose for. The arms hang and swing opposite the legs,
   and the racquet is carried down by the thigh, head forward: the way people carry a racquet when they are going
   somewhere rather than playing. */
function stroll(rig, face, phase) {
  const right = new THREE.Vector3().crossVectors(face, _up).normalize();
  const dir = (f, r, u) => new THREE.Vector3().addScaledVector(face, f)
    .addScaledVector(right, r).addScaledVector(_up, u).normalize();
  const sw = Math.sin(phase) * 0.42;                      // the arms swing with the gait, arms against legs
  aimBone(rig.bones["upperarm.R"], dir(-0.16 * sw, 0.26, -0.95));
  aimBone(rig.bones["forearm.R"], dir(0.30 + 0.10 * sw, 0.12, -0.94));
  aimBone(rig.bones["upperarm.L"], dir(0.16 * sw, 0.30, -0.95));
  aimBone(rig.bones["forearm.L"], dir(0.26 - 0.10 * sw, 0.14, -0.95));
}

/* A player waiting for a ball does not stand with both arms hanging: the free arm is across the body, the racquet
   arm has the frame up in front of the shoulder. Both are aimed rather than rotated, so the pose survives any
   future change of bone roll. */
const _upQ = new THREE.Quaternion();
function chestTwist(rig, ang) {
  const b = rig.bones["chest"]; if (!b) return;
  const rest = b.userData.rest || (b.userData.rest = b.quaternion.clone());
  b.quaternion.copy(rest).multiply(_upQ.setFromAxisAngle(new THREE.Vector3(0, 1, 0), ang));
}
function arms(rig, face, phase) {
  const right = new THREE.Vector3().crossVectors(face, _up).normalize();
  const dir = (f, r, u) => new THREE.Vector3().addScaledVector(face, f)
    .addScaledVector(right, r).addScaledVector(_up, u).normalize();
  // racquet arm: elbow low and near the ribs, forearm forward and a little up, so the frame sits at head
  // height in front of the shoulder rather than straight above it
  aimBone(rig.bones["upperarm.R"], dir(0.20, 0.30, -0.93));
  aimBone(rig.bones["forearm.R"], dir(0.72, 0.12, 0.28));
  // free arm: down and across, hand toward the racquet's throat, elbow bent
  aimBone(rig.bones["upperarm.L"], dir(0.15, 0.35, -0.92));
  aimBone(rig.bones["forearm.L"], dir(0.55, 0.30, -0.25));
}

function ready(rig, north) {
  // where the racquet waits between shots: in front of the right shoulder, on the hitting side
  const { bones } = rig;
  const p = new THREE.Vector3();
  (bones["chest"] || bones["upperarmR"]).getWorldPosition(p);
  p.y += 1.35;
  p.x += north ? 0.55 : -0.55;
  return p;
}

/* ---------- the racquet, which the page holds ----------
   A tennis racquet is 27in long: a grip of 7, a throat of 8, a head of 12, the head 9.5in wide. The one in the
   .glb was a torus on a stick, 20% too long, and being welded to the hand it could only ever point where the
   hand pointed. So the body is exported without it and the racquet is built here, as a child of the hand bone:
   real proportions, a strung bed, and an aim — the face turns to the direction the engine says the ball left in.
   Equipment belongs to the shot, not to the body. */
function stringTexture() {
  const px = 8, n = 14;
  const cv = document.createElement("canvas");
  cv.width = cv.height = n * px;
  const g = cv.getContext("2d");
  g.fillStyle = "rgba(0,0,0,0)"; g.fillRect(0, 0, cv.width, cv.height);
  g.strokeStyle = "rgba(238,238,232,.85)"; g.lineWidth = 1.1;
  for (let i = 0; i <= n; i++) {
    g.beginPath(); g.moveTo(i * px, 0); g.lineTo(i * px, cv.height); g.stroke();
    g.beginPath(); g.moveTo(0, i * px); g.lineTo(cv.width, i * px); g.stroke();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3.4);
  return t;
}

function buildRacquet() {
  const g = new THREE.Group();
  const gripMat = new THREE.MeshStandardMaterial({ color: 0x1d2126, roughness: 0.85 });
  const frameMat = new THREE.MeshStandardMaterial({ color: 0xd9d3c4, roughness: 0.32, metalness: 0.30 });
  const strMat = new THREE.MeshStandardMaterial({ map: stringTexture(), transparent: true, alphaTest: 0.05,
                                                  side: THREE.DoubleSide, roughness: 0.9 });

  const strut = (a, b, r, mat) => {
    const d = new THREE.Vector3().subVectors(b, a);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), mat);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
    m.castShadow = true;
    g.add(m);
    return m;
  };
  const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);

  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.070, 0.064, 0.58, 12), gripMat);
  grip.position.y = 0.29; grip.castShadow = true; g.add(grip);
  g.add(new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.012, 6, 16).rotateX(Math.PI / 2)
                        .translate(0, 0.575, 0), gripMat));           // the collar at the top of the grip

  strut(V(0, 0.58), V(0.255, 1.31), 0.026, frameMat);
  strut(V(0, 0.58), V(-0.255, 1.31), 0.026, frameMat);

      // than walked — measured, a 0.99ft step at every one of the film's sixteen ordinary breaks.

      // serve's stance starts before the contact — 0.6s before it when this was written, 1.44s from the record of
      // 2026-11-26, because a server walks to the line and THEN throws the ball up rather than tossing it on the
      // way. Reading `t0` off the next shot's own stance means the break is as long as the walk into it and not a
      // guess that goes stale the next time the record's timing changes. `0.75` stays as the floor, so a film
      // recorded before this keeps the break it was recorded with.

      // `records/item31-after` the record's own settle walk and stance lead put Colette at [82,13.5] on the south
      // side before the swap, and the swap's hard-coded [76,13.5] then pulled her 6ft back for 0.18s and the next

function whereAt(name, T) {

  // A change of ends is a move in the plan (item 32, 2026-11-26) — the plan block above inserts it, chains the
  // moves after it and cuts it only when the plan has not already carried the journey. What is left here is the
  // INSTANT, which is all `whereAt` needs: the body is arriving at the other end for 0.06s and its yaw is reset
  // rather than turned through the whole 180 degrees. (It used to skip every move that finished before the swap,
  // which is what undid the first serve's own stance lead and cost 6ft.)

  let pos = start, moving = false, travelled = 0, dir = null, mStart = 0, mLen = 0, local = 0;
  let lastDir = null;      // the direction of the last move, which survives the move ending (see the phase below)
  // The swap is a move in the plan now, so all this does is say when the body is arriving at the other end and its
  // yaw should be reset rather than turned through the whole 180 degrees (see the change-of-ends note below).
  const swapped = !!(sw && (T - sw.t) < 0.06);

    const from = m.from;
    const d = Math.hypot(m.to[0] - from[0], m.to[1] - from[1]);
    if (T >= m.t1) {

      // off. Measured 2026-11-25: at the end of a run both toes dropped 0.5ft in one frame, which is a body
      // arriving at a dead stop rather than at the ball.
      mStart = m.t0; mLen = m.t1 - m.t0; local = d;
      if (d > 0.5) lastDir = [(m.to[0] - from[0]) / d, (m.to[1] - from[1]) / d];
    }
    else if (T > m.t0) {

      // next, and a linear interpolation does exactly that at the start of every move: measured at a strike, the
      // recovery began at 11.1ft/s while the frame before it showed 0.6. Easing in and out keeps the endpoints —
      // the walk still arrives where the record says, when it says — and gives every move a beginning and an end
      // instead of a switch.
      const u = (T - m.t0) / Math.max(0.05, m.t1 - m.t0);
      const k = u * u * (3 - 2 * u);

      // straight back from the middle of their own baseline turns and runs, they do not reverse into the court
      if (d > 0.5) { dir = [(m.to[0] - from[0]) / d, (m.to[1] - from[1]) / d]; lastDir = dir; }
      // WHEN this move began, because a stride has to ease in from the standing pose it replaced and the phase
      // offset that puts the near foot first is only safe while the stride is still growing.
      mStart = m.t0; mLen = m.t1 - m.t0; local = d * k;

    } else break;

  // jumping to a shot both put the legs where they belong. A phase counted frame by frame would only be right
  // in continuous play, which is the one case a still cannot show.
  return { pos, moving, travelled, dir, swapped, mStart, mLen, local, lastDir };

  // beat the player standing there. The founder, 2026-11-11: "you need to show a couple of yards of court behind
  // the closer court so that long balls, or missed shots to the closest player, have a place to bounce."

  // baseline at ground level, the top edge through a point 6ft above the far baseline — a tall player's head, and

  return { eye: new THREE.Vector3(w.at[0] + 5.0 * face, 6.2, w.at[1] + 21.0 * side),

// ITEM 12 (2026-11-27): HOW FAR A RUNNING PLAYER'S RACQUET ARM SWINGS. A player running to a ball does not hold the

// back to the hitting side" means. The arm pumps with the gait, so the frame crosses the body's own centre line once
// per stride pair. Measured on `records/item31-after` during the carry phase (the part of a run before the take-back
// starts), the frame crossed 0.32-0.38 times per 10ft of running; a stride pair is `0.84 * height` = 4.7ft, so that
// is 0.16 per stride pair where the picture wants one.
// HOW FAR A STRIKE MAY CARRY THE BODY TOWARD THE BALL. This was 1.30ft and it is the cap that decides whether the
// frame can be on the ball at all: the record places every contact `RACQUET_REACH` = 7.0ft from the feet (measured
// 2026-11-27 over 228 rally pairs in three films: median 7.00ft, worst 7.01), while the rig reaches 3.92ft and this
// lean. A cap of 1.30 therefore left 1.8ft of a contact that no arm could close, and on the film the racquet head

// 0.02s frame (68ft/s) and 12 frames over 25ft/s — item 2b's defect rebuilt. A quarter second is one step.
// `?step=0` draws the build with no stride toward the ball at all, which is what every film in `records/` was drawn
// with before item 16's remainder: it is the before/after on ONE film, and the only honest way to price the step.
const STEP = q.get("step") !== "0";

// the toss and was 0.51/0.61ft off the court with the ball still in her tossing hand. 0.30s is not a taste: the arm

const CARRY_READY = 0.55;   // how far toward the take-back a RUNNING player carries the frame, all run long

   that lifts a heel is the ANKLE rising, and the ankle is set by the root and the knee. Which means the constant

let HEEL = 0;
if (q.has("heel")) HEEL = parseFloat(q.get("heel")) || 0;

/* Where the ground is touched: 0.45ft along the foot bone from the ankle, in world feet. A still can show a foot

const CROSS_OUT = 0.20;     // the same shape as the stride's own ramp, so neither end of a recovery step is a switch

/* Grounding: the body is placed so its lower toe is on the court. `?ground=0` turns it off, so the before-and-after

const GROUND_MAX = 0.75;

function shotAt(t) {

  // whose [start, start+dur+hold) contained t, and those windows OVERLAP: a serve's segment starts a toss (0.84s)
  // before its contact, and the break of the point before it runs past that instant, so the break won and the
  // toss was never drawn. Measured on the clock's own film (`seasons/2026-11-19`, 66 shots, 26 serves): the ball
  // appeared at the contact on **16 of 26 serves** — half the serves in the film arrived from nowhere, and the
  // body was still finishing the previous point's watch at the frame it struck, which is the 26deg facing error
  // item 6 had been chasing. A film is a timeline, so the later start wins; the hold is the earlier segment's
  // room to breathe, not a claim on the other one's frames.
  let found = SEG[0];

/* ---------- per-frame ---------- */
const el = id => document.getElementById(id);
const ballPos = new THREE.Vector3();
const firstFrameFor = {};

const PAUSE = 0.4;            // seconds the picture holds on the point board. He asked for minimal on 2026-11-11:
                              // "I'll let you know if I think you should increase it". The board exists to say who
                              // won; it does not need to be read twice.
let pauseUntil = 0;           // wall clock, ms

function tick(now) {
  const dt = Math.min(0.05, (now - T0) / 1000); T0 = now;
  let seg = shotAt(T);
  if (playing) {
    // The point is over, so the picture stops: the clock is held, not merely slowed, and the match says who won
    // it. A pause of wall-clock rather than a longer shot means scrubbing the record still shows every frame of
    // play, and playing it back still gives the same pause in the same place.
    const endT = seg.start + seg.dur;
    if (seg.point && !seg.announced && T >= endT) {
      T = endT; seg.announced = true; pauseUntil = now + PAUSE * 1000;
    } else if (pauseUntil && now < pauseUntil) {

    }

    for (const s2 of SEG) s2.announced = false;
  }
  seg = shotAt(T);
  // Two clocks. `tl` stops at the end of the shot, because the hold is a beat in the RECORD's timing, not an
  // instruction to keep drifting: the poses are all written against a time-to-contact that has already happened,
  // so past the end of the shot they were still evaluating — and reachTo's lean, which fades 0.5s either side of
  // a strike, faded OUT across the hold and then snapped back in at the next strike. Measured across a boundary:
  // the racquet head moved at 103ft/s in a single frame. `tlRaw` is for the things that happen IN the hold.

  const tl = Math.min(tlRaw, seg.dur);

  // the hold is over, because the hold carries the next shot's own lead into its stance, and `shotAt` returns the
  // segment that started latest: measured, a change of ends held to rel 29.65 while the serve that followed
  // claimed the clock from rel 28.815. Everything the break wants to finish has to finish by then, or it is not
  // drawn — which is how a carry that faded out over 0.35s after the walk ended still went to its cut at full

  // then jumping a foot or two — and, worse for the promise this film is judged on, a gap measured anywhere in the
  // first 0.02s after a contact read half a hop rather than the frame's own error. Measured 2026-11-27 on
  // `records/item31-after`, shot 44: the racquet head is 0.24ft from the ball at the contact frame and read 2.58ft
  // one hundredth of a second later, at which point the ball had not travelled 2.34ft — the reading had.
  const bp = seg.bpath || sh.path;

    // center of the baseline. From any other stroke, the player will turn their body in the direction that they

    // run began and BOTH toes dropping 0.5ft in one frame as it ended (Dmitri at T=65.16: x stops advancing and

    // cycle of offset. Measured 2026-11-25, same film and same metric, offset applied on top of the cumulative
    // phase: 7 of 11 runs put the near foot first with +quarter, 7 of 11 with none, 4 of 11 with -quarter, i.e.
    // the offset was noise. Counting from the move's own start makes the first frame of every run phase = +-quarter

    const phase = 2 * Math.PI * ((local || 0) / cycle) + near * NEAR_LEAD * grow;
    if (q.has("probe") && Math.abs(T - parseFloat(q.get("probe"))) < 0.12 && pl.name === q.get("who"))

        "local", (local || 0).toFixed(2), "grow", grow.toFixed(3), "phase", phase.toFixed(2), "near", near);
    if (q.has("debug")) console.log("debug yaw", pl.name, "moving", moving,
      "dir", dir ? dir.map(v => v.toFixed(2)).join(",") : "-", "yaw", (rig.root.rotation.y).toFixed(2),
      "net", (at ? Math.PI / 2 : -Math.PI / 2).toFixed(2), "tlc", tlc.toFixed(2), "hitter", sh.player === pl.name ? 1 : 0);

    // because it knows the flight time.
    const isHitter = sh.player === pl.name;
    // A receiver is not the only player who has to prepare. The take-back was tied to `run`, so a ball that came
    // straight at somebody — no run needed — produced NO wind-up at all: the frame sat in the ready position until
    // the next segment began and then appeared on the ball in one frame. Measured at the boundary before that shot:
    // the racquet head moved at 103.5ft/s for a single frame while the body was at 0.6ft/s, which is the hiccup the
    // founder described as "a pause that doesn't occur in real life". `isReceiver` now means only "this player is
    // the one the ball is going to", which is who the record's next shot belongs to.
    const isReceiver = !!(AFTER[sh.n] && AFTER[sh.n].rally === sh.rally && AFTER[sh.n].player === pl.name
                          && AFTER[sh.n].player !== sh.player);
    const isRunner = !!(sh.run && sh.run.player === pl.name);
    // A backhand is the same stroke played from the other side of the body, so the shoulders turn the other
    // way and the other arm leads. The record now says which it is (sh.hand), because the engine has always
    // known which side of the court the contact was on and never wrote it down.
    const nxt = NEXT[sh.n];
    const recv = isReceiver ? (AFTER[sh.n] || null) : null;   // the ball this player is waiting to receive
    const rush = recv ? (recv.rush || 0) : 0;                 // how late their racquet is for it
    const back = (isHitter ? sh.hand === "back" : (recv ? recv.hand === "back" : false));
    // Which foot is behind, and how far up on the toe it is. Stateless, like the root rise: a function of `tl`.
    rig.plantBack = isHitter ? (back ? "L" : "R") : null;
    rig.plantHeel = isHitter ? Math.max(0, Math.min(1, (tlc - 0.05) / 0.28)) : 0;
    const sgn = back ? -1 : 1;
    const follow = isHitter ? Math.max(0, Math.min(1, 1 - tlc / 0.38)) : 0;
    // The racquet comes back on the way to the ball, not on arrival: a player who has the habit has it back for the
    // whole run, and one who does not starts it late and gets it back over a shorter and shorter window. The
    // founder's point of 2026-11-11, and the reason a beginner's mishits are mishits rather than bad aims.
    const w = Math.max(0.18, 0.55 - 0.30 * rush);
    const ramp = isReceiver ? Math.max(0, Math.min(1, (tl - (seg.dur - w)) / w)) : 0;
    // ...and it takes a quarter of a second to get there. `1 - rush` is how much of a take-back this player has,
    // and it was applied at full value on the segment's FIRST frame, so the arm and the frame went from the ready
    // position to the wind-up between one frame and the next: measured, the racquet head at 102ft/s for a single
    // frame. A player who is going to strike reaches back over about a quarter second, which is what `tl / 0.28`
    // is, and a rushed player still gets less of it because `1 - rush` is still the ceiling.
    const _wu = Math.max(0, Math.min(1, tl / 0.28));
    const windup = isReceiver ? Math.min(1 - rush, Math.max(ramp, _wu * _wu * (3 - 2 * _wu))) : 0;
    // The shoulders turn something like the direction the ball is being hit in, and the two halves of the founder's
    // note of 2026-11-11 live here and three lines down: the coil turns away from the ball on the take-back, the
    // release turns *through towards the target*, and on a backhand that is the whole look of the stroke — the
    // right shoulder comes round towards where the ball is going.
    let aimDelta = 0;
    if (isHitter && sh.target) {
      const yawTo = Math.atan2(sh.target[0] - sh.contact[0], sh.target[1] - sh.contact[1]);
      aimDelta = ((yawTo - netYaw + Math.PI * 3) % (Math.PI * 2)) - Math.PI;   // signed: + is to their right
    }
    const turn = Math.max(-1.25, Math.min(1.25,
      sgn * (-1.05 * windup + 0.62 * follow) + aimDelta * 0.9 * follow));
    // A SERVE IS THROWN UP OFF A BENT KNEE (Item 19). The legs load while the ball is in the air and drive as the
    // racquet goes up. `load` is the groundstroke's wind-up; the toss is the serve's own version of the same thing,
    // and it is the only thing in this file that bends a knee — a root dip on its own would be a body sinking
    // through its own legs, which is worse than not crouching at all. `tlc` is negative through the toss.

    // shuffle, which is what a body on castors would do.
