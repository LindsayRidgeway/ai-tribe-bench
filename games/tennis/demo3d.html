/* Where the record comes from. Dmitri's setup contract (`games/tennis/SETUP.md` §4) has three ways of getting a
   season's play onto this screen, and the one that costs nobody anything is this one: the page FETCHES the record,
   so a season folder holds a JSON file and every season links to the same viewer. The baked copy stays as the
   fallback, which is what the three demo films are and what a page opened from disk still shows.

   `?record=../seasons/2026-spring/rally.json` — relative to this page, so the season folder is the unit that gets
   moved or linked to, not the player. */
const QS = new URLSearchParams(location.search);
const REC = QS.get("record");
const D = REC ? await (await fetch(REC)).json()
              : JSON.parse(document.getElementById("script").textContent);

/* Where the appearance comes from — the other half of the same contract. `SETUP.md` §2 has the Play page write
   `players.json` and §3 has the runner copy the resolved file into the season as `setup.json`, so the season folder
   is the unit: a record at `seasons/<season>/rally.json` is assumed to have its provenance copy beside it, and the
   copy is what this page reads, not the live file — a season's picture has to be the season that was played.
   `?setup=<url>` overrides, and a missing file is not an error: the three demo films have none and nothing else
   changes, because every field here has a sensible absence. */
const SETUP = QS.get("setup") || (REC ? REC.replace(/[^/]*$/, "") + "setup.json" : null);
const LOOK = {};
if (SETUP) {
  try {
    const S = await (await fetch(SETUP)).json();
    for (const p of S.players || []) LOOK[p.name] = p.look || {};

const s = 70;
sun.shadow.camera.left = -s; sun.shadow.camera.right = s;
sun.shadow.camera.top = s; sun.shadow.camera.bottom = -s;

/* ---------- the court, drawn as a texture ----------
   Lines on a clay court are a texture problem, not a geometry problem. Drawing them into a canvas and
   mapping it onto one plane keeps the line where the rule says it is, at any camera angle, without a
   single quad of z-fighting. */
// The founder's reference photograph, 2026-11-12: a green court with a brick-red run-off, and the two are
// clearly two different materials rather than two shades of one. So a surface is now a pair of colours — what is
// inside the lines, and what is outside them — and the outside is the darker, duller one. Clay keeps its orange,
// because clay is orange; the green one is the picture.
const SURFACE = {
  clay:  { court: [0xb4, 0x55, 0x3a], out: [0x8a, 0x3f, 0x2a] },
  hard:  { court: [0x3e, 0x7a, 0x4e], out: [0x8e, 0x3a, 0x2c] },
  grass: { court: [0x53, 0x6f, 0x42], out: [0x3a, 0x4c, 0x30] },
};
const PAL = SURFACE[D.surface] || SURFACE.clay;
const CLAY = PAL.court;

function courtTexture() {
  const px = 26;                                   // pixels per foot
  const pad = 22;
  const cv = document.createElement("canvas");
  cv.width = (LEN + pad * 2) * px; cv.height = (WID + ALLEY * 2 + pad * 2) * px;
  const g = cv.getContext("2d");
  // Two shades of the one clay, and the lighter one is exactly the doubles rectangle: the boundary is the white
  // lines, not a shape of its own. The founder, 2026-11-12: "Real courts don't have such a two-color floor, and if
  // they did, the distinguishing color would all be inside the white lines." It was 0.62 of the clay, which read
  // as a different material — a platform the court was sitting on — and it ran 4.5ft past each baseline, where
  // there is no line to end it: "The spill wasn't on the sides, it was behind the baselines at both ends of the
  // court." Both are fixed here: 0.82 of the clay, and the light rectangle is the doubles court exactly, from
  // baseline to baseline and doubles sideline to doubles sideline, so every edge of it is a line.
  const dark = `rgb(${PAL.out.join(",")})`;
  g.fillStyle = dark; g.fillRect(0, 0, cv.width, cv.height);
  g.translate(pad * px, (pad + ALLEY) * px);
  // the playing surface is the doubles width; the singles court is a set of lines on it, not a different colour
  g.fillStyle = `rgb(${CLAY.join(",")})`;
  g.fillRect(0, -ALLEY * px, LEN * px, (WID + ALLEY * 2) * px);
  g.strokeStyle = "rgba(248,246,238,.95)"; g.lineWidth = 0.30 * px; g.lineCap = "butt";
  const line = (x0, y0, x1, y1) => { g.beginPath(); g.moveTo(x0 * px, y0 * px); g.lineTo(x1 * px, y1 * px); g.stroke(); };
  const top = -ALLEY, bot = WID + ALLEY;
  // Baselines and sidelines run the full doubles width; the SERVICE lines do not. They stop at the singles
  // sidelines, because the doubles alley has no service line in it — four segments that were being drawn across
  // the alleys and are now not. The founder, 2026-11-12: "White lines (you have four extra line segments)."
  line(0, top, LEN, top); line(0, bot, LEN, bot);                       // the doubles sidelines
  line(0, top, 0, bot); line(LEN, top, LEN, bot);                        // the baselines
  line(0, 0, LEN, 0); line(0, WID, LEN, WID);                           // the singles sidelines
  line(NX - C.service_line, 0, NX - C.service_line, WID);                // service lines: singles width only
  line(NX + C.service_line, 0, NX + C.service_line, WID);
  line(NX - C.service_line, WID / 2, NX + C.service_line, WID / 2);      // the centre service line
  line(0, WID / 2, 0.9, WID / 2); line(LEN - 0.9, WID / 2, LEN, WID / 2);  // the two centre marks
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

const courtW = LEN + 44, courtD = WID + ALLEY * 2 + 44;
const court = new THREE.Mesh(
  new THREE.PlaneGeometry(courtW, courtD),
  new THREE.MeshStandardMaterial({ map: courtTexture(), roughness: 0.95, metalness: 0 })
);
court.rotation.x = -Math.PI / 2;
court.position.set(LEN / 2, 0, WID / 2);
court.receiveShadow = true;
scene.add(court);

// a dark apron so the court does not float in a void
const apron = new THREE.Mesh(new THREE.CircleGeometry(150, 48),
  new THREE.MeshStandardMaterial({ color: 0x14181c, roughness: 1 }));
apron.rotation.x = -Math.PI / 2; apron.position.y = -0.02; apron.receiveShadow = true;
scene.add(apron);

/* ---------- the net ---------- */
function netTexture() {
  const cv = document.createElement("canvas");
  cv.width = 512; cv.height = 64;
  const g = cv.getContext("2d");
  g.clearRect(0, 0, 512, 64);
  // dark cord rather than pale: a net is the darkest thing on a court, and drawn in near-white at low alpha it
  // disappeared against the clay. The two inches of white canvas along the top are part of the net, and the
  // reference photograph shows them, so they are drawn rather than left out.
  g.strokeStyle = "rgba(28,26,24,.78)"; g.lineWidth = 1.6;
  for (let x = 0; x <= 512; x += 8) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 64); g.stroke(); }
  for (let y = 0; y <= 64; y += 8) { g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke(); }
  // The white canvas along the top is NOT drawn here. It was, as four pixels of the texture, and at the distance the
  // broadcast camera sits those four pixels mip away into the net's own grey haze: measured on the film, the top of
  // the net had no edge at all. A band that has to be crisp at 78ft is geometry, so it is a ribbon below, cut out of
  // the mesh rather than laid over it.
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = THREE.RepeatWrapping; t.repeat.set(6, 1);
  return t;
}
// ---------- the net, as a real one hangs ----------
// The posts stand 3ft OUTSIDE the doubles court, which is the rule and is what the reference photograph shows: the
// net is wider than the court it divides. They were on the doubles sidelines, and a net hung between the sidelines
// leaves the alleys open. The founder, 2026-11-12: "Net pole positions".
const POST_OUT = 3.0;                                     // feet outside the doubles sideline, per the ITF rule
const NET_HALF = (WID + ALLEY * 2) / 2 + POST_OUT;        // half the span between the posts
// The posts hold the net at 3.5ft and the net hangs from its own headband; what sags is the net, because the centre
// strap pulls the middle down to exactly 3.0ft. So the top of the mesh runs from 3.5ft at each post to 3.0ft in the
// middle, and the white canvas along that edge dips with it. The founder named the effect: "Slight angle in net
// where it's pulled down by strap".
const netTopAt = u => C.net_posts - (C.net_posts - C.net_centre) * (1 - (2 * u - 1) ** 2);
const BAND = 0.22;                                         // the headband: a little under three inches of white canvas
{
  const NXSEG = 48, rows = 10, pos = [], idx = [];
  for (let i = 0; i <= NXSEG; i++) {
    const u = i / NXSEG, x = -NET_HALF + 2 * NET_HALF * u, top = netTopAt(u) - BAND;
    // the span is along X here and the mesh is turned a quarter turn below, the same way the flat plane it
    // replaced was: built across Z it ends up along the court's LENGTH, which is a net down the middle of the
    // service boxes.
    for (let j = 0; j <= rows; j++) pos.push(x, top * (j / rows), 0);
  }
  for (let i = 0; i < NXSEG; i++) for (let j = 0; j < rows; j++) {
    const a = i * (rows + 1) + j, b = a + rows + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  const uv = [];
  for (let i = 0; i <= NXSEG; i++) for (let j = 0; j <= rows; j++) uv.push(i / NXSEG * 6, j / rows);
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  // depthWrite false, and it is not housekeeping: at the camera's distance the mipmap averages a net full of holes
  // into a thin veil, every fragment of which wrote depth — so the veil hid the centre strap standing behind it, and
  // that is why the strap could not be seen at all after it was added.
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: netTexture(), transparent: true,
    alphaTest: 0.05, depthWrite: false, side: THREE.DoubleSide, roughness: 0.9 }));
  mesh.position.set(NX, 0, WID / 2);
  mesh.rotation.y = Math.PI / 2;
  scene.add(mesh);

  // the headband: two inches of white canvas along the top edge, and it takes the net's own sag because it is built
  // on netTopAt, the same curve the mesh's top row uses — the mesh stops BAND below the top and this is what fills
  // the gap, so the two never overlap and there is nothing laid on top of anything.
  const bpos = [], bidx = [];
  for (let i = 0; i <= NXSEG; i++) {
    const u = i / NXSEG, x = -NET_HALF + 2 * NET_HALF * u, top = netTopAt(u);
    bpos.push(x, top, 0, x, top - BAND, 0);
  }
  for (let i = 0; i < NXSEG; i++) {
    const a = i * 2, b = a + 2;
    bidx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const bgeo = new THREE.BufferGeometry();
  bgeo.setAttribute("position", new THREE.Float32BufferAttribute(bpos, 3));
  bgeo.setIndex(bidx);
  const band = new THREE.Mesh(bgeo, new THREE.MeshStandardMaterial({ color: 0xf4f1e6, roughness: 0.8,
    side: THREE.DoubleSide }));
  band.position.set(NX, 0, WID / 2);
  band.rotation.y = Math.PI / 2;
  scene.add(band);
}
/* The centre strap, and the headband it holds down. There is no cord above the net: the white canvas is sewn along
   the net's own top edge and dips with it, and the strap is what makes it dip. The first version drew a straight
   white bar at 3.5ft all the way across, which is a white line floating a foot above the middle of the net — the
   founder, 2026-11-12: "There is no white line above the net in real life." The white band is now the top 0.22ft of
   the mesh itself (drawn in its texture, so it follows netTopAt and cannot float), and all that hangs above the
   ground at the centre is the strap. */
{
  // the strap: from the ground to the headband, 2 inches wide, and it is the thing that puts the sag in the net.
  // It sits a hair in front of the net's plane so it is drawn rather than z-fighting with the mesh.
  const strap = new THREE.Mesh(new THREE.BoxGeometry(0.035, netTopAt(0.5) + 0.06, 0.17),
    new THREE.MeshStandardMaterial({ color: 0xf2efe4, roughness: 0.85 }));
  strap.position.set(NX + 0.05, (netTopAt(0.5) + 0.06) / 2, WID / 2);
  strap.castShadow = true;
  scene.add(strap);
}
for (const z of [-ALLEY - POST_OUT, WID + ALLEY + POST_OUT]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, C.net_posts, 12),
    new THREE.MeshStandardMaterial({ color: 0x2a2a2c, roughness: 0.55 }));
  post.position.set(NX, C.net_posts / 2, z); post.castShadow = true; scene.add(post);
}

/* ---------- the ball ---------- */
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 14),
  new THREE.MeshStandardMaterial({ color: 0xe8e07a, roughness: 0.7, emissive: 0x3a3410 }));
ball.castShadow = true;
scene.add(ball);
const trailMat = new THREE.LineBasicMaterial({ color: 0xffe38c, transparent: true, opacity: 0.55 });
const trail = new THREE.Line(new THREE.BufferGeometry(), trailMat);

/* ---------- the players ---------- */
const loader = new GLTFLoader();
const NEED = D.players.map(p => p.body).filter(Boolean);
const rigs = {};
const fail = msg => { const e = document.getElementById("err"); e.style.display = "grid";
  e.innerHTML = msg; document.getElementById("tl").style.display = "none"; };

/* The .glb carries three materials and no more — `skin`, `hair`, `kit` — in both bodies, which is exactly the shape
   `look` asks for. So the setup page's three swatches are a one-to-one map onto the file rather than a guess about
   which material is "the shirt". Materials are cloned per member: the loader shares one material across the
   primitives of a .glb, and a colour should be a property of the player rather than of the file on disk. */
function paint(root, L) {
  const want = { skin: L.skin, hair: L.hair, kit: L.kit };
  root.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const one = m => {
      const hex = want[m.name];
      if (!hex) return m;
      const c = m.clone();
      c.color = new THREE.Color(hex);
      return c;
    };
    o.material = Array.isArray(o.material) ? o.material.map(one) : one(o.material);
  });
}

async function loadBodies() {
  for (const name of NEED) {
    const gltf = await loader.loadAsync(`bodies/${name}.glb`);
    const root = gltf.scene;
    root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

    /* `look` is the only thing in Dmitri's setup file that the renderer owns, so this is the only place it is spent.
       Four of its fields are cheap and are applied here; two are not, and §5 of SETUP.md now says so.

       height_m — the body is scaled so the TOP OF THE HEAD lands on the number asked for. Measured, not assumed:
       the .glb's own height is read off the model first, because body.py may be built at any height and a season
       that asks for 1.72 must get 1.72 whether the file was built at 1.60 or 1.90. `height` in the rig below is
       measured AFTER scaling, so the stride rule (0.42 of height per step) follows the member, not the file.

       build — a multiplier on GIRTH, on X and Z and not on Y, so a heavier member is wider and not taller. The body
       is built facing +Z, so those are the two axes across it.

       skin / hair / kit — the three materials gwen.glb and dmitri.glb actually carry. One-to-one with the three
       colours the setup page offers, which is why the page can offer exactly those. Nothing is interpreted.

       Not applied, deliberately: `lower` (skirt/shorts/none) is garment GEOMETRY — the clothing is part of the
       `kit` primitive, so changing it means rebuilding the .glb in Blender, not tinting it here. And `hand` is not
       an appearance field at all: the record decides which side every ball is struck from, and a renderer that
       reversed it would draw the right picture of a different player. Both are answered in SETUP.md §6. */
    const mem = D.players.find(p => p.body === name) || {};
    const L = LOOK[mem.name] || {};
    paint(root, L);
    const natural = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3()).y;  // metres, scale 1
    const want = (L.height_m || natural) * 3.28084;                                      // feet, top of head
    const s = want / natural;                                                            // feet per metre
    const b = L.build || 1;
    // the .glb is already Y-up (the exporter converts), and it is in METRES while the court is in FEET.
    root.scale.set(s * b, s, s * b);
    scene.add(root);
    const bones = {};
    // glTF strips the dots out of node names, so Blender's "thigh.L" arrives as "thighL". Every lookup in this
    // file used the dotted name, found nothing, and did nothing: the legs were never posed and the arm solver
    // returned at its first line. That is why the racquet sat at the hip in every still — the page had been
    // reporting a solved pose it had never applied. Keyed by the name the file actually contains, with the
    // dotted name kept as an alias so neither spelling can break it again.
    root.traverse(o => {
      if (!o.isBone) return;
      // three.js's loader sanitises node names, so Blender's "thigh.L" arrives in the browser as "thighL". Both
      // spellings are keyed: the bare one because that is what the file contains, and the dotted one because
      // every posing rule in this file was written against the bone's name in Blender. The previous version keyed
      // o.name and o.name.replace(/\./g, "") — after sanitising those are the same string, so the dotted lookups
      // returned undefined and every rule that used them did nothing at all, silently. The legs have never moved.
      bones[o.name] = o;
      const bare = o.name.replace(/\./g, "");
      bones[bare] = o;
      const m = bare.match(/^(.*?)([LR])$/);
      if (m) bones[`${m[1]}.${m[2]}`] = o;
    });
    // the figure's own height, in feet, read off the model rather than assumed: the stride below is a
    // fraction of it, and a 6ft 2in member does not take the same steps as a 5ft 8in one
    const box = new THREE.Box3().setFromObject(root);
    // The racquet is NOT parented to the hand. A racquet is aimed at the ball, not welded to a fist: the page
    // places it every frame — butt in the palm, head on the ball, face square to the direction the ball leaves
    // in. Being its own object in the scene also spares it the 3.28084 that converts the metre-built body into
    // the feet the court is measured in; built in feet and left in the scene it is 27in long, as it should be.
    const rac = buildRacquet();
    scene.add(rac);
    // `look.racquet` is a boolean about the picture, not about the tennis: a member who does not want to see one is
    // shown without one, and the record's own racquet positions still cost nothing, because they are a placement.
    if (L.racquet === false) rac.visible = false;
    rigs[name] = { root, bones, height: box.max.y - box.min.y, racquet: rac, look: L };
    if (q.has("debug")) console.log("debug bones", name, Object.keys(bones).join(","), "height", rigs[name].height.toFixed(2),
      "| upperarmR is", bones["upperarmR"] && (bones["upperarmR"].type || "?"), "| handR is", bones["handR"] && (bones["handR"].type || "?"),
      "| handL is", bones["handL"] && (bones["handL"].type || "?"));
  }
}

/* ---------- posing: solve, do not key ----------
   CCD on the hitting arm. Each iteration rotates a bone so the hand points more nearly at the target; a few
   iterations and the racquet is at the ball. Clavicle and spine are left alone, so a ball the player cannot
   really reach produces a visible stretch rather than a corrected one. */
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpQ = new THREE.Quaternion();
const tmpQ2 = new THREE.Quaternion(), tmpP = new THREE.Vector3();

function rotateWorld(bone, qWorld) {
  // world' = q * world  =>  local' = parentInv * q * parent * local. The first version multiplied them
  // premultiply(inv).premultiply(q).premultiply(parent), which evaluates to parent*q*parentInv*local — the same
  // rotation about a conjugated axis, i.e. about the wrong axis. The arm solver then "converged" by pulling the
  // hand toward a point nobody had asked for, which is a large part of why every stroke looked like a statue
  // reaching for something. Verified numerically before changing it: the old order is off by 1.19 on a unit test.
  // ...and both quaternions are re-normalised, which is not housekeeping. getWorldQuaternion() decomposes the
  // parent's world matrix, and a matrix carrying any scale at all decomposes to a quaternion that is not unit
  // (the extraction assumes an orthonormal basis). Composing three non-unit quaternions leaves the bone's own
  // quaternion with a length above 1, and a bone's matrix is composed as position * quaternion * scale, so the
  // bone silently ACQUIRES a scale of |q|² — and the child inherits it on the next frame, and the child of that.
  // Measured on the playing film (?debug, 2026-11-11): forearmR reached a world scale of 3.947/3.429/3.984
  // against the body's 3.281 after eleven minutes, q length 1.064, and the hand — rigid-skinned to its bone —
  // stretched with it. That is the founder's "the racquet grows into a larger and larger cigar": it is the
  // forearm, the hand and the racquet at the end of them, drawn 20% long and 20% wide, non-uniformly, growing
  // with every frame of every rally. A paused still never shows it, because the drift is per frame and a still
  // has had two frames; only a film that has been playing for minutes has it.
  bone.parent.getWorldQuaternion(tmpQ2).normalize();
  const inv = tmpQ2.clone().invert();
  bone.quaternion.premultiply(tmpQ2).premultiply(qWorld).premultiply(inv).normalize();
  bone.updateMatrixWorld(true);
}

function solveArm(rig, target, side) {
  /* Two-bone IK with the elbow's position solved, not searched for.

     This replaces a CCD loop that rotated the forearm and the upper arm towards the target a few times. CCD finds
     the *direction* from a joint to a target, which is fine when the target is nearly out of reach and useless
     when it is close to the shoulder: the elbow has to fold hard, the direction barely changes, and the solve
     stops. Measured with ?debug on every shot in the demo: the hitting hand finished 0.86ft from its own target,
     the elbow ended up by the ear, and on a ball on the left side the left arm did not move at all — 4.03ft from
     a target a forearm away. That is the "statue reaching for something" reading, and no number of extra passes
     fixed it, which is what a local minimum looks like.

     Law of cosines instead: the elbow sits on a circle around the shoulder-to-target axis at the angle where the
     forearm is exactly long enough to reach the ball, and the circle is broken by a pole — the elbow points down
     and away from the body, which is where elbows point.

     a and b are read off the bones rather than assumed, so a taller member has a longer reach and a ball they
     cannot get to produces a straight arm short of the ball instead of a torn one. */
  const { bones } = rig;
  const S = side === "L" ? "L" : "R";
  const up = bones["upperarm" + S], fore = bones["forearm" + S], hand = bones["hand" + S];
  if (!up || !fore || !hand) return;
  const sr = up.getWorldPosition(new THREE.Vector3());
  const er = fore.getWorldPosition(new THREE.Vector3());
  const wr = hand.getWorldPosition(new THREE.Vector3());
  const a = sr.distanceTo(er), b = er.distanceTo(wr);

  if (a < 1e-4 || b < 1e-4) return;
  const n = target.clone().sub(sr);
  let d = n.length();
  if (d < 1e-4) return;
  n.normalize();
  const reach = (a + b) * 0.995;
  if (d > reach) d = reach;                      // out of range: a straight arm, still pointing at the ball
  if (d < Math.abs(a - b) + 1e-3) d = Math.abs(a - b) + 1e-3;
  // the elbow's circle: pole is down and slightly behind the player, so the elbow drops under the strike
  const back = new THREE.Vector3(side === "L" ? -1 : 1, 0, 0);   // rough: away from the body's centre line
  const pole = new THREE.Vector3(0, -1, 0).addScaledVector(back, 0.35);
  const perp = pole.clone().addScaledVector(n, -pole.dot(n));
  if (perp.lengthSq() < 1e-6) perp.set(0, 0, 1);
  perp.normalize();
  const cosA = (a * a + d * d - b * b) / (2 * a * d);
  const alpha = Math.acos(Math.max(-1, Math.min(1, cosA)));
  const elbow = sr.clone().addScaledVector(n, a * Math.cos(alpha)).addScaledVector(perp, a * Math.sin(alpha));
  aimBone(up, elbow.clone().sub(sr));
  const e2 = fore.getWorldPosition(new THREE.Vector3());
  aimBone(fore, target.clone().sub(e2));
}

/* Point a bone at something, without knowing how Blender rolled it.
   Every bone here runs along its own local +Y (checked against the .glb: every child offset is (0,1,0)), but the
   local X and Z axes are rolled differently bone by bone, so the same Euler angle means a different motion on the
   thigh and on the arm. Aiming sidesteps the question: the bone is rotated in world space until its own axis
   lies along the direction asked for, which is also how you would pose a lay figure. */
const _aim = new THREE.Vector3(), _aimQ = new THREE.Quaternion();
function aimBone(bone, dir) {
  if (!bone) return;
  bone.updateWorldMatrix(true, false);
  _aim.set(0, 1, 0).transformDirection(bone.matrixWorld);
  _aimQ.setFromUnitVectors(_aim, dir.clone().normalize());
  rotateWorld(bone, _aimQ);
}

/* ---------- walking, without a walk cycle ----------
   A gait is two numbers and a phase: the thigh swings, the knee folds on the way through, and the phase advances
   with the ground covered, not with the clock. That way the feet keep pace with the body however fast it is going
   — which is the whole difference between a figure that runs and a figure that is pushed along on castors.
   Nothing here is animation data; it is a rule about where the legs are given how far the player has travelled. */
function legs(rig, phase, moving, face, turn, load, idle, walk) {
  // `turn` is the twist about the body's own vertical, in radians: away from the net on the wind-up, through on
  // the follow-through. It reaches the legs because a stroke is not an arm — the pelvis turns, the knees load,
  // and only then does the racquet move. Until 2026-11-11 none of that was here: the bodies stood square and the
  // arm reached sideways at the ball, which is the difference between a stroke and a grab.
  const { bones } = rig;
  turn = turn || 0; load = load || 0;
  // A pose is a DELTA on the rest pose, not a replacement for it. bone.rotation.set(...) throws away the bone's
  // rest orientation, which in a glTF skeleton is carried by the node's own quaternion — do that to a thigh and
  // the leg swings up over the shoulder. The rest quaternion is captured once and composed with each swing.
  const dq = new THREE.Quaternion(), de = new THREE.Euler();

    const b = bones[n]; if (!b) return;

    b.quaternion.copy(rest).multiply(dq.setFromEuler(de.set(x, y, z)));
  };
  // NOBODY STANDS STILL. Until 2026-11-12 a player who had stopped was a frozen version of the walk cycle: the
  // stride amplitude fell to 12% and the phase stopped advancing, because the phase is built from ground covered
  // and their ground had stopped. So the figure landed in the middle of a stride and stayed there — the founder,
  // 2026-11-12: "Do you intend for the players to freeze for an instant just before hitting the ball? In reality
  // there would be no such pauses; real players are in motion the entire point. Even when they are waiting to
  // receive and are already in position, they shift their weight as the ball approaches."
  //
  // He is right, and the freeze is an accident of that one line. So `still` fades the stride OUT — a player who
  // has stopped does not stay mid-step — and fades in a stance that moves: the weight rocks from one leg to the
  // other at about one cycle a second, the knees stay soft, and the pelvis rolls over the loaded leg. `idle` is
  // film time, not distance, which is the whole point: it advances whether or not the record moves them.
  const still = moving ? 0 : 1;
  const idleS = Math.sin(idle || 0);
  const live = moving ? 1 : 0.12;                       // standing still is a very small version of walking
  // The swing is set so the foot travels as far as the body does in one step (0.42 of its height), which is what
  // stops the feet skimming along the ground. A bigger swing looks more athletic and slides; the phase is already
  // driven by distance, so the stride is honest at any speed and the legs simply cycle faster when the player runs.
  const A = 0.45 * live * (1 + 0.45 * load), K = 0.85 * live * (1 + 0.30 * load);

  const stride = 1 - still;
  set("thigh.L", -A * Math.sin(phase) * stride - still * (0.05 + 0.05 * idleS), 0, -0.09);
  set("thigh.R", -A * Math.sin(phase + Math.PI) * stride - still * (0.05 - 0.05 * idleS), 0, 0.09);
  set("shin.L", K * swing(phase) * stride + still * (0.20 - 0.12 * idleS) + 0.10 * load, 0, 0);
  set("shin.R", K * swing(phase + Math.PI) * stride + still * (0.20 + 0.12 * idleS) + 0.10 * load, 0, 0);
  set("foot.L", -0.25 * (moving ? 1 : 0), 0, 0);
  set("foot.R", -0.25 * (moving ? 1 : 0), 0, 0);
  set("spine", -0.05 - 0.09 * live - 0.10 * load - still * 0.02, turn * 0.35 + still * 0.03 * idleS, 0.06);
  set("hips", 0.04 * live + still * 0.02, turn * 0.30, still * 0.06 * idleS);
  chestTwist(rig, turn * 0.45);
  if (walk) stroll(rig, face, phase); else arms(rig, face, phase);
}

/* Carrying a racquet across the court is not standing at the baseline. The ready pose — both arms up, the frame
   in front of the shoulder — is a pose of somebody about to be hit at; it looks wrong in a walk, and it is what
   the film had, because between points there was nothing to pose for. The arms hang and swing opposite the legs,
   and the racquet is carried down by the thigh, head forward: the way people carry a racquet when they are going
   somewhere rather than playing. */

  const dir = (f, r, u) => new THREE.Vector3().addScaledVector(face, f)
    .addScaledVector(right, r).addScaledVector(_up, u).normalize();
  const sw = Math.sin(phase) * 0.42;                      // the arms swing with the gait, arms against legs
  aimBone(rig.bones["upperarm.R"], dir(-0.16 * sw, 0.26, -0.95));
  aimBone(rig.bones["forearm.R"], dir(0.30 + 0.10 * sw, 0.12, -0.94));
  aimBone(rig.bones["upperarm.L"], dir(0.16 * sw, 0.30, -0.95));
  aimBone(rig.bones["forearm.L"], dir(0.26 - 0.10 * sw, 0.14, -0.95));

/* A player waiting for a ball does not stand with both arms hanging: the free arm is across the body, the racquet

   future change of bone roll. */

    .addScaledVector(right, r).addScaledVector(_up, u).normalize();

  // height in front of the shoulder rather than straight above it
  aimBone(rig.bones["upperarm.R"], dir(0.20, 0.30, -0.93));
  aimBone(rig.bones["forearm.R"], dir(0.72, 0.12, 0.28));
  // free arm: down and across, hand toward the racquet's throat, elbow bent
  aimBone(rig.bones["upperarm.L"], dir(0.15, 0.35, -0.92));
  aimBone(rig.bones["forearm.L"], dir(0.55, 0.30, -0.25));

function ready(rig, north) {

  const { bones } = rig;

/* ---------- the racquet, which the page holds ----------
   A tennis racquet is 27in long: a grip of 7, a throat of 8, a head of 12, the head 9.5in wide. The one in the
   .glb was a torus on a stick, 20% too long, and being welded to the hand it could only ever point where the
   hand pointed. So the body is exported without it and the racquet is built here, as a child of the hand bone:
   real proportions, a strung bed, and an aim — the face turns to the direction the engine says the ball left in.
   Equipment belongs to the shot, not to the body. */

    g.beginPath(); g.moveTo(0, i * px); g.lineTo(cv.width, i * px); g.stroke();
  }

function buildRacquet() {
  const g = new THREE.Group();

  const frameMat = new THREE.MeshStandardMaterial({ color: 0xd9d3c4, roughness: 0.32, metalness: 0.30 });
  const strMat = new THREE.MeshStandardMaterial({ map: stringTexture(), transparent: true, alphaTest: 0.05,
                                                  side: THREE.DoubleSide, roughness: 0.9 });

  const strut = (a, b, r, mat) => {
    const d = new THREE.Vector3().subVectors(b, a);

    m.position.copy(a).addScaledVector(d, 0.5);

    m.castShadow = true;

  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.070, 0.064, 0.58, 12), gripMat);
  grip.position.y = 0.29; grip.castShadow = true; g.add(grip);
  g.add(new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.012, 6, 16).rotateX(Math.PI / 2)
                        .translate(0, 0.575, 0), gripMat));           // the collar at the top of the grip

  strut(V(0, 0.58), V(0.255, 1.31), 0.026, frameMat);
  strut(V(0, 0.58), V(-0.255, 1.31), 0.026, frameMat);

  const head = new THREE.Mesh(new THREE.TorusGeometry(0.435, 0.030, 8, 28), frameMat);
  head.position.y = 1.74; head.scale.x = 0.83; head.castShadow = true; g.add(head);

  const bed = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.85), strMat);
  bed.position.y = 1.74; g.add(bed);

  g.userData.shaft = new THREE.Vector3(0, 1, 0);

}

/* Put the racquet where a racquet goes: butt in the palm, head toward the ball, string bed square to the shot.
   Two vectors make it, and both are already in the record: the hand, and the direction the engine says the ball
   left in. The shaft is lined up with the first, then the racquet is rolled about its own shaft until the face
   looks along the second. A racquet that only points where the hand points is a paddle. */
const PALM = 0.35;                      // wrist to the butt of the handle, in feet: the fist, not the joint

  _shaft.normalize();
  // The butt of the handle is not at the wrist. It sits in the palm, four inches further along the shaft than
  // the bone that names the hand — and those four inches are the difference between a rig that reaches 3.6ft
  // from the shoulder and a rig that reaches 3.9, which is a real player's arm and frame. Without it the frame
  // stops short of every high ball and every serve.
  rac.position.copy(_hp).addScaledVector(_shaft, PALM);
  rac.quaternion.setFromUnitVectors(_up, _shaft);

  _n0.set(0, 0, 1).applyQuaternion(rac.quaternion).addScaledVector(_shaft, -_n0.dot(_shaft));
  if (_n0.lengthSq() < 1e-6) return;

  // here. Every measurement of "where is the head" that reads matrixWorld — including ?debug's own — is then
  // reading the previous frame, which is 1/60s of a swing. Cheap, and it makes the instrument honest.
  rac.updateMatrixWorld(true);
}

/* The reach the record allows and the reach the body has are two different numbers, and the picture has to
   reconcile them. RACQUET_REACH in the engine is 4.5ft from the middle of the body — arm out, frame out, a lunge
   — and it is what decides whether a ball is worth running for. The rig can put the middle of the strings
   3.5ft from the shoulder with the arm straight, and no further. The 4.5 includes the lunge, so the lunge has to
   be drawn: 63 of this film's 106 strikes were reachable by the rule and outside the body, which is why the ball
   was never on the strings. This moves the body — a stride toward the ball, and up on the toes when the ball is
   overhead — by exactly the gap, capped, and eased in and out over half a second either side of the strike so
   that it is a movement and not a teleport. */
const _ras = new THREE.Vector3();
function reachTo(rig, lead, ball, tTo) {
  // The frame is placed at the right hand on every stroke — the butt hand — so the right shoulder is the one
  // that has to be able to reach one shaft-length short of the ball. On a forehand that is the hitting shoulder;
  // on a backhand it is the far one, which is why a backhand has always been the stroke this rig could not play.
  const b = rig.bones["upperarmR"] || rig.bones["upperarm" + lead];
  if (!b) return;
  const r = Math.max(0, Math.min(1, 1 - Math.abs(tTo) / 0.5));

  // Split the gap into a stride and a rise, and then look again: moving along two axes is not moving along the
  // line between them, so one pass leaves a hand's width of the gap behind (measured: 0.3ft on the serve, which
  // is the stroke where the gap is nearly all vertical). Three passes close it to nothing.
  let lean = 0, rise = 0;
  for (let pass = 0; pass < 3; pass++) {
    const gy = ball.y - (s.y + rise), gh = Math.hypot(ball.x - (s.x + (hx / hl) * lean), ball.z - (s.z + (hz / hl) * lean));
    const gap = Math.hypot(gh, gy) - 3.92;      // 1.85ft of arm, 0.35ft of palm, 1.74ft of frame, and a hair
    if (gap <= 1e-3) break;

    const over = Math.max(0, Math.min(1, gy / 2.5));

    rise = Math.min(0.95, rise + gap * 0.55 * over * 1.05);

  if (rise > 0) rig.root.position.y += rise * r;
}

/* A nod is one joint, so it is cheap, and it is the whole of the greeting the founder asked for: two people
   walking past each other turn to each other and nod. Which way "down" is about the head bone's own X axis is a
   fact about the export, not about Blender, so it is settled by measurement the first time it is needed — rotate
   the bone a little and see whether the top of the head moved forwards or backwards. Done once per body and kept
   on the bone. */

const _readyAim = new THREE.Vector3();

    const b = rig.bones[n]; if (!b) continue;
    const rest = b.userData.rest || (b.userData.rest = b.quaternion.clone());
    b.quaternion.copy(rest);
    if (pitch) b.quaternion.multiply(_hq.setFromAxisAngle(_hx, pitch * k * nodSign(rig, fwd)));

/* ---------- the film ---------- */
const SEG = [];
const PLAN = {};                       // name -> [{t0,t1,from,to}] in seconds of film
/* Where each player is when a change of ends has happened, as a floor under everything else: the walk round the
   post is in the record (see `settle` below), and this only says which side of the net a body is on after it.
   It used to BE the change of ends — "nobody walks it on television either", which was wrong twice: television
   shows exactly this, and the founder asked for it on 2026-11-12. Keeping it costs one line and it means a record
   with no walks in it still draws the right ends. Each entry is {t, to} in seconds of film. */
const SWAP = {};
/* The last shot of each rally, and who the engine says won it. A rally ends either because the shot was out (the
   hitter loses it) or because the other player could not reach a good one (the hitter wins it); a rally that runs
   to the cap has no winner and says so. The page does not decide this — lab/tennis_script.py reads it off the
   engine's verdict — but it has to be known before the film is cut, because the camera only leaves the court
   between points. */
const POINT = {}, LASTN = {};
for (const sh of D.shots) LASTN[sh.rally] = sh.n;
for (const r of D.rallies) POINT[r.rally] = (r.point && r.point.winner) ? r.point : null;

   follows it has to be X. It was cutting to whoever struck the last ball, which reads correctly only when that
   ball was a winner; on an error it showed the player who had just lost the point, underneath a sign naming the
   other one, which is what he saw as reversed. Nothing is invented: the winner is wherever the record last put
   them — their own contact point, or the end of their own run. */

// back for that ball, not for this one, so the record that says how rushed they are is the *next* entry's `rush`.
const NEXT = {};
/* The shot that comes next in the film, whoever strikes it — which, for the receiver of a ball, is that
   receiver's own next shot. NEXT above is the next shot by the SAME player, which is the right record for the
   hitter's own preparation and the wrong one for the receiver's: it named the striker's next ball, so the
   receiver's racquet came back on the striker's rush and on the striker's side of the body, at the striker's
   timing. Two players, one clock. */
const AFTER = {};
{ for (let i = 0; i + 1 < D.shots.length; i++) AFTER[D.shots[i].n] = D.shots[i + 1]; }
{ const last = {};
  for (const pl of D.players) last[pl.name] = null;
  for (let i = D.shots.length - 1; i >= 0; i--) { const s = D.shots[i]; NEXT[s.n] = last[s.player]; last[s.player] = s; } }

const WINPOS = {};
{
  const pos = {};
  for (const pl of D.players) pos[pl.name] = { at: pl.north ? [2, WID / 2] : [LEN - 2, WID / 2], north: pl.north };
  for (const sh of D.shots) {
    if (sh.run) pos[sh.run.player] = { at: sh.run.to, north: sh.run.north };
    pos[sh.player] = { at: [sh.contact[0], sh.contact[1]], north: sh.north };

{

  let rallySeen = 0;
  const lastNorth = {};
  for (const sh of D.shots) {
    if (sh.rally !== rallySeen) {                    // first shot of a new rally: has anyone changed ends?
      const r = D.rallies.find(x => x.rally === sh.rally) || {};
      for (const name in (r.ends || {})) {
        const n = r.ends[name];

    // the point board, the pause, and then a couple of seconds on the player, which is what the 3.8 is for.
    // 0.12s, not 0.55: a beat between shots is a beat in the BALL's timing, and half a second of it was half a
    // second in which both players stood still with the ball parked on the racquet. Measured across one of those
    // beats: both bodies between 0.0 and 0.6ft/s for 0.35s, then a jump to 10.6 and 21.5ft/s. The founder,
    // 2026-11-12: "movement of the players at the time they strike the ball is still not continuous, there's still
    // a pause that doesn't occur in real life."
    let hold = (LASTN[sh.rally] === sh.n && POINT[sh.rally]) ? 1.2 : 0.12;
    const seg = { sh, start: t, dur, hold, cams: cams(sh, dur) };
    if (LASTN[sh.rally] === sh.n && POINT[sh.rally]) seg.point = POINT[sh.rally];
    SEG.push(seg);

    }

    // record now says where they go and how long it takes; before this the feet stayed at the contact point for

    // it is in the record for the same reason every other move is: the picture does not invent a position.
    if (sh.stance) {

        { t0: t + sh.stance.t0, t1: t + sh.stance.t1, from: sh.stance.from, to: sh.stance.to });
    }

    // and the point of the court their body turns to. The founder, 2026-11-12: "When a ball is long, you portray
    // the receiving player as knowing in advance that it will be long and not moving. A more accurate portrayal
    // would be having the receiving player watch the ball go out."

        { t0: t + sh.watch.t0, t1: t + sh.watch.t1, from: sh.watch.from, to: sh.watch.to });

        { t0: t + sh.recover.t0, t1: t + sh.recover.t1, from: sh.recover.from, to: sh.recover.to });
    }
    // The walk between points. The record now says where each of them was when the ball died and how long the
    // walk to their place takes, so the break itself has to be as long as the walk: a break that is shorter than
    // the walk is a body being placed at its mark, which is what the film did at sixteen of its nineteen breaks
    // (2.8 to 9.5ft in one frame) and at every change of ends (73 to 79ft).
    const rr = D.rallies.find(x => x.rally === sh.rally) || {};

      for (const w of rr.settle.players)

          (PLAN[w.name] = PLAN[w.name] || []).push({ t0: dead + lg.t0, t1: dead + lg.t1, from: lg.from, to: lg.to });

      // the break has to end after the walk back does or the two moves overlap and the body is placed rather
      // than walked — measured, a 0.99ft step at every one of the film's sixteen ordinary breaks.
      hold = Math.max(hold, rr.settle.dur + 0.75);

      // target that moves rather than being switched on and off, because switching it off snaps the arm
      // The hand is on the ball at the contact frame and leaves it afterwards. The previous version ramped the
      // solve IN from 0.26s to 0.56s, so the ball was long gone by the time the arm arrived: a follow-through
      // with its cause removed.
      const k = Math.max(0, Math.min(1, 1 - tl / 0.34));
      const ball = new THREE.Vector3(sh.contact[0], sh.contact[2], sh.contact[1]);
      // A hand does not touch the ball; a racquet does. The arm is solved to a hand 1.6ft back down the line from
      // the shoulder to the ball, and the racquet's 1.74ft shaft carries the head the rest of the way — which is
      // what the stroke is. Solved to the ball itself, the arm put the hand on it and the frame 2ft past it.
      //
      // Which arm is the leading one follows the record: a backhand is taken with the left hand leading and the
      // right hand on the handle below it, which is how the two-handed backhand that most club players own
      // actually works, and it is also what the reference sheets kept drawing whenever the racquet crossed the
      // body. Two hands need the *shoulders* to have turned far enough that the left arm can reach across, which
      // is what the flipped `turn` above is for: without it the left hand is asked to cross a chest that is still
      // facing the wrong way and the solver tears the arm out of its socket trying.
      const lead = (sh.hand === "back") ? "L" : "R";
      // The hand goes where the RACQUET puts it, not where the arm can reach: 1.6ft back from the ball along
      // the shaft, and the shaft lies along the direction the ball leaves in. The previous version put the hand
      // 1.6ft back along the line from the shoulder to the ball, which for a ball struck across the body asks
      // the arm to fold into its own chest — the CCD cannot get there, and the elbow ends up by the ear, which
      // is the "statue reaching for something" the founder has been looking at. Measured with ?debug: the hand
      // was 0.86ft short of its own target on every shot.
      reachTo(rig, lead, ball, tl);
      _face.set(sh.v0[0], sh.v0[2], sh.v0[1]).normalize();
      (rig.bones["upperarm" + lead] || rig.bones["chest"]).getWorldPosition(_sh0);
      // `1 - k`, not `k`: k is 1 at the strike and falls to 0 half a second later, and a lerp towards the ready
      // position by k is a hand that is at the ready position at the strike and at the ball afterwards. That is
      // the arithmetic the page has had since the arm solver was written, and it is why no frame of this game
      // has ever had a racquet on the ball: the racquet followed the same lerp and sat at the chest through
      // every stroke. Found by measuring, not by looking — ?debug prints the hand's distance to the ball, and it
      // read 2.46ft at the strike with a target 1.6ft away, on every shot, whatever the solver did.
      const rest = 1 - k;
      // The racquet's head goes on the ball and the butt 1.74ft behind it along the shot, which is where the
      // hands are. The previous rule put the hand 1.6ft back along the line from the shoulder to the ball, and
      // that line is fine on a forehand and wrong on a backhand: the contact is beside the body, so the ball is
      // barely two feet from the LEFT shoulder and the hand target landed 0.08ft from it — inside the shoulder,
      // where the two-bone solve has no elbow to choose and folds the arm into a spike above the head. Measured,
      // not guessed: `shL to target 0.08`, `handL up 0.81`, left hand 1.70ft from the ball it was supposed to
      // hold.
      // The hand goes exactly one shaft-length from the ball, on the side the hitting shoulder is on. The frame
      // is a 1.74ft lever aimed at the ball, so the head lands on the ball if and only if the hand is exactly
      // 1.74ft from it — that is the whole geometry, and it leaves one degree of freedom: which direction.
      // Asking for `ball - 1.74*face` (a fixed offset along the shot) is the same request only while the ball is
      // far enough from the body for the arm to put the hand there; when it is not, the arm comes up short and
      // the frame stops 6 to 8 inches PAST the ball, which is what the founder saw as the ball missing the
      // racquet entirely. Measured at the strike frame before this change: hand 1.18ft from the ball, head 0.56ft
      // from it and on the wrong side of it. Toward the shoulder cannot be on the wrong side, and it is where
      // the hands are in a real stroke: between the body and the ball.
      const u = ball.clone().sub(_sh0).normalize();                  // shoulder -> ball
      const butt = ball.clone().addScaledVector(u, -(PALM + 1.74));   // the WRIST, a palm further back
      const onGrip = (sh.hand === "back") ? ball.clone().addScaledVector(u, -(PALM + 1.38)) : butt;
      solveArm(rig, onGrip.lerp(wait, rest), lead);
      if (sh.hand === "back") solveArm(rig, butt.lerp(wait, rest), "R");   // the butt hand
      // The swing does not stop at the ball and drift home. It finishes: the racquet carries on up and across the
      // body to the shoulder on the hitting side and only then relaxes. Without that, a backhand — which starts on
      // the far side of the body and ends on the near one — passed straight through its own finish on the way back
      // to the ready pose and read as a poke, which is the weakest part of the film and the founder's note.
      const chestW = new THREE.Vector3();
      (rig.bones["chest"] || rig.root).getWorldPosition(chestW);
      const fwdW = new THREE.Vector3(Math.sin(rig.yaw), 0, Math.cos(rig.yaw));   // where the chest points
      // right = forward x up. The previous line had it as (cos, 0, -sin), which is the LEFT: every preparation
      // and every finish was mirrored onto the wrong side of the body. The engineer's check is the engine's own
      // side_of(): "a player at the north end faces +x, so their right hand is toward +y" — which is +z in world
      // terms — and this vector pointed at -z. The founder saw it on the run before any number did.
      const rightW = new THREE.Vector3(-Math.cos(rig.yaw), 0, Math.sin(rig.yaw));
      const fin = chestW.clone()
        .addScaledVector(rightW, back ? 1.05 : 0.80)
        .addScaledVector(fwdW, back ? 0.45 : 0.55);
      fin.y = chestW.y + (back ? 1.05 : 1.45);
      const done = Math.min(1, tl / 0.17);                                  // into the finish
      // ...and back out of it by the END OF THIS SHOT, not half a second after it. The relax used to take 0.5s,
      // which the old 0.55s beat between shots hid; with the beat gone the arm was still up in the finish when the
      // next shot began, and the frame dropped 1.5ft between one frame and the next.
      const relax = Math.max(0, Math.min(1, (tl - 0.17) / Math.max(0.14, seg.dur - 0.17)));
      // The pose it relaxes into is the ready pose, the same one the other player is standing in: hand at `wait`,
      // frame 0.70ft in front of it and 0.75ft up. It used to relax the frame onto `wait` itself, i.e. held straight
      // above the hand, which is not a pose anybody stands in.
      _readyAim.copy(wait).addScaledVector(_face, 0.70).addScaledVector(_up, 0.75);
      placeRacquet(rig, ball.clone().lerp(fin, done).lerp(_readyAim, relax), _face);
      if (q.has("debug")) {
        const hR = rig.bones["handR"], hL = rig.bones["handL"], d = v => (v ? v.getWorldPosition(new THREE.Vector3()).distanceTo(ball) : NaN);
        const head = rig.racquet
          ? rig.racquet.position.clone().add(new THREE.Vector3(0, 1, 0).applyQuaternion(rig.racquet.quaternion).multiplyScalar(1.74))
          : null;
        // The numbers that decide whether the ball can be on the strings at all: how far the feet are from the
        // contact, how far the racquet-bearing shoulder is, and how high the ball is. A strike whose shoulder is
        // more than 3.9ft from the ball is a strike no arm and frame can make.
        { const _b = new THREE.Vector3(sh.contact[0], sh.contact[2], sh.contact[1]);
          const _S = (rig.bones["upperarmR"] || rig.bones["chest"]).getWorldPosition(new THREE.Vector3());
          console.log("debug geo", "shoulder-B", _S.distanceTo(_b).toFixed(2),
            "feet-B", Math.hypot(rig.root.position.x - _b.x, rig.root.position.z - _b.z).toFixed(2),
            "ballY", _b.y.toFixed(2), "rise", rig.root.position.y.toFixed(2)); }
        console.log("debug stroke", pl.name, sh.hand, "tl", tl.toFixed(2),
                    "right hand to ball", d(hR).toFixed(2),
                    "left hand to ball", d(hL).toFixed(2), "k", k.toFixed(2),
                    "| racquet head to ball", head ? head.distanceTo(ball).toFixed(2) : "n/a",
                    "| shoulderL to its hand", rig.bones["upperarmL"].getWorldPosition(new THREE.Vector3())
                      .distanceTo((hL || rig.root).getWorldPosition(new THREE.Vector3())).toFixed(2));

      }
    } else {
      // Not striking. If the racquet has come back for the next ball, the arms show it, and they show it differently
      // on each side — the founder, 2026-11-11: "If the players are remembering 'racquet back,' they run with their
      // arm open for a forehand shot, but with their arm crossing in front of their body when they run towards a
      // backhand shot." Open means the racquet hand away from the body on the hitting side; crossing means both
      // hands across the chest with the racquet head back on the far side. A player who has not remembered gets
      // neither, which is the ready pose — the same lerp, by the same `windup`.
      _face.set(at ? 1 : -1, 0.12, 0).normalize();   // waiting for the ball, bed open to the net
      const fwd = new THREE.Vector3(Math.sin(rig.yaw), 0, Math.cos(rig.yaw));     // the way the body is facing
      const right = new THREE.Vector3(-Math.cos(rig.yaw), 0, Math.sin(rig.yaw));   // forward x up, not its mirror
      const chest = new THREE.Vector3();
      (rig.bones["chest"] || rig.root).getWorldPosition(chest);
      // The ready hand, spelled out rather than read back off the rig: reading it off the bones made the pose
      // depend on the frame before it, and a chain of lerps that starts from last frame's answer drifts.
      const readyHand = chest.clone().addScaledVector(fwd, 0.55).addScaledVector(_up, 1.35);
      // 0.75 and not 1.55: the backhand sheet's RECOVERY panel holds the racquet in front of the chest, and 1.55
      // put the head over the player's head like a salute, which is what was on screen between points
      const readyAim = readyHand.clone().addScaledVector(_face, 0.70).addScaledVector(_up, 0.75);
      // The three places the racquet is on its way to the ball, from the backhand sheet of 2026-11-11
      // (`bodies/reference/poses/back-45.jpg`), measured off the drawing in fractions of the figure's own height:
      //   the run (PREPARATION)  hand 0.71H, head 0.66H and 0.27H behind the hands on the hitting side
      //   the take-back          hand 0.85H, head 1.10H — above the head, which is the loop that was missing
      //   contact                hand 0.59H, head 0.57H, hands 0.27H in front of the hips
      //   the finish              hand 0.83H, head 1.00H, across on the other shoulder
      // The founder named the backhand the weakest part of the film, and a stroke that goes from a hip-high
      // racquet straight to the ball has no loop in it, which is most of what "weakest" meant.
      const H = Math.max(4.0, rig.height);
      const handPrep = chest.clone(), headPrep = new THREE.Vector3();
      const handTake = chest.clone(), headTake = new THREE.Vector3();
      // The shaft is the racquet, 1.70ft from the butt to the head, so the head is the hand plus that length
      // along a direction. The direction is the founder's, 2026-11-11: "you've implemented racquet-back at around
      // 180 degrees. Just come back about 100 degrees" — level with the shoulder line and a little behind it, so
      // the head is BESIDE the player and not behind their back. 100 degrees from the way they are facing is
      // (0.97 across, 0.17 behind).
      const prepDir = new THREE.Vector3(), takeDir = new THREE.Vector3();
      if (back) {
        // across the chest: both hands on the left, head out to that side
        handPrep.addScaledVector(right, -0.50).addScaledVector(fwd, 0.30);
        prepDir.addScaledVector(right, -0.97).addScaledVector(fwd, -0.17).addScaledVector(_up, 0.15).normalize();
        handTake.copy(chest).addScaledVector(right, -0.40);
        takeDir.addScaledVector(right, -0.45).addScaledVector(fwd, -0.12).addScaledVector(_up, 0.88).normalize();
      } else {
        // open: the hitting hand back and away on the right, head out to that side
        handPrep.addScaledVector(right, 0.85).addScaledVector(fwd, -0.20);
        prepDir.addScaledVector(right, 0.97).addScaledVector(fwd, -0.17).addScaledVector(_up, 0.15).normalize();
        handTake.copy(chest).addScaledVector(right, 0.55);
        takeDir.addScaledVector(right, 0.45).addScaledVector(fwd, -0.10).addScaledVector(_up, 0.88).normalize();
      }
      handPrep.y = Math.min(handPrep.y, 0.71 * H);
      handTake.y = Math.max(chest.y + 0.30, 0.85 * H);
      headPrep.copy(handPrep).addScaledVector(prepDir, 1.70);
      headTake.copy(handTake).addScaledVector(takeDir, 1.70);
      // Where the hand IS, not where a chest-relative point says it should be. The ready pose is made twice in this
      // file — once as angles, by arms(), and once by the arm solver aiming at `readyHand` — and the two do not
      // agree: 1.3ft apart, measured, at the first frame of a shot, when the pose switches from one construction to
      // the other and the racquet head leaves at 33ft/s. Starting the blend from the hand's own position makes the
      // two constructions meet.
      // `wait` and not the hand's current position: the angular ready pose and the solved one are 1.5ft apart, and
      // the hand's current position is the angular one because arms() has just run. `wait` is the point the hitter
      // relaxes to and the point the standing player is now solved to, so all three agree.
      const prep = wait.clone().lerp(handPrep, windup);           // a beginner never gets here
      if (isReceiver) {
        // When, not whether: the take-back happens in the last half-second of the ball's flight, and the swing
        // from there to the ball in the last of it, ending exactly on the frame the next shot starts on. A rushed
        // player does both in less time, which is what being rushed means.
        const swing = Math.max(0.20, 0.34 - 0.16 * rush);
        const t0 = Math.max(0, seg.dur - swing);
        const upK = Math.max(0, Math.min(1, (tl - t0) / (swing * 0.55)));
        const thruK = Math.max(0, Math.min(1, (tl - (t0 + swing * 0.55)) / (swing * 0.45)));
        const nxtBall = (recv && recv.rally === sh.rally) ? recv : null;
        let hand = prep.clone().lerp(handTake, upK);
        let head = readyAim.clone().lerp(headPrep, windup).lerp(headTake, upK);
        if (nxtBall) {
          const outc = new THREE.Vector3(nxtBall.v0[0], nxtBall.v0[2], nxtBall.v0[1]).normalize();
          const cBall = new THREE.Vector3(nxtBall.contact[0], nxtBall.contact[2], nxtBall.contact[1]);
          // The ball is struck where the feet will BE, not where they are: a receiver still four feet from the
          // contact would otherwise swing at a point four feet beyond the racquet. Shift the target by the run
          // that is still to come, so the blend ends on the contact exactly when the body arrives there.
          const shift = new THREE.Vector3(0, 0, 0);
          if (sh.run && sh.run.player === pl.name) shift.set(sh.run.to[0] - pos[0], 0, sh.run.to[1] - pos[1]);
          const at = cBall.clone().sub(shift);
          hand.lerp(at.clone().addScaledVector(outc, -(PALM + 1.74)), thruK);
          head.lerp(at, thruK);
        }
        const lead = back ? "L" : "R";
        if (nxtBall) reachTo(rig, lead, at, seg.dur - tl);
        solveArm(rig, hand, lead);
        const shaftNow = head.clone().sub(hand).normalize();
        if (back) solveArm(rig, hand.clone().addScaledVector(shaftNow, 0.36), "R");   // the butt hand
        placeRacquet(rig, head, _face);
        if (q.has("debug")) {
          const h = (rig.bones["hand" + lead] || rig.root).getWorldPosition(new THREE.Vector3());
          const rel = h.clone().sub(chest), hd = head.clone().sub(chest);
          console.log("debug prep", pl.name, back ? "backhand" : "forehand", "windup", windup.toFixed(2),
            "up", upK.toFixed(2), "thru", thruK.toFixed(2),
            "| hand at chest+", `side ${rel.dot(right).toFixed(2)}`, `fwd ${rel.dot(fwd).toFixed(2)}`,
            `up ${rel.y.toFixed(2)}`, "| head at chest+", `side ${hd.dot(right).toFixed(2)}`,
            `fwd ${hd.dot(fwd).toFixed(2)}`, `up ${hd.y.toFixed(2)}`,
            "| head height", head.y.toFixed(2), "of", H.toFixed(2),
            "| shaft", (Math.atan2(head.clone().sub(hand).dot(right), head.clone().sub(hand).dot(fwd)) * 180 / Math.PI)
              .toFixed(0) + "deg",
            `miss ${h.distanceTo(hand).toFixed(2)}`);
        }
      } else {
        // Solved to the hand's own ready point, exactly as the hitter's arm is solved to it when the stroke relaxes.
        // The pose used to be made two ways — angles here, IK there — and the two answers were 1.3ft apart, so the
        // racquet left at 33ft/s whenever the picture switched from one to the other.
        solveArm(rig, wait, "R");
        placeRacquet(rig, readyAim, _face);
      }
    }
    if (walking) {
      // The racquet goes down by the thigh. Whoever struck the ball that ended the point has had the stroke branch
      // run on them this frame, and a follow-through is not a walk — measured, that arm was still up with the hand
      // at 5.8ft and the frame at 4.0ft — so the arms go back down before the frame is carried.
      const fwd = new THREE.Vector3(Math.sin(rig.yaw), 0, Math.cos(rig.yaw));
      stroll(rig, new THREE.Vector3(at ? 1 : -1, 0, 0), phase);
      const hand = rig.bones["handR"];
      const hp = hand ? hand.getWorldPosition(new THREE.Vector3()) : rig.root.position.clone();
      placeRacquet(rig, hp.clone().addScaledVector(_up, -1.35).addScaledVector(fwd, 0.85), fwd);
      // The nod: two dips of the chin across three quarters of a second either side of the pass.
      let pitch = 0;
      if (dpass !== null && dpass > -0.75 && dpass < 1.0) {
        const u = (dpass + 0.75) / 1.75;
        pitch = 0.34 * Math.sin(Math.PI * u) * Math.abs(Math.sin(2 * Math.PI * u));
      }
      headPose(rig, pitch, fwd);
    } else {
      headPose(rig, 0, new THREE.Vector3(Math.sin(rig.yaw), 0, Math.cos(rig.yaw)));
    }
  }

  // words
  el("surface").textContent = `${D.surface} · wind ${D.wind.direction} ${D.wind.mph}mph`;
  el("rally").textContent = `rally ${sh.rally} of ${D.rallies.length} · shot ${sh.i}`;
  el("who").textContent = sh.player;

  const sw = el("sweet"); sw.textContent = sh.sweet ? "clean" : "framed";
  sw.className = "badge " + (sh.sweet ? "clean" : "frame");
  // the target, named rather than numbered: a reader can see that the ball was sent to a corner, and which
  const corner = sh.target ? `${sh.target[1] < WID / 2 ? "west" : "east"} corner, ` +
    `${Math.round(sh.target[0] < LEN / 2 ? sh.target[0] : LEN - sh.target[0])}ft inside` : `${sh.aim}ft across`;
  el("shotline").textContent = `face ${sh.face > 0 ? "+" : ""}${sh.face}°  power ${Math.round(sh.power)}  ` +
    `aimed ${corner}  leaving at ${Math.round(sh.power * 1.05)}mph`;
  const rn = sh.run;
  el("why").textContent = sh.why + (rn
    ? `   ·   ${rn.player} runs ${rn.dist}ft at ${rn.speed}ft/s${rn.met ? "" : " and does not get there"}`
    : "");
  if (sh.corridor[0] !== null) {
    const [lo, hi] = sh.corridor, zero = -12, span = 30;
    const x = v => Math.max(0, Math.min(100, (v - zero) / span * 100));
    el("self").style.left = x(lo) + "%";
    el("self").style.width = Math.max(1.2, x(hi) - x(lo)) + "%";
    el("tick").style.left = x(Math.max(-12, Math.min(18, sh.face))) + "%";
    el("winline").textContent = `${(hi - lo).toFixed(1)}° wide (${lo.toFixed(1)}° to ${hi.toFixed(1)}°) — this shot at ${sh.face.toFixed(1)}°`;
  }
  el("players").innerHTML = D.players.map(p =>
    `<div><span class="swatch" style="background:${p.north ? "#8fc6ff" : "#ffb98f"}"></span>${p.name} ` +
    `<span class="mono" style="color:var(--dim)">${p.rating.toFixed(1)} · ${p.balls} balls</span></div>`).join("");
  // The board stays up for the whole break, not for the length of the clock hold. He asked for it to overlay the
  // court across the break rather than flash (2026-11-11), and he is right: the break is the moment the picture
  // has nothing else to say, and a sign that appears for 0.4s of a 1.2s break is a stutter, not a caption.
  // ...but not across the whole break any more: the walk between points is now the picture, and he asked to see
  // it. The board is up for the first second and a half of the break, which is as long as it takes to read, and
  // then the court gets its players back.
  const deepInBreak = !!(seg.settle && tlRaw > seg.dur + 1.8);
  const showSign = !!(seg.point && (onCut || signAlways) && !deepInBreak);
  el("sign").className = showSign ? "on" : "";
  if (showSign) {
    el("signwho").textContent = `Point to ${seg.point.winner}`;
    el("signwhy").textContent = seg.point.reason;
    el("signctx").textContent = `rally ${sh.rally} of ${D.rallies.length} · ${D.surface} · ` +
      `last ball: ${sh.player}`;
  }
  el("cut").className = (onCut && !deepInBreak) ? "on" : "";
  // The card names the player the camera has cut to, and is hidden the moment the ball is in play: it is a still
  // of a person, so it may only appear when the record is not claiming to show a ball.
  const who = onCut ? (WINPOS[sh.rally] ? WINPOS[sh.rally].name : sh.player) : null;
  if (who) {
    const pl = D.players.find(x => x.name === who);
    if (pl) {
      const img = el("faceimg");
      const src = `bodies/faces/${pl.body}.jpg`;
      if (img.getAttribute("src") !== src) img.setAttribute("src", src);
      el("facename").innerHTML = `${pl.name} <span>${pl.rating.toFixed(1)}</span>`;
    }
  }
  el("facecard").className = (who && !deepInBreak) ? "on" : "";
  if (onCut) el("cut").textContent =
    `between points · ${WINPOS[sh.rally] ? WINPOS[sh.rally].name : sh.player}`;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ?debug also exposes the one thing a still cannot show: where every striker's FEET are at the instant they
   strike, which is what decides whether the ball can be on the frame's strings at all. One line per shot, read
   out of the same whereAt() the film uses rather than re-derived here. The arm and the racquet are 3.6ft
   together, so a contact further than that from the shoulder is a stroke nobody could have played. */
/* And where the bodies actually are, because "is anybody moving" is a question a still cannot answer and a
   number can. Root position, the two thighs' world positions, and the yaw: sample it at two film times and the
   difference is the answer. */
if (q.has("debug")) window.__pose = () => D.players.map(pl => {
  const r = rigs[pl.body];
  if (!r) return null;
  const at = n => (r.bones[n] || r.root).getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(4));
  // the racquet is not parented to anything, so its head is read the way the page places it: butt at the palm,
  // 1.74ft up the shaft — the same number the stroke math uses
  const rh = r.racquet ? r.racquet.position.clone()
    .addScaledVector(new THREE.Vector3(0, 1, 0).applyQuaternion(r.racquet.quaternion), 1.74) : null;
  return { name: pl.name, root: [r.root.position.x, r.root.position.y, r.root.position.z].map(v => +v.toFixed(4)),
           thighL: at("thighL"), shinL: at("shinL"), handR: at("handR"), racquet: rh ? rh.toArray().map(v => +v.toFixed(3)) : null,
           yaw: +(r.yaw || 0).toFixed(4) };
});

/* A still cannot show motion, and the wall clock cannot be trusted in a headless browser: `?point=` and `?shot=`
   both PAUSE the film, so a sweep of them proves nothing at all about whether anybody moves. `__seek` steps the
   film to an exact time with the clock stopped, so a probe can sample every 50ms of FILM time rather than of wall
   time — and `__seg` says where the breaks are, which is the only way to find a change of ends without watching
   five minutes of tennis. `__head` is there because a nod happens at one joint. */
if (q.has("debug")) window.__seek = (t) => { playing = false; pauseUntil = 0; firstFrame = true; T = Math.max(0, t); return T; };
if (q.has("debug")) window.__seg = () => SEG.map(s => ({ n: s.sh.n, rally: s.sh.rally, player: s.sh.player,
  start: +s.start.toFixed(2), dur: +s.dur.toFixed(2), hold: +s.hold.toFixed(2),
  breakAt: +(s.start + s.dur).toFixed(2),
  cross: s.cross ? { dur: s.cross.dur, post: s.cross.post, pass: s.cross.pass.t } : null,
  point: s.point ? s.point.winner : null }));
if (q.has("debug")) window.__head = () => D.players.map(pl => { const r = rigs[pl.body]; if (!r) return null;
  const b = r.bones["head"]; if (!b) return null;
  return { name: pl.name, pitch: +b.rotation.x.toFixed(4), roll: +b.rotation.z.toFixed(4),
           at: b.getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(3)) }; });

/* Which way a nod goes is a fact about the file, not about Blender's conventions: the bone's local axes are
   whatever the exporter wrote. So the axes are measured instead of assumed — rotate one axis at a time and see
   where the top of the head goes. A nod moves it forward and down; a shake moves it sideways. */
if (q.has("debug")) window.__headTest = (axis, ang) => D.players.map(pl => {
  const r = rigs[pl.body]; if (!r) return null;
  const hd = r.bones["head"]; if (!hd) return null;
  const rest = hd.userData.rest || (hd.userData.rest = hd.quaternion.clone());
  const ax = new THREE.Vector3(axis === 0 ? 1 : 0, axis === 1 ? 1 : 0, axis === 2 ? 1 : 0);
  hd.quaternion.copy(rest).multiply(new THREE.Quaternion().setFromAxisAngle(ax, ang));
  // the bone's own origin does not move when the bone turns, so the thing to measure is which way the bone
  // POINTS: a nod tilts its long axis forward, a shake tilts it sideways.
  hd.updateWorldMatrix(true, false);
  const up = new THREE.Vector3(0, 1, 0).transformDirection(hd.matrixWorld).toArray().map(v => +v.toFixed(3));
  hd.quaternion.copy(rest);
  return { name: pl.name, axis, ang, boneDir: up };
});

/* Every move the picture knows about for one player, in the order whereAt walks them. The instrument for "why is
   this body here": a position that does not match the record is either a missing move or two moves overlapping. */
if (q.has("debug")) window.__moves = (name) => (PLAN[name] || []).map(m => ({
  t0: +m.t0.toFixed(2), t1: +m.t1.toFixed(2), from: m.from, to: m.to }));

if (q.has("debug")) window.__audit = () => SEG.map(s => ({
  n: s.sh.n, player: s.sh.player, kind: s.sh.kind, t: s.start,
  pos: whereAt(s.sh.player, s.start), contact: s.sh.contact, met: s.sh.run ? !!s.sh.run.met : null,
}));

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener("keydown", e => {
  if (e.code === "Space") { playing = !playing; e.preventDefault(); }
  if (e.code === "ArrowRight") T += 0.25;
  if (e.code === "ArrowLeft") T = Math.max(0, T - 0.25);
});
if (q.has("t")) { T = parseFloat(q.get("t")); playing = false; }
if (q.has("point")) {
  // a still of the boards: jump to the end of a rally and hold the sign up
  const seg = SEG.find(x => x.sh.rally === parseInt(q.get("point"), 10) && x.point);
  // +0.02 and not exactly the cut instant: at exactly `start + dur` the comparison tl >= cams[1].at is decided by
  // floating point, so the ?point= jump showed the tower about half the time and the closeup the rest of it.
  if (seg) { T = seg.start + seg.dur + 0.02; playing = false; signAlways = true; }
}
if (q.has("shot")) {
  const seg = SEG.find(x => x.sh.n === parseInt(q.get("shot"), 10));
  if (seg) { T = seg.start + seg.dur * parseFloat(q.get("at") || "0.8"); playing = false; }
}

loadBodies().then(() => requestAnimationFrame(tick)).catch(e => {
  fail(`<div><div class="k">the bodies did not load</div><p>${e.message}</p>` +
       `<p>Open this page from a local server, not from the filesystem:<br>` +
       `<code>cd ~/ai_tribe && python3 -m http.server 8000</code><br>` +
       `then <code>http://localhost:8000/games/tennis/demo3d.html</code></p></div>`);
});
</script>
</body>
</html>
