<script>
"use strict";
const D = JSON.parse(document.getElementById("script").textContent);
const C = D.court, L = C.length, W = C.width, NX = C.net_x;

/* ---------- the camera: a pinhole, aimed by rules, not by taste ---------- */
function basis(eye, at){
  const f = norm(sub(at, eye));
  let r = norm(cross(f, [0,0,1]));
  const u = cross(r, f);
  return {f, r, u, eye};
}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const m=Math.hypot(...a)||1;return [a[0]/m,a[1]/m,a[2]/m]};

let CAM = null, FOCAL = 1;
function setCamera(eye, at, fov){
  CAM = basis(eye, at);
  FOCAL = (innerHeight/2) / Math.tan(((fov||52)*Math.PI/180)/2);
}
function proj(p){
  const d = sub(p, CAM.eye);
  const cz = dot(d, CAM.f);
  if (cz <= 1.5) return null;
  return {x: innerWidth/2 + FOCAL*dot(d,CAM.r)/cz,
          y: innerHeight/2 - FOCAL*dot(d,CAM.u)/cz,
          s: FOCAL/cz};
}

/* ---------- camera presets ---------- */
function behind(hitterNorth){
  // the broadcast view from behind the hitter's baseline: the net is the horizon, which is what the
  // game is about, and both baselines are inside the frame
  const dir = hitterNorth ? 1 : -1;
  const eye = [NX - 64*dir, W/2, 33];
  return [eye, [NX + 16*dir, W/2, 0], 50];
}
function closeup(land, dir){
  // low and beside the landing: the line is the subject, so the camera looks across it, not down at it
  const side = land[1] < W/2 ? 1 : -1;
  const eye = [land[0] - 7*dir, land[1] + side*19, 11];
  return [eye, [land[0] + 3*dir, land[1], 0], 52];
}
const LINES = () => [0, W, NX-C.service_line, NX+C.service_line, L]; // x-lines; sidelines handled separately
function nearLine(land){
  let best = null;
  for (const x of [0, L, NX-C.service_line, NX+C.service_line]){
    const d = Math.abs(land[0]-x); if (best===null || d<best.d) best={d, kind:"line", x};
  }
  for (const y of [0, W]){
    const d = Math.abs(land[1]-y); if (d < (best?best.d:99)) best={d, kind:"sideline", y};
  }
  return best;
}

/* ---------- court geometry ---------- */
function seg(a,b){ const A=proj(a),B=proj(b); return (A&&B)?[A,B]:null; }

function drawGround(colour){
  // Tiled, not one big quad: a quad whose corner falls behind the camera cannot be drawn at all, and the
  // low landing camera puts a corner behind itself. Tiles are skipped individually, so the plane is still
  // there. It also lets the run-off and the court be different colours without a second pass.
  const pad = 30, step = 3;
  for (let x=-pad; x<L+pad; x+=step){
    for (let y=-pad; y<W+pad; y+=step){
      const inside = x>=0 && y>=0 && x<L && y<W;
      const e = 0.10;   // a hair of overlap, or the antialiased tile edges draw a grid that is not there
      const q = [[x,y,0],[x+step+e,y,0],[x+step+e,y+step+e,0],[x,y+step+e,0]];
      const pts = q.map(proj);
      if (pts.some(p=>!p)) continue;
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for (let i=1;i<4;i++) ctx.lineTo(pts[i].x,pts[i].y);
      ctx.closePath();
      ctx.fillStyle = inside ? colour : shade(colour, -0.55);
      ctx.fill();
    }
  }
  const lines = [
    [[0,0,0],[L,0,0]], [[0,W,0],[L,W,0]],
    [[0,0,0],[0,W,0]], [[L,0,0],[L,W,0]],
    [[NX-C.service_line,0,0],[NX-C.service_line,W,0]],
    [[NX+C.service_line,0,0],[NX+C.service_line,W,0]],
    [[NX-C.service_line,W/2,0],[NX+C.service_line,W/2,0]],
  ];
  for (const [a,b] of lines){
    const sg = seg(a,b); if (!sg) continue;
    ctx.strokeStyle="rgba(248,246,238,.92)"; ctx.lineWidth=Math.max(1.2, sg[0].s*0.12); ctx.beginPath();
    ctx.moveTo(sg[0].x,sg[0].y); ctx.lineTo(sg[1].x,sg[1].y); ctx.stroke();
  }
  for (const [x,dir] of [[0,1],[L,-1]]){
    const sg = seg([x,W/2,0],[x+1.6*dir,W/2,0]); if(!sg) continue;
    ctx.strokeStyle="rgba(248,246,238,.92)"; ctx.lineWidth=Math.max(1.2,sg[0].s*0.12);
    ctx.beginPath(); ctx.moveTo(sg[0].x,sg[0].y); ctx.lineTo(sg[1].x,sg[1].y); ctx.stroke();
  }
}
function quad(pts, fill){
  ctx.beginPath(); let started=false;
  for (const p of pts){ const q=proj(p); if(!q){return;} if(!started){ctx.moveTo(q.x,q.y);started=true;} else ctx.lineTo(q.x,q.y); }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();

function shade(hex, k){
  const n=parseInt(hex.slice(1),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255;

function drawNet(){

  for (let i=0;i<steps;i++){
    const y0 = W*i/steps, y1 = W*(i+1)/steps;
    const h0 = C.net_centre + (C.net_posts-C.net_centre)*Math.abs(y0-W/2)/(W/2);
    const h1 = C.net_centre + (C.net_posts-C.net_centre)*Math.abs(y1-W/2)/(W/2);

    if (!a||!b||!c||!d) continue;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y);
    ctx.closePath(); ctx.fillStyle="rgba(226,226,218,.13)"; ctx.fill();
    ctx.strokeStyle="rgba(226,226,218,.28)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(c.x,c.y); ctx.stroke();
  }
  // the white cord along the top, and the two posts
  for (let i=0;i<steps;i++){
    const y0 = W*i/steps, y1 = W*(i+1)/steps;
    const h0 = C.net_centre + (C.net_posts-C.net_centre)*Math.abs(y0-W/2)/(W/2);
    const h1 = C.net_centre + (C.net_posts-C.net_centre)*Math.abs(y1-W/2)/(W/2);
    const sg = seg([NX,y0,h0],[NX,y1,h1]);
    if (sg){ ctx.strokeStyle="rgba(250,248,242,.95)"; ctx.lineWidth=Math.max(1.4, sg[0].s*0.10);
      ctx.beginPath(); ctx.moveTo(sg[0].x,sg[0].y); ctx.lineTo(sg[1].x,sg[1].y); ctx.stroke(); }
  }
  for (const y of [0, W]){
    const sg = seg([NX,y,0],[NX,y,C.net_posts]);
    if (sg){ ctx.strokeStyle="rgba(230,230,224,.8)"; ctx.lineWidth=Math.max(1.6, sg[0].s*0.10);
      ctx.beginPath(); ctx.moveTo(sg[0].x,sg[0].y); ctx.lineTo(sg[1].x,sg[1].y); ctx.stroke(); }
  }
}
function drawMarker(pt, name, north, colour){
  const base = proj([pt[0], pt[1], 0]);
  const head = proj([pt[0], pt[1], 5.6]);
  if (!base || !head) return;
  ctx.strokeStyle = colour; ctx.lineWidth = Math.max(2, Math.min(6, base.s*0.22));
  ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(head.x, head.y); ctx.stroke();
  const r = Math.max(5, Math.min(13, base.s*0.60));
  ctx.fillStyle = colour; ctx.beginPath(); ctx.arc(head.x, head.y, r, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.font = `${Math.max(10, r*1.1)}px ui-sans-serif,system-ui`;
  ctx.textAlign="center"; ctx.fillText(name, head.x, head.y - r*1.9);
  // a foot mark, so a marker reads as standing still rather than floating
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath();
  ctx.ellipse(base.x, base.y, r*1.5, r*0.55, 0, 0, 7); ctx.fill();
}

/* ---------- the film ---------- */
const TRACE = 0.02;
const shots = D.shots;
let SEG = [];                       // one entry per shot: {shot, start, dur, cam}
let PLAN = {};                      // who was running, from where to where, and when
let T = 0, playing = true, T0 = performance.now();

function buildTimeline(){
  let t = 0.8;
  for (const s of shots){
    const dur = Math.max(0.35, s.path.length*TRACE);
    const hold = s.in ? 0.75 : 1.6;          // the pause after the ball has landed
    SEG.push({shot: s, start: t, dur, hold, cam: chooseCams(s, dur)});
    // The record now carries a run per shot — where the receiver started, where they met the ball, how long it
    // took. Markers follow it, so they no longer jump from contact to contact.
    if (s.run) (PLAN[s.run.player] = PLAN[s.run.player] || []).push(
      {t0: t + s.run.t0, t1: t + Math.min(s.run.t1, dur), from: s.run.from, to: s.run.to});
    t += dur + hold;
  }
}
function whereAt(name, T){
  const start = (D.start.find(p => p.name === name) || {at: [0, W/2]}).at;
  let pos = start;
  for (const m of (PLAN[name] || [])){
    if (T >= m.t1) pos = m.to;
    else if (T > m.t0){
      const k = (T - m.t0) / Math.max(0.05, m.t1 - m.t0);
      return [m.from[0] + (m.to[0]-m.from[0])*k, m.from[1] + (m.to[1]-m.from[1])*k];
    } else break;
  }
  return pos;
}
function chooseCams(s, dur){
  const dir = s.north ? 1 : -1;
  const contact = [s.contact[0], s.contact[1], 0];
  const list = [{at:0, cam: behind(s.north)}];
  const land = s.land;
  if (land){
    const nl = nearLine(land);
    const endsRally = !s.in;
    if ((nl && nl.d < 4.0) || endsRally){
      list.push({at: dur*0.22, cam: closeup(land, dir)});
    }
  }
  return list;
}
function camAt(seg, tLocal){
  let cam = seg.cam[0].cam;
  for (const c of seg.cam) if (tLocal >= c.at) cam = c.cam;
  return cam;
}

/* ---------- drawing a frame ---------- */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const COURT = {clay:"#b4553a", hard:"#4f6f86", grass:"#5e7a4a"}[D.surface] || "#b4553a";

function resize(){
  const dpr = Math.min(2, devicePixelRatio||1);
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", resize); resize();

function frame(now){
  const dt = Math.min(0.05, (now - T0)/1000); T0 = now;
  if (playing) T += dt;
  const lastSeg = SEG[SEG.length-1];
  if (T > lastSeg.start + lastSeg.dur + lastSeg.hold) T = 0;

  let seg = SEG[SEG.length-1];
  for (const s of SEG) if (T >= s.start && T < s.start + s.dur + s.hold) { seg = s; break; }
  const tLocal = T - seg.start;

  const cam = camAt(seg, tLocal);
  setCamera(cam[0], cam[1], cam[2]);

  // sky / air
  const g = ctx.createLinearGradient(0,0,0,innerHeight);
  g.addColorStop(0,"#1a2028"); g.addColorStop(.55,"#141a20"); g.addColorStop(1,"#0d1013");
  ctx.fillStyle=g; ctx.fillRect(0,0,innerWidth,innerHeight);

  drawGround(COURT);

  // landing marks from earlier shots in this rally, fading
  for (const s of shots){
    if (s.rally !== seg.shot.rally || s.n > seg.shot.n || !s.land) continue;
    const age = seg.shot.n - s.n;
    const p = proj([s.land[0], s.land[1], 0]); if (!p) continue;
    ctx.strokeStyle = s.in ? `rgba(255,255,255,${0.30*Math.max(0,1-age/4)})`
                           : `rgba(255,120,90,${0.35*Math.max(0,1-age/4)})`;
    ctx.lineWidth = Math.max(1, p.s*0.09);
    ctx.beginPath(); ctx.ellipse(p.x,p.y, p.s*1.1, p.s*0.45, 0, 0, 7); ctx.stroke();
  }

  drawNet();

  // the ball
  const tt = Math.min(tLocal, seg.dur);
  const idx = Math.min(seg.shot.path.length-1, Math.max(0, Math.round(tt/TRACE)));
  const path = seg.shot.path;
  const bp = path[idx];

  // trail
  for (let i=Math.max(0,idx-26); i<idx; i++){
    const a = proj(path[i]), b = proj(path[i+1] || path[i]); if (!a||!b) continue;
    const k = (i-(idx-26))/26;
    ctx.strokeStyle = `rgba(255,228,140,${0.30*k})`;
    ctx.lineWidth = Math.max(1, a.s*0.10*k+0.5);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  if (bp){
    const shadow = proj([bp[0], bp[1], 0]);
    if (shadow){ ctx.fillStyle="rgba(0,0,0,.30)"; ctx.beginPath();
      ctx.ellipse(shadow.x, shadow.y, shadow.s*0.6, shadow.s*0.22, 0, 0, 7); ctx.fill(); }
    const b = proj(bp);
    if (b){ const r = Math.max(3.2, b.s*0.46);
      ctx.fillStyle="#f6e7a8"; ctx.beginPath(); ctx.arc(b.x,b.y,r,0,7); ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=1; ctx.stroke(); }
  }

  // the landing, named: a close call is the only moment in tennis that needs a caption
  if (seg.shot.land && tLocal > seg.dur - 0.06){
    const L2 = seg.shot.land, pl = proj([L2[0], L2[1], 0]);
    const nl = nearLine(L2);
    if (pl && nl){
      const where = (nl.kind === "sideline") ? "the sideline"
                  : (Math.abs(nl.x - (NX-C.service_line)) < 0.01 || Math.abs(nl.x - (NX+C.service_line)) < 0.01)
                    ? "the service line" : "the baseline";
      const txt = `${seg.shot.in ? "in" : "out" }, ${nl.d.toFixed(1)}ft from ${where}`;
      ctx.font = "600 15px ui-sans-serif,system-ui";
      ctx.textAlign = "left";
      ctx.fillStyle = seg.shot.in ? "rgba(255,255,255,.94)" : "rgba(255,150,120,.96)";
      ctx.fillText(txt, pl.x + 26, pl.y - 10);
      ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pl.x + 8, pl.y - 6); ctx.lineTo(pl.x + 22, pl.y - 12); ctx.stroke();
    }
  }

  // players: wherever the record's runs leave them at this instant
  for (const pl of D.players){
    drawMarker(whereAt(pl.name, T), pl.name, pl.north, pl.north ? "#8fc6ff" : "#ffb98f");
  }

  hud(seg, tLocal);
  requestAnimationFrame(frame);
}

/* ---------- the words ---------- */
const el = id => document.getElementById(id);
function hud(seg, tLocal){
  const s = seg.shot;
  el("surface").textContent = `${D.surface} · wind ${D.wind.direction} ${D.wind.mph}mph · clock ${D.clock_ms}`;
  el("rally").textContent = `rally ${s.rally} of ${D.rallies.length} · shot ${s.i}`;
  el("who").textContent = s.player;
  const sw = el("sweet");
  sw.textContent = s.sweet ? "clean" : "framed";
  sw.className = "badge " + (s.sweet ? "clean" : "frame");
  el("shotline").textContent =
    `face ${s.face > 0 ? "+" : ""}${s.face}°  power ${Math.round(s.power)}  aim ${s.aim}ft  leaving at ${Math.round(s.power*1.05)}mph`;
  el("why").textContent = s.why;

  if (s.corridor[0] !== null){
    const [lo, hi] = s.corridor, span = 30, zero = -12;   // the bar runs -12° to +18°
    const x = v => Math.max(0, Math.min(100, (v - zero)/span*100));
    el("win").style.left = x(lo)+"%"; el("win").style.width = Math.max(1.2, x(hi)-x(lo))+"%";
    el("tick").style.left = x(Math.max(-12, Math.min(18, s.face)))+"%";
    el("winline").textContent =
      `${(hi-lo).toFixed(1)}° wide (${lo.toFixed(1)}° to ${hi.toFixed(1)}°) — this shot at ${s.face.toFixed(1)}°`;
  } else {
    el("win").style.width="0%"; el("winline").textContent = "no face angle lands this swing in the court";
  }

  el("players").innerHTML = D.players.map(p =>
    `<div><span class="swatch" style="background:${p.north?"#8fc6ff":"#ffb98f"}"></span>` +
    `${p.name} <span class="mono" style="color:var(--dim)">${p.rating.toFixed(1)} · ${p.balls} balls</span></div>`
  ).join("");

  const cut = seg.cam.length > 1 && tLocal >= seg.cam[1].at && tLocal < seg.cam[1].at + 0.5;
  el("cut").className = cut ? "on" : "";
}

/* ---------- controls: space pauses, arrows step, ?t= freezes for a still ---------- */
addEventListener("keydown", e => {
  if (e.code === "Space"){ playing = !playing; e.preventDefault(); }
  if (e.code === "ArrowRight"){ T += 1/12; }
  if (e.code === "ArrowLeft"){ T = Math.max(0, T - 1/12); }
});
buildTimeline();
const q = new URLSearchParams(location.search);
if (q.has("t")){ T = parseFloat(q.get("t")); playing = false; }
if (q.has("shot")){
  const n = parseInt(q.get("shot"),10);
  const seg = SEG.find(s => s.shot.n === n);
  if (seg){ T = seg.start + seg.dur*parseFloat(q.get("at")||"0.8"); playing = false; }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
