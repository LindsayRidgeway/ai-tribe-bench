<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask a participant</title>
<!--
  The phone page: a static file on GitHub Pages, so it needs no server, no key and no install.

  Send opens GitHub's "new issue" form with the question prefilled as `@tribe <name>: <question>`. Tapping
  Submit there is what starts the work: the repository's `interactive` workflow runs on a GitHub runner,
  wakes that participant, and posts the reply as a comment in the same thread. This page cannot see the
  reply — it has no server and no token — so it does not pretend to have a reply box.

  The local page (lab/chat.py) is the one with a live reply box, on a computer.
-->
<style>
  :root { --ink:#1b1b1b; --dim:#6b6b6b; --line:#d8d4cc; --bg:#fbf9f5; --accent:#7a3b2e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 ui-serif, Georgia, serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 32px; }
  h1 { font-size:19px; margin:0 0 2px; }
  .sub { font:14px/1.45 ui-sans-serif, system-ui, sans-serif; color:var(--dim); margin:0 0 18px; }
  label { display:block; font:600 12px/1.4 ui-sans-serif, system-ui, sans-serif; text-transform:uppercase;
          letter-spacing:.08em; color:var(--dim); margin:16px 0 6px; }
  select, textarea, a.go { width:100%; font:17px/1.5 inherit; color:var(--ink); background:#fff;
          border:1px solid var(--line); border-radius:8px; padding:11px 12px; }
  textarea { resize:vertical; min-height:110px; }
  a.go { display:block; text-align:center; margin-top:16px; background:var(--accent); color:#fff;
         border-color:var(--accent); font:600 17px/1 ui-sans-serif, system-ui, sans-serif;
         padding:16px 12px; text-decoration:none; }
  a.go[aria-disabled="true"] { opacity:.45; pointer-events:none; }
  .after { font:14px/1.5 ui-sans-serif, system-ui, sans-serif; color:var(--dim); margin-top:14px; }
  .after a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Ask a participant</h1>
  <p class="sub">It answers in the GitHub issue this opens — usually inside a minute.</p>

  <label for="member">Participant</label>
  <select id="member"><option value="">…</option></select>

  <label for="msg">Your message</label>
  <textarea id="msg" placeholder="Ask it something."></textarea>

  <a class="go" id="send" href="#" aria-disabled="true">Open in GitHub</a>

  <p class="after" id="after">Next screen has the question already written. Tap <b>Submit new issue</b> there;
    the answer appears as a comment.</p>
</main>

<script>
const REPO = "LindsayRidgeway/ai-tribe-bench";     // ← your fork, if you forked
const $ = (id) => document.getElementById(id);

function buildLink() {
  const who = $("member").value, text = $("msg").value.trim();
  if (!who || !text) { $("send").setAttribute("aria-disabled", "true"); $("send").href = "#"; return; }
  $("send").href = `https://github.com/${REPO}/issues/new`
                 + `?title=${encodeURIComponent("Ask " + who)}`
                 + `&body=${encodeURIComponent("@tribe " + who + ": " + text)}`;
  $("send").removeAttribute("aria-disabled");
}

async function loadMembers() {
  try {
    const { members } = await (await fetch("members.json", { cache: "no-store" })).json();
    const sel = $("member");
    sel.innerHTML = "";
    for (const m of members) {
      const o = document.createElement("option");
      o.value = m.name; o.textContent = m.name;
      sel.appendChild(o);
    }
    if (!members.length) $("after").textContent = "No participants published. Run python3 lab/members.py --write.";
    buildLink();
  } catch (e) {
    $("after").textContent = "Cannot read members.json beside this page.";
  }
}

$("member").addEventListener("change", buildLink);
$("msg").addEventListener("input", buildLink);
$("send").addEventListener("click", () => {
  $("after").innerHTML = 'Question opening in GitHub. After you tap <b>Submit new issue</b>, the reply is a '
    + `comment on your issue — <a href="https://github.com/${REPO}/issues?q=is%3Aissue">your issues here</a>.`;
});
loadMembers();
</script>
</body>
</html>
